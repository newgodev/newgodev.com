<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>CES P.25 — 揀答案再寫紙</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1a1a1a;--muted:#666;--acc:#2a6f5b;--line:#ddd;--pick:#e8f3ef;--pickb:#2a6f5b;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
header{padding:1rem 1.25rem;background:var(--acc);color:#fff}
header h1{margin:0;font-size:1.15rem}
header p{margin:.4rem 0 0;opacity:.95;font-size:.9rem}
main{max-width:720px;margin:0 auto;padding:1rem;padding-bottom:3rem}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem}
.q h2{margin:0 0 .35rem;font-size:1rem}
.q .meta{color:var(--muted);font-size:.85rem;margin-bottom:.5rem}
.line{border-top:1px dashed var(--line);padding:1rem 0}
.line:first-of-type{border-top:0;padding-top:0}
.line .tag{display:block;font-weight:700;font-size:.95rem;margin-bottom:.55rem}
.sec{display:inline-block;background:#e8f3ef;color:var(--acc);font-size:.75rem;padding:.15rem .5rem;border-radius:999px;margin-right:.35rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{
  display:block;width:100%;text-align:left;
  background:#fafafa;border:2px solid var(--line);border-radius:12px;
  padding:.85rem 1rem;font:inherit;font-size:1rem;color:var(--ink);
  cursor:pointer;min-height:3.2rem;
}
.opt.selected{background:var(--pick);border-color:var(--pickb);box-shadow:0 0 0 1px var(--pickb)}
.opt .mark{display:inline-block;width:1.1rem;height:1.1rem;border:2px solid #999;border-radius:50%;margin-right:.55rem;vertical-align:-.15rem;flex-shrink:0}
.opt.selected .mark{background:var(--pickb);border-color:var(--pickb);box-shadow:inset 0 0 0 3px #fff}
.opt-row{display:flex;align-items:flex-start;gap:0}
.extra-wrap{margin-top:.55rem}
.extra-lab{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.3rem}
.free{width:100%;padding:.75rem .85rem;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:1rem;min-height:3rem;background:#fff}
.free:focus{border-color:var(--acc);outline:0}
.free.own{border-color:var(--acc);background:#f7fcfa}
#preview{white-space:pre-wrap;background:#111;color:#f5f5f5;padding:1rem;border-radius:12px;font-size:1rem;min-height:8rem}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0;position:sticky;bottom:0;background:var(--bg);padding:.6rem 0;z-index:5}
button.act{font:inherit;border:0;border-radius:999px;padding:.7rem 1.2rem;cursor:pointer;background:var(--acc);color:#fff;font-size:1rem}
button.secbtn{background:#444}
.note{font-size:.85rem;color:var(--muted);margin-top:.5rem}
</style>
</head>
<body>
<header>
  <h1>CES 單元 3.1 · 教科書 P.25（3 分）</h1>
  <p>每行：先撳大粒掣揀一句 → 下面可以自由加字。想成句自己寫就撳「自己寫」。寫完睇預覽，抄紙前影相畀 num 1。</p>
</header>
<main>
  <div class="q">
    <h2>題目</h2>
    <p class="meta">根據以上資料及個人所知，提出一項幫助青少年建立正確性觀念的方法。（3 分）<br/>格式：治本（約2–3行）→ 具體（約5–6行）→ 成效（約3–4行）＝共約12行</p>
  </div>

  <div class="q" id="form"></div>

  <div class="actions">
    <button type="button" class="act" id="btnPreview">更新預覽</button>
    <button type="button" class="act secbtn" id="btnCopy">複製全文</button>
  </div>
  <div class="q">
    <h2>預覽（抄去實紙用）</h2>
    <div id="preview">仲未揀……撳上面大粒掣揀句先。</div>
    <p class="note" id="miss"></p>
  </div>
</main>
<script>
const lines = [
  {sec:'治本', n:1, prompt:'第1行 · 點出問題', opts:[
    '現時部分青少年的性觀念並不正確，容易受錯誤資訊影響。',
    '不少青少年對「性」與「愛」的關係缺乏正確認識。',
    '青少年若缺乏正確性觀念，或會輕率作出親密行為。'
  ]},
  {sec:'治本', n:2, prompt:'第2行 · 講根源（書）', opts:[
    '根源在於性知識不足，以及誤以為「有性便等於有愛」。',
    '他們容易接觸色情資訊，因而對親密關係產生誤解。',
    '部分人未明白親密界限與責任，以致觀念偏差。'
  ]},
  {sec:'治本', n:3, prompt:'第3行 · 過渡到方法', opts:[
    '因此，應從教育入手，協助他們建立正確性觀念。',
    '故此，需要透過正規途徑加強性教育。',
    '因此，必須先糾正錯誤觀念，才能減少輕率行為。'
  ]},
  {sec:'具體', n:4, prompt:'第4行 · 提出一項方法（邊個做）', opts:[
    '建議由學校與教師舉辦性教育講座或課堂。',
    '建議衞生署學生健康服務向青少年提供正確性知識。',
    '建議家計會或相關非政府機構到校進行性教育活動。'
  ]},
  {sec:'具體', n:5, prompt:'第5行 · 對象', opts:[
    '對象為中學生／青少年，尤其是缺乏正確認識者。',
    '活動應面向全級或相關年級學生，確保覆蓋面。',
    '重點對象是即將踏入青春期或已開始約會的青少年。'
  ]},
  {sec:'具體', n:6, prompt:'第6行 · 內容① 尊重意願', opts:[
    '內容應強調尊重對方意願，不可強迫任何親密行為。',
    '教導學生：即使有感情基礎，仍必須得到對方同意。',
    '說明「同意一樣行為，不等於同意全部親密行為」。'
  ]},
  {sec:'具體', n:7, prompt:'第7行 · 內容② 愛與責任', opts:[
    '亦應指出性須建基於穩固、成熟的愛與責任，而非衝動。',
    '說明性只是表達愛的其中一種方式，並非感情的全部。',
    '強調健康關係需要溝通、尊重與承諾，而非只追求刺激。'
  ]},
  {sec:'具體', n:8, prompt:'第8行 · 內容③ 守法／界限', opts:[
    '同時講解訂定親密界限的重要，並提醒須守法。',
    '指出與未滿16歲者性交屬違法，必須清楚法律界線。',
    '教導學生如何用溝通表明立場，拒絕越界要求。'
  ]},
  {sec:'具體', n:9, prompt:'第9行 · 點樣做（途徑）', opts:[
    '具體可透過課堂討論、講座，並輔以衞生署網上資源學習。',
    '可安排小組活動與個案討論，讓學生練習表達界線。',
    '可結合評估站／工作紙，檢視學生是否掌握正確觀念。'
  ]},
  {sec:'成效', n:10, prompt:'第10行 · 成效角度①', opts:[
    '就成效而言，此方法具針對性，直接糾正錯誤性觀念。',
    '就成效而言，此屬治本措施，從認知改變著手，而非只靠懲罰。',
    '就成效而言，學校渠道覆蓋面廣，能接觸大量青少年。'
  ]},
  {sec:'成效', n:11, prompt:'第11行 · 成效角度②', opts:[
    '長遠而言，學生建立正確價值後，較少因誤解而重蹈覆轍。',
    '教育具持續影響，有助減少輕率親密行為及相關風險。',
    '配合專業機構資料，知識較準確，說服力亦較高。'
  ]},
  {sec:'成效', n:12, prompt:'第12行 · 收句', opts:[
    '因此，成效高。',
    '因此，此方法的成效頗高。',
    '綜上所述，此方法能有效幫助青少年建立正確性觀念。'
  ]},
];

const form = document.getElementById('form');
const state = lines.map(() => ({ pick: null, extra: '' }));

form.innerHTML = lines.map((L,i)=>{
  const optBtns = L.opts.map((t,j)=>`
    <button type="button" class="opt" data-i="${i}" data-j="${j}" aria-pressed="false">
      <span class="opt-row"><span class="mark"></span><span>${t}</span></span>
    </button>`).join('');
  return `<div class="line" data-i="${i}">
    <div class="tag"><span class="sec">${L.sec}</span>${L.prompt}</div>
    <div class="opts">
      ${optBtns}
      <button type="button" class="opt" data-i="${i}" data-j="free" aria-pressed="false">
        <span class="opt-row"><span class="mark"></span><span>✏️ 自己寫成句（唔用上面）</span></span>
      </button>
    </div>
    <div class="extra-wrap">
      <label class="extra-lab" id="lab${i}" for="ex${i}">自由加字（接喺揀咗嗰句後面；可留空）</label>
      <textarea class="free" id="ex${i}" rows="2" placeholder="想加嘅字打喺度……" data-extra="${i}"></textarea>
    </div>
  </div>`;
}).join('');

function updateLab(i){
  const lab = document.getElementById('lab'+i);
  const ta = document.getElementById('ex'+i);
  if (state[i].pick === 'free'){
    lab.textContent = '自己寫成句（呢度係全文）';
    ta.placeholder = '喺度寫你嗰成句……';
    ta.classList.add('own');
  } else {
    lab.textContent = '自由加字（接喺揀咗嗰句後面；可留空）';
    ta.placeholder = '想加嘅字打喺度……';
    ta.classList.remove('own');
  }
}

function select(i, j){
  state[i].pick = j;
  const line = form.querySelector(`.line[data-i="${i}"]`);
  line.querySelectorAll('.opt').forEach(b=>{
    const on = b.getAttribute('data-j') === String(j);
    b.classList.toggle('selected', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  updateLab(i);
  preview();
  if (j === 'free') {
    const ta = document.getElementById('ex'+i);
    setTimeout(()=>ta && ta.focus(), 50);
  }
}

form.addEventListener('click', e=>{
  const btn = e.target.closest('button.opt');
  if (!btn) return;
  const i = +btn.getAttribute('data-i');
  const j = btn.getAttribute('data-j');
  select(i, j === 'free' ? 'free' : +j);
});

form.addEventListener('input', e=>{
  const ta = e.target.closest('textarea[data-extra]');
  if (!ta) return;
  const i = +ta.getAttribute('data-extra');
  state[i].extra = ta.value;
  preview();
});

function lineText(i){
  const s = state[i];
  const extra = (s.extra || '').trim();
  if (s.pick === null) return '';
  if (s.pick === 'free') return extra;
  const base = lines[i].opts[s.pick];
  if (!extra) return base;
  // if extra already starts like a sentence, append with no forced space for CJK
  return base + extra;
}

function build(){
  return lines.map((_,i)=>lineText(i)).filter(Boolean).join('\n');
}

function preview(){
  const missing = state.filter(s=>s.pick===null).length;
  const missFree = state.filter(s=>s.pick==='free' && !(s.extra||'').trim()).length;
  document.getElementById('preview').textContent = build() || '仲未揀……撳上面大粒掣揀句先。';
  const miss = document.getElementById('miss');
  if (missing) miss.textContent = `仲有 ${missing} 行未揀。`;
  else if (missFree) miss.textContent = `有 ${missFree} 行揀咗「自己寫」但仲未打字。`;
  else miss.textContent = '12 行齊——可以複製，或者影相畀 num 1 睇。';
}

document.getElementById('btnPreview').onclick = preview;
document.getElementById('btnCopy').onclick = async ()=>{
  preview();
  const t = build();
  if (!t){ alert('未有內容，先撳大粒掣揀句。'); return; }
  try{ await navigator.clipboard.writeText(t); alert('已複製！可以貼去備忘再抄實紙。'); }
  catch(e){ alert('複製失敗，請手動長按預覽文字複製。'); }
};
preview();
</script>
</body>
</html>
