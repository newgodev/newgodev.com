<!DOCTYPE html>
<html lang="zh-HK">
<head>
<script>if(location.protocol==="http:")location.replace("https://"+location.host+location.pathname+location.search);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作文 由大綱寫出來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0c0c;--muted:#505a5f;--line:#b1b4b6;--blue:#1d4ed8;--red:#d4351c;--hi:#ffdd00;--ok:#00703c}
*{box-sizing:border-box}
html{color-scheme:light;background:#fff;font-size:17px}
body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans HK",Arial,sans-serif;line-height:1.7}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:6px solid #1d70b8;padding:10px 16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-weight:900;color:#fff;background:#1d70b8;border-radius:4px;padding:2px 12px;font-size:1rem}
.num{color:var(--muted);font-size:.85rem}
.legend{font-size:.85rem;margin-left:8px}
.legend b.c{color:var(--blue)} .legend b.o{color:var(--red)}
.ctrl{margin-left:auto;display:flex;gap:8px}
.ctrl button{font-family:inherit;font-size:.9rem;font-weight:700;padding:7px 14px;border:2px solid var(--ink);background:#fff;border-radius:4px;cursor:pointer}
.ctrl button.main{background:var(--ink);color:#fff}
.say{font-size:1.12rem;font-weight:700;margin:8px 0 2px;min-height:3.2em}
.grid{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:16px;padding:14px 16px 40px;align-items:start}
.col h2{font-size:.95rem;font-weight:900;margin:0 0 6px}
.col h2 span{font-weight:400;color:var(--muted);margin-left:6px}
.pic{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.pic img{display:block;width:100%;height:auto}
.page{display:none}.page.on{display:block;animation:fade .5s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.box{position:absolute;border-radius:4px;border:3px solid transparent;transition:all .35s}
.box.hl{border-color:var(--hi);background:rgba(255,221,0,.28);animation:pulse 1.2s infinite}
.box.red{border-color:var(--red);background:rgba(212,53,28,.12);animation:pulse 1.2s infinite}
.box.ok{border-color:var(--ok);background:rgba(0,112,60,.12)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,221,0,0)}50%{box-shadow:0 0 0 8px rgba(255,221,0,.45)}}
.stamp{position:absolute;right:-4px;top:-26px;font-size:.75rem;font-weight:900;color:#fff;border-radius:3px;padding:1px 7px;white-space:nowrap}
.box.red .stamp{background:var(--red)} .box.ok .stamp{background:var(--ok)}
.paper{border:2px solid var(--ink);border-radius:4px;padding:10px 14px 16px;background:#fff;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#c9ccce 33px,#c9ccce 34px);line-height:34px;min-height:560px}
.para{margin:0 0 34px;font-size:1rem;text-indent:2em}
.para .lab{display:block;text-indent:0;font-size:.72rem;font-weight:900;color:var(--muted);line-height:34px}
.c{color:var(--blue)}
.o{color:var(--red);font-weight:700}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:-3px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fly{position:fixed;z-index:60;background:var(--hi);border:2px solid var(--ink);border-radius:5px;padding:4px 10px;font-size:.9rem;font-weight:700;max-width:320px;
  pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:left var(--tf,.95s) cubic-bezier(.5,0,.2,1),top var(--tf,.95s) cubic-bezier(.5,0,.2,1),transform var(--tf,.95s),opacity .3s}
.pop{position:fixed;z-index:61;background:var(--red);color:#fff;font-weight:900;font-size:.85rem;padding:3px 10px;border-radius:999px;pointer-events:none;animation:pop 1.6s forwards}
@keyframes pop{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
body.done .paper{border-color:var(--ok);box-shadow:0 0 0 5px #cce2d8}
.grid{grid-template-columns:1fr 1fr 1.1fr .8fr}
.board{position:sticky;top:120px;max-height:calc(100vh - 135px);overflow:auto;background:#d9b98a;border-radius:6px;padding:12px 10px;
  box-shadow:inset 0 0 0 3px #b8935f;display:flex;flex-direction:column;gap:14px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.bhead h2{margin:0}
.bhead button{font-family:inherit;font-size:.78rem;font-weight:700;padding:4px 10px;border:2px solid var(--ink);background:#fff;border-radius:4px;cursor:pointer}
.bempty{font-size:.85rem;color:#5a4526}
.note{position:relative;border-radius:3px;padding:8px 7px 8px;box-shadow:0 4px 10px rgba(0,0,0,.28);transform:rotate(-1.2deg);cursor:pointer;transition:transform .2s;background:#fff3a3}
.note:nth-child(even){transform:rotate(1.1deg)}
.note:hover{transform:scale(1.04) rotate(0)}
.note::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:#d4351c;box-shadow:0 2px 3px rgba(0,0,0,.45)}
.note.q{background:#fff3a3}.note.h{background:#d4f2d4}.note.m{background:#ffd3cb}.note.f{background:#d5e5ff}.note.o{background:#ffd9ee}
.note .crop{width:100%;background-repeat:no-repeat;background-color:#fff;border:1px solid rgba(0,0,0,.2);border-radius:2px}
.note .lab{font-size:.84rem;font-weight:700;margin-top:5px;line-height:1.45}
.note .lab i{font-style:normal;font-size:.7rem;color:#fff;background:#0b0c0c;border-radius:3px;padding:0 5px;margin-right:5px}
.note.o .lab{color:var(--red)}
.note.land{animation:land .5s}
@keyframes land{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.zoom{position:fixed;z-index:70;background-repeat:no-repeat;background-color:#fff;border:5px solid var(--hi);border-radius:6px;
  box-shadow:0 14px 44px rgba(0,0,0,.45);transition:left var(--tz,.6s) cubic-bezier(.4,0,.2,1),top var(--tz,.6s) cubic-bezier(.4,0,.2,1),width var(--tz,.6s) cubic-bezier(.4,0,.2,1),height var(--tz,.6s) cubic-bezier(.4,0,.2,1);pointer-events:none}
.zoomcap{position:fixed;z-index:71;background:#0b0c0c;color:#fff;font-weight:900;font-size:1rem;padding:5px 12px;border-radius:4px;pointer-events:none;transition:opacity .3s}
.think{position:fixed;z-index:72;max-width:360px;background:#fff;border:3px solid var(--red);border-radius:18px;padding:10px 14px;font-size:.95rem;font-weight:700;line-height:1.55;
  box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;animation:thinkin .35s}
.think b{display:block;font-size:.78rem;color:var(--red);margin-bottom:3px}
.think::after{content:"";position:absolute;left:28px;bottom:-14px;width:18px;height:18px;background:#fff;border-right:3px solid var(--red);border-bottom:3px solid var(--red);transform:rotate(45deg)}
@keyframes thinkin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
body{padding-bottom:70px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0b0c0c;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.player button{font-family:inherit;font-size:1rem;font-weight:900;width:44px;height:36px;border:0;border-radius:4px;background:#fff;color:#0b0c0c;cursor:pointer}
.track{position:relative;flex:1;height:14px;background:#444;border-radius:999px;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hi);border-radius:999px}
.knob{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff;border:3px solid var(--hi);left:0}
.tick{position:absolute;top:-6px;width:2px;height:26px;background:#888}
.tick span{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:.66rem;color:#bbb;white-space:nowrap}
.spd{font-family:inherit;font-size:.9rem;font-weight:900;background:#fff;color:#0b0c0c;border:0;border-radius:4px;padding:6px 8px;cursor:pointer}
.ptime{font-size:.85rem;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
@media (max-width:1250px){.grid{grid-template-columns:1fr 1fr}.board{position:static;max-height:none}}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.cam{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:4px;background:#f3f2f1;min-height:420px}
.cam .page{position:absolute;left:0;top:0;border:0;border-radius:0;transform-origin:0 0;animation:none;
  transition:width var(--tc,.8s) cubic-bezier(.4,0,.2,1),transform var(--tc,.8s) cubic-bezier(.4,0,.2,1)}
.brain{margin-top:10px;border:3px solid var(--red);border-radius:14px;padding:10px 12px;background:#fff;overflow:auto;min-height:120px;transition:box-shadow .3s}
.brain .bh{font-weight:900;color:var(--red);font-size:.85rem;margin-bottom:4px}
.brain .bt{font-size:1.02rem;font-weight:700;line-height:1.65}
.brain.on{box-shadow:0 0 0 6px rgba(212,53,28,.2)}
.paper{position:relative;line-height:30px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,#c9ccce 29px,#c9ccce 30px);min-height:0}
.para{margin:0 0 30px;font-size:.96rem}
.para .lab{line-height:30px}
.board{display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:12px 10px}
.bhead,.bempty{grid-column:1/-1}
.note .lab{font-size:.74rem;line-height:1.35}
.note.br{background:#eadcff}
.spdwrap{display:flex;align-items:center;gap:6px;color:#fff;font-size:.85rem;font-weight:900}
.spdwrap input{width:140px;accent-color:#ffdd00;cursor:pointer}
.spdwrap span{min-width:50px}
@media (min-width:1101px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;padding-bottom:0}
  .top{position:relative;flex:none}
  .grid{flex:1;min-height:0;grid-template-columns:.95fr 1.15fr 1.15fr .95fr;padding:10px 14px;gap:12px}
  .col{display:flex;flex-direction:column;min-height:0;height:100%}
  .col h2{flex:none}
  .brain{flex:1}
  .cam{flex:1;min-height:0}
  .paper{flex:1;overflow:auto}
  .board{position:relative;top:0;flex:1;max-height:none;min-height:0}
  .player{position:relative;flex:none}
}
.box.flash{border-color:#ff00aa !important;background:rgba(255,0,170,.2) !important;animation:pulse .6s infinite}
.flashw{background:#fff08a;outline:3px solid #ff00aa;border-radius:3px}
</style>
</head>

    <div class="ctrl"><button id="prev">← 上一步</button><button id="play" class="main">▶ 播放</button><button id="next">下一步 →</button></div>
  </div>
  <p class="say" id="say"></p>
</div>

      z.style.left=((innerWidth-W)/2)+"px"; z.style.top=(innerHeight*0.24)+"px"; z.style.width=W+"px"; z.style.height=H+"px";
    }); });
    later(function(){ cap.style.left=((innerWidth-W)/2)+"px"; cap.style.top=(innerHeight*0.24+H+14)+"px"; cap.style.opacity="1"; }, 600);
    later(function(){
      cap.style.opacity="0";
      var bd=$("board"); if(bd.scrollHeight>bd.clientHeight+4) bd.scrollTop=note.offsetTop-bd.clientHeight+note.offsetHeight+30;
      var c=note.querySelector(".crop").getBoundingClientRect();
      z.style.left=c.left+"px"; z.style.top=c.top+"px"; z.style.width=c.width+"px"; z.style.height=c.height+"px";
    }, 2100);
    later(function(){ z.remove(); cap.remove(); note.style.visibility="visible"; if(my!==token) return; note.classList.add("land"); done(); }, 2750);
  }

  function typeInto(span,text,my,done){
    var i=0, caret=document.createElement("span"); caret.className="caret"; span.after(caret);
    (function tick(){
      if(my!==token){ caret.remove(); return; }
      span.textContent=text.slice(0,++i); scrollPaper(span);
      if(i<text.length) later(tick, span.className==="o"?55:22); else { caret.remove(); done(); }
    })();
  }

  function flyFrom(boxKey,par,text,my,done){
    var b=$("bx_"+boxKey);
    if(!b || !b.offsetParent || b.getBoundingClientRect().width===0){ done(); return; }
    var ra=b.getBoundingClientRect(), p=$(par), rb=p.getBoundingClientRect();
    var f=document.createElement("div"); f.className="fly"; f.textContent=text.length>34?text.slice(0,34)+"……":text;
    f.style.left=ra.left+"px"; f.style.top=ra.top+"px"; document.body.appendChild(f);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      f.style.left=(rb.left+20)+"px"; f.style.top=(rb.bottom-30)+"px"; f.style.transform="scale(.85)";
    }); });
    later(function(){ f.style.opacity="0"; }, 950);
    later(function(){ f.remove(); if(my===token) done(); }, 1150);
  }

  function showThink(span,text,my,done,tkey){
    var br=$("brain"), bt=$("braintext"); br.classList.add("on"); bt.textContent="";
    var i=0;
    (function tk(){ if(my!==token){ br.classList.remove("on"); return; } bt.textContent=text.slice(0,++i); br.scrollTop=br.scrollHeight;
      if(i<text.length) later(tk,26); else later(function(){ br.classList.remove("on"); if(my!==token) return;
        var n=addNote(tkey,false); n.classList.add("land"); done(); },1100); })();
  }
  function scrollPaper(span){
    var p=$("paper"); if(p.scrollHeight<=p.clientHeight+2) return;
    var y=span.offsetTop+span.offsetHeight; if(y>p.scrollTop+p.clientHeight-40) p.scrollTop=y-p.clientHeight+60;
  }
  function popOwn(span){
    var r=span.getBoundingClientRect(), p=document.createElement("div");
    p.className="pop"; p.textContent="你自己的字"; p.style.left=r.left+"px"; p.style.top=(r.top-30)+"px";
    document.body.appendChild(p); later(function(){p.remove();},1700);
  }

  function run(n, onDone){
    clearAll(); token++; var my=token;
    cur=Math.max(0,Math.min(STEPS.length-1,n)); stepT0=Date.now(); if(paused) pauseAt=stepT0;
    var s=STEPS[cur];
    $("tag").textContent=s.tag; $("say").textContent=s.say; $("num").textContent=cur+" / "+(STEPS.length-1);
    $("prev").disabled=cur===0; $("next").disabled=cur===STEPS.length-1;
    document.body.classList.toggle("done",!!s.done);
    setPage(s.page); setMarks(s); instant(cur); maxSeen=Math.max(maxSeen,cur); boardAdd(showAll?STEPS.length:maxSeen);
    stepFocus=[s.page, Object.keys(s.mark||{}).filter(function(k){ return BOXES[k] && BOXES[k][0]===s.page; })];
    focusCam(stepFocus[0], stepFocus[1]);
    var pp=$("paper"); pp.scrollTop=pp.scrollHeight;
    var newKeys=Object.keys(s.mark||{}).filter(function(k){ return stepOf[k]===cur; }), ni=0;
    function startTyping(){
      var k=0;
      (function nextW(){
        if(my!==token) return;
        if(k>=s.w.length){ if(onDone) later(function(){ if(my===token) onDone(); }, 2600); return; }
        var w=s.w[k++], tkey="t"+cur+"_"+(k-1), span=addSpan(w[0],w[1],""); span.dataset.k=tkey;
        var type=function(){ if(w[1]==="o" && (w[4] || w[2].length>6)) popOwn(span); typeInto(span,w[2],my,function(){ later(nextW,250); }); };
        var go=function(){ if(w[1]==="o" && w[5]) showThink(span,w[5],my,type,tkey); else type(); };
        if(w[1]==="c" && w[3]) flyFrom(w[3],w[0],w[2],my,go); else go();
      })();
    }
    later(function(){ (function nextN(){
      if(my!==token) return;
      if(ni<newKeys.length){ zoomNote(newKeys[ni++],my,function(){ later(nextN,200); }); return; }
      if(s.tn && !onBoard[s.tn[0]]){ addNote(s.tn[0],false).classList.add("land"); }
      startTyping();
    })(); }, 900);
  }

  function focusCam(page,keys){
    lastFocus=[page,keys];
    var cam=$("cam"), pg=$(page), img=pg.querySelector("img"), cw=cam.clientWidth, ch=cam.clientHeight;
    if(!cw||!ch) return;
    var a=(img.naturalHeight||1400)/(img.naturalWidth||1000), x0=0,y0=0,x1=1,y1=1;
    if(keys.length){ x0=1;y0=1;x1=0;y1=0;
      keys.forEach(function(k){ var b=BOXES[k]; x0=Math.min(x0,b[1]); y0=Math.min(y0,b[2]); x1=Math.max(x1,b[3]); y1=Math.max(y1,b[4]); });
      x0=Math.max(0,x0-.06); x1=Math.min(1,x1+.06); y0=Math.max(0,y0-.05); y1=Math.min(1,y1+.05); }
    var sFit=Math.min(1,ch/(cw*a)), s=keys.length?Math.min(1/(x1-x0), ch/((y1-y0)*cw*a)):sFit;
    s=Math.max(sFit,Math.min(s,3));
    var pw=cw*s, ph=pw*a, tx=cw/2-(x0+x1)/2*pw, ty=ch/2-(y0+y1)/2*ph;
    tx=pw<=cw?(cw-pw)/2:Math.min(0,Math.max(cw-pw,tx));
    ty=ph<=ch?(ch-ph)/2:Math.min(0,Math.max(ch-ph,ty));
    pg.style.width=pw+"px"; pg.style.transform="translate("+tx+"px,"+ty+"px)";
  }
  window.addEventListener("resize",function(){ if(lastFocus) focusCam(lastFocus[0],lastFocus[1]); });
  function boardAdd(n){
    for(var i=0;i<n;i++){ var s=STEPS[i]; Object.keys(s.mark||{}).forEach(function(k){ addNote(k,false); }); if(s.tn) addNote(s.tn[0],false);
      (function(i,s){ s.w.forEach(function(w,j){ if(w[5]) addNote("t"+i+"_"+j,false); }); })(i,s); }
  }
  var ended=false;
  function onStepDone(){ if(cur>=STEPS.length-1){ ended=true; setPlay(false); return; } go(cur+1); }
  function go(n){ ended=false; run(n,onStepDone); }
  function setPlay(on){
    playing=on; $("play").textContent=on?"❚❚ 暫停":"▶ 播放";
    if(on){ if(stepFocus){ setPage(stepFocus[0]); focusCam(stepFocus[0],stepFocus[1]); } unfreeze(); } else freeze();
  }
  function stop(){ setPlay(false); }
  $("play").onclick=function(){ if(playing){ setPlay(false); } else { if(ended){ go(0); } setPlay(true); } };
  $("next").onclick=function(){ go(cur+1); };
  $("prev").onclick=function(){ go(cur-1); };
  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight") go(cur+1);
    if(e.key==="ArrowLeft") go(cur-1);
    if(e.key===" "){ e.preventDefault(); $("play").onclick(); }
  });
  function locate(key){
    setPlay(false);
    document.querySelectorAll(".flash").forEach(function(x){ x.classList.remove("flash"); });
    document.querySelectorAll(".flashw").forEach(function(x){ x.classList.remove("flashw"); });
    if(BOXES[key]){
      var b=BOXES[key], bx=$("bx_"+key);
      if(b[0]!=="ws"){ setPage(b[0]); focusCam(b[0],[key]); }
      bx.classList.add("flash");
      (b[0]==="ws"?$("ws"):$("cam")).scrollIntoView({block:"nearest",behavior:"smooth"});
      setTimeout(function(){ bx.classList.remove("flash"); },5000);
    } else {
      var sk=THINK[key]?key:TNSPAN[key], sp=document.querySelector('[data-k="'+sk+'"]');
      if(!sp){ go(Math.min(STEPS.length-1,stepOf[key]+1)); sp=document.querySelector('[data-k="'+sk+'"]'); }
      if(sp){ var p=$("paper"); p.scrollTop=Math.max(0,sp.offsetTop-80); sp.classList.add("flashw"); setTimeout(function(){ sp.classList.remove("flashw"); },5000); }
      if(THINK[key]) $("braintext").textContent=TN[key];
    }
  }
  var EST=STEPS.map(function(s,i){
    var t=2.6, z=Object.keys(s.mark||{}).filter(function(k){ return stepOf[k]===i; }).length*2.95;
    t+=z;
    s.w.forEach(function(w){ if(w[1]==="c"&&w[3]) t+=1.15; t+=w[2].length*(w[1]==="o"?0.055:0.022)+0.25; if(w[5]) t+=w[5].length*0.028+1.3; });
    return Math.max(t,4);
  });
  var START=[], TOTAL=0; EST.forEach(function(e){ START.push(TOTAL); TOTAL+=e; });
  var stepT0=Date.now();
  function fmt(s){ s=Math.max(0,Math.floor(s)); return ("0"+Math.floor(s/60)).slice(-2)+":"+("0"+(s%60)).slice(-2); }
  STEPS.forEach(function(s,i){ var k=document.createElement("div"); k.className="tick"; k.style.left=(START[i]/TOTAL*100)+"%";
    var sp=document.createElement("span"); sp.textContent=i===0?"":s.tag; if(i%2===0) k.appendChild(sp); $("track").appendChild(k); });
  function nowT(){ return START[cur]+Math.min(EST[cur],((paused?pauseAt:Date.now())-stepT0)/1000*SPEED); }
  setInterval(function(){ var t=nowT(); $("fill").style.width=(t/TOTAL*100)+"%"; $("knob").style.left=(t/TOTAL*100)+"%"; $("ptime").textContent=fmt(t)+" / "+fmt(TOTAL); $("pp").textContent=playing?"❚❚":"▶"; },200);
  function seekFrac(f){ var t=f*TOTAL, i=0; for(var j=0;j<START.length;j++) if(START[j]<=t) i=j; return i; }
  var dragging=false;
  function fracOf(e){ var r=$("track").getBoundingClientRect(); return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); }
  $("track").addEventListener("pointerdown",function(e){ dragging=true; $("track").setPointerCapture(e.pointerId); var f=fracOf(e); $("knob").style.left=(f*100)+"%"; });
  $("track").addEventListener("pointermove",function(e){ if(!dragging) return; var f=fracOf(e); $("knob").style.left=(f*100)+"%"; $("ptime").textContent=fmt(f*TOTAL)+" / "+fmt(TOTAL); });
  $("track").addEventListener("pointerup",function(e){ if(!dragging) return; dragging=false; var i=seekFrac(fracOf(e)); go(i); });
  $("pp").onclick=function(){ $("play").onclick(); };
  function setSpeed(v){
    var t=nowT(); SPEED=v; stepT0=Date.now()-(t-START[cur])*1000/SPEED; if(paused) pauseAt=Date.now();
    document.documentElement.style.setProperty("--tf",(0.95/SPEED)+"s");
    document.documentElement.style.setProperty("--tz",(0.6/SPEED)+"s");
    $("spd").value=String(v); $("spdv").textContent=v.toFixed(2)+"x"; document.documentElement.style.setProperty("--tc",(0.8/SPEED)+"s");
    try{ localStorage.setItem("essay_speed",String(v)); }catch(e){}
  }
  $("spd").oninput=function(){ setSpeed(parseFloat($("spd").value)); };
  try{ var sv=parseFloat(localStorage.getItem("essay_speed")); if(sv>0) setSpeed(sv); }catch(e){}
  $("allnotes").onclick=function(){ showAll=true; boardAdd(STEPS.length); };
  $("play").textContent="▶ 播放";
  go(0);
})();
</script>
</body>
</html>
