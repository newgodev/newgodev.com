<style>

html{color-scheme:light;background:#fff;font-size:17px}
body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans HK",Arial,sans-serif;line-height:1.7}

.page{display:none}.page.on{display:block;animation:fade .5s}

.box.red .stamp{background:var(--red)} .box.ok .stamp{background:var(--ok)}

  line-height:2.05}

.fr>.nu,.fr>.de{display:block;padding:0 4px;white-space:nowrap}.fr>.nu{border-bottom:2px solid currentColor}
.fr sup{vertical-align:.5em}

.ans{cursor:pointer;text-decoration:underline dotted;text-underline-offset:4px}

#expop h4{margin:0 0 6px;font-size:1rem}#expop .x{position:absolute;right:8px;top:4px;border:0;background:none;font-size:1.2rem;cursor:pointer}
#expop .ok{color:var(--ok);font-weight:900}#expop .bad{color:var(--red);font-weight:900}#expop .en{color:#1d4ed8}#expop p{margin:4px 0}
.box{cursor:pointer}

.parts button.on{background:#1d70b8;color:#fff}
.offpart{display:none!important}

.say .fr,.say-en .fr,.brain .fr,.note .fr{margin:1px 2px}

.c{color:var(--blue);font-weight:700}
.o{color:var(--red);font-weight:700}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:-3px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

  pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:left var(--tf,.95s) cubic-bezier(.5,0,.2,1),top var(--tf,.95s) cubic-bezier(.5,0,.2,1),transform var(--tf,.95s),opacity .3s}

@keyframes pop{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

.bhead,.bempty{grid-column:1/-1}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.bhead h2{margin:0}
.bhead button{font-family:inherit;font-size:.78rem;font-weight:700;padding:4px 10px;border:2px solid var(--ink);background:#fff;border-radius:4px;cursor:pointer}
.bempty{font-size:.85rem;color:#5a4526}
.note{position:relative;border-radius:3px;padding:8px 7px 8px;box-shadow:0 4px 10px rgba(0,0,0,.28);transform:rotate(-1.2deg);cursor:pointer;transition:transform .2s;background:#fff3a3}
.note:nth-child(even){transform:rotate(1.1deg)}
.note:hover{transform:scale(1.04) rotate(0)}
.note::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:#d4351c;box-shadow:0 2px 3px rgba(0,0,0,.45)}
.note.q{background:#fff3a3}.note.o{background:#ffd9ee}.note.br{background:#eadcff}

.note .lab{font-size:.74rem;font-weight:700;margin-top:5px;line-height:1.35}
.note .lab i{font-style:normal;font-size:.7rem;color:#fff;background:#0b0c0c;border-radius:3px;padding:0 5px;margin-right:5px}
.note.o .lab{color:var(--red)}
.note.land{animation:land .5s}
@keyframes land{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.zoom{position:fixed;z-index:70;background-repeat:no-repeat;background-color:#fff;border:5px solid var(--hi);border-radius:6px;
  box-shadow:0 14px 44px rgba(0,0,0,.45);transition:left var(--tz,.6s) cubic-bezier(.4,0,.2,1),top var(--tz,.6s) cubic-bezier(.4,0,.2,1),width var(--tz,.6s) cubic-bezier(.4,0,.2,1),height var(--tz,.6s) cubic-bezier(.4,0,.2,1);pointer-events:none}
.zoomcap{position:fixed;z-index:71;background:#0b0c0c;color:#fff;font-weight:900;font-size:1rem;padding:5px 12px;border-radius:4px;pointer-events:none;transition:opacity .3s}
body{padding-bottom:70px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0b0c0c;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.player button{font-family:inherit;font-size:1rem;font-weight:900;width:44px;height:36px;border:0;border-radius:4px;background:#fff;color:#0b0c0c;cursor:pointer}
.track{position:relative;flex:1;height:14px;background:#444;border-radius:999px;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hi);border-radius:999px}
.knob{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff;border:3px solid var(--hi);left:0}
.tick{position:absolute;top:-6px;width:2px;height:26px;background:#888}
.tick span{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:.66rem;color:#bbb;white-space:nowrap}
.ptime{font-size:.85rem;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.spdwrap{display:flex;align-items:center;gap:6px;color:#fff;font-size:.85rem;font-weight:900}
.spdwrap input{width:140px;accent-color:#ffdd00;cursor:pointer}
.spdwrap span{min-width:50px}
.cam{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:4px;background:#f3f2f1;min-height:420px}
.cam .page{position:absolute;left:0;top:0;border:0;border-radius:0;transform-origin:0 0;animation:none;
  transition:width var(--tc,.8s) cubic-bezier(.4,0,.2,1),transform var(--tc,.8s) cubic-bezier(.4,0,.2,1)}
.brain{margin-top:10px;border:3px solid var(--red);border-radius:14px;padding:10px 12px;background:#fff;overflow:auto;min-height:120px;transition:box-shadow .3s}
.brain .bh{font-weight:900;color:var(--red);font-size:.85rem;margin-bottom:4px}
.brain .bt{font-size:.98rem;font-weight:700;line-height:1.6;white-space:pre-line}
.brain.on{box-shadow:0 0 0 6px rgba(212,53,28,.2)}
@media (max-width:1250px){.grid{grid-template-columns:1fr 1fr}.board{position:static;max-height:none}}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
@media (min-width:1101px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;padding-bottom:0}
  .top{position:relative;flex:none}
  .grid{flex:1;min-height:0;grid-template-columns:1.15fr 1.2fr .95fr;padding:10px 14px;gap:12px}
  .col{display:flex;flex-direction:column;min-height:0;height:100%}
  .col h2{flex:none}
  .cam{flex:1.6;min-height:0}
  .brain{flex:1;min-height:0}
  .paper{flex:1;overflow:auto}
  .board{position:relative;top:0;flex:1;max-height:none;min-height:0}
  .player{position:relative;flex:none}
}
.box.flash{border-color:#ff00aa !important;background:rgba(255,0,170,.2) !important;animation:pulse .6s infinite}
.flashw{background:#fff08a;outline:3px solid #ff00aa;border-radius:3px}

var STEPS = [{"tag": "開始", "page": "pA", "tick": "", "mark": {}, "say": "左邊係你課本 p.2.50(已經掃描、攤平)。今次功課:Q25、27、29、30–31,加挑戰題 *Q32,每題 (a)(b) 都做。藍字 = 由題目抄,紅字 = 你自己寫嘅步驟。頂部「題目 Questions」可以跳去任何一題。按「播放」。", "say_en": "On the left is your textbook page 2.50, scanned and flattened. Homework: Q25, 27, 29, 30 to 31 and challenge Q32, parts (a) and (b). Blue is copied from the question and red is your own working.", "w": [], "part": 0}, {"tag": "Q25–29 指示", "tick": "Q25", "page": "pA", "mark": {"i25": "hl"}, "say": "題目指示:Simplify,而且答案要用正指數(positive indices)。即係最後答案唔可以有負指數;中間步驟有負指數冇問題。", "say_en": "The instruction says simplify and express your answers with positive indices, so the final answer cannot have a negative index.", "w": [["P25a", "o", "", "", false, "規則:做指數題嘅次序:① 拆括號 ② 搞掂負號 ③ 同底數相乘加指數、相除減指數 ④ 負指數變分數。\nRule: remove the brackets, sort out the minus signs, add or subtract the indices, then make every index positive."]], "part": 0}, {"tag": "Q25(a) 讀題", "page": "pA", "mark": {"q25a": "hl"}, "say": "Q25(a):三樣嘢相乘,底數都係 y,但有括號同負號。點解唔可以即刻加指數?因為指數定律只可以喺「同底數、冇括號」嗰陣用。所以先拆括號,再搞負號,最後先加指數。", "say_en": "Q25(a): three things are multiplied and the base is y, but there are brackets and minus signs. We remove the brackets first, then the signs, then add the indices.", "w": [["P25a", "c", "25. (a)  −y^{3} × (y^{−2})^{2} × (−y)^{5}", "q25a"]], "part": 0}, {"tag": "Q25(a) 第 1 步", "page": "pA", "mark": {"q25a": "ok"}, "say": "點解?(y^{−2})^{2} 係次方再次方,所以指數相乘:(−2) × 2 = −4。其他唔郁。", "say_en": "Why: (y^{−2})^{2} is a power of a power, so we multiply the indices: −2 × 2 = −4. Nothing else changes.", "w": [["P25a", "o", "\n= −y^{3} × y^{−4} × (−y)^{5}", "", false, "規則:次方再次方 → 指數相乘。\n數字:(2^{2})^{3} = 2^{2} × 2^{2} × 2^{2} = 2^{2+2+2} = 2^{6},即係 2 × 3 = 6。\n所以 (a^{m})^{n} = a^{mn}。負數照乘:(y^{−2})^{2} = y^{−4}。\nRule: power of a power, multiply the indices: (2^{2})^{3} = 2^{6}, so (a^{m})^{n} = a^{mn}.", {"head": "呢一步 This step: ", "ans": "= −y^{3} × y^{−4} × (−y)^{5}", "whylab": "點解 Why:", "why": "點解?(y^{−2})^{2} 係次方再次方,所以指數相乘:(−2) × 2 = −4。其他唔郁。", "why_en": "Why: (y^{−2})^{2} is a power of a power, so we multiply the indices: −2 × 2 = −4. Nothing else changes.", "wrong": []}]], "part": 0}, {"tag": "Q25(a) 第 2 步", "page": "pA", "mark": {"q25a": "ok"}, "say": "點解?(−y)^{5} 係負數嘅 5 次方,5 係單數,所以答案仲係負:(−y)^{5} = −y^{5}。", "say_en": "Why: (−y)^{5} is a negative base to an odd power, so it stays negative: (−y)^{5} = −y^{5}.", "w": [["P25a", "o", "\n= −y^{3} × y^{−4} × (−y^{5})", "", false, "規則:負數嘅單數次方仲係負,雙數次方變正。\n數字:(−2)^{3} = (−2) × (−2) × (−2) = −8;(−2)^{2} = (−2) × (−2) = 4。\n所以 (−y)^{5} = −y^{5}。\nRule: a negative base to an odd power stays negative; to an even power it becomes positive.", {"head": "呢一步 This step: ", "ans": "= −y^{3} × y^{−4} × (−y^{5})", "whylab": "點解 Why:", "why": "點解?(−y)^{5} 係負數嘅 5 次方,5 係單數,所以答案仲係負:(−y)^{5} = −y^{5}。", "why_en": "Why: (−y)^{5} is a negative base to an odd power, so it stays negative: (−y)^{5} = −y^{5}.", "wrong": []}]], "part": 0}, {"tag": "Q25(a) 第 3 步", "page": "pA", "mark": {"q25a": "ok"}, "say": "前面 −y^{3} 有一個負號,最後 (−y^{5}) 又有一個負號。負 × 負 = 正,兩個負號一齊拎走。", "say_en": "There is one minus sign in front and another in the last bracket. Negative times negative is positive, so both signs go.", "w": [["P25a", "o", "\n= y^{3} × y^{−4} × y^{5}", "", false, "規則:負 × 負 = 正。\n數字:(−2) × (−3) = 6。\n所以兩個負號一齊出現,可以一齊拎走。\nRule: negative times negative is positive, so two minus signs cancel each other.", {"head": "呢一步 This step: ", "ans": "= y^{3} × y^{−4} × y^{5}", "whylab": "點解 Why:", "why": "前面 −y^{3} 有一個負號,最後 (−y^{5}) 又有一個負號。負 × 負 = 正,兩個負號一齊拎走。", "why_en": "There is one minus sign in front and another in the last bracket. Negative times negative is positive, so both signs go.", "wrong": []}]], "part": 0}, {"tag": "Q25(a) 第 4 步", "page": "pA", "mark": {"q25a": "ok"}, "say": "而家三個都係底數 y 相乘,冇括號、冇負號,可以用指數定律:指數相加。", "say_en": "Now all three have the same base y and are multiplied, so we add the indices.", "w": [["P25a", "o", "\n= y^{3 + (−4) + 5}", "", false, "規則:同底數相乘 → 指數相加。\n數字:2^{3} × 2^{2} = (2×2×2) × (2×2) = 五個 2 = 2^{5},即係 3 + 2 = 5。\n所以 a^{m} × a^{n} = a^{m+n}。\nRule: same base multiplied, add the indices: 2^{3} × 2^{2} = 2^{5}, so a^{m} × a^{n} = a^{m+n}.", {"head": "呢一步 This step: ", "ans": "= y^{3 + (−4) + 5}", "whylab": "點解 Why:", "why": "而家三個都係底數 y 相乘,冇括號、冇負號,可以用指數定律:指數相加。", "why_en": "Now all three have the same base y and are multiplied, so we add the indices.", "wrong": []}]], "part": 0}, {"tag": "Q25(a) 第 5 步", "page": "pA", "mark": {"q25a": "ok"}, "say": "3 − 4 + 5 = 4。指數係正數,已經符合題目「positive indices」,完成。", "say_en": "Three minus four plus five is four. The index is positive, so this is the final answer.", "w": [["P25a", "o", "\n= y^{4}", "", true, null, {"ans": "y^{4}", "why": "拆括號 y^{−4}、(−y)^{5} = −y^{5},負負得正,3 − 4 + 5 = 4。", "why_en": "Open the brackets, two minus signs cancel, and 3 − 4 + 5 = 4.", "wrong": [["", "−y^{4}", "漏咗負 × 負 = 正。", "You forgot that negative times negative is positive."], ["", "y^{8}", "(y^{−2})^{2} 寫咗 y^{0}(−2 同 2 相加);次方再次方要相乘 = y^{−4}。", "You added −2 and 2; a power of a power multiplies the indices, giving y^{−4}."]]}]], "part": 0}, {"tag": "Q25(a) 抄上紙", "page": "pA", "mark": {"q25a": "ok"}, "stamp": {"q25a": "做完 ✓"}, "say": "抄上紙:5 小步收做 3 行。第 1 行 = 第 1–2 步(拆括號、單數次方),第 2 行 = 第 3–4 步(負負得正、指數相加),第 3 行 = 答案。", "say_en": "Copy to paper: five small steps become three lines. Line 1 is steps 1 and 2, line 2 is steps 3 and 4, line 3 is the answer.", "w": [["P25a", "o", "\n抄上紙 Copy to paper:\n25. (a)  −y^{3} × (y^{−2})^{2} × (−y)^{5}\n= −y^{3} × y^{−4} × (−y^{5})\n= y^{3 − 4 + 5}\n= y^{4}\n", "", true, null, {"ans": "y^{4}", "why": "拆括號 y^{−4}、(−y)^{5} = −y^{5},負負得正,3 − 4 + 5 = 4。", "why_en": "Open the brackets, two minus signs cancel, and 3 − 4 + 5 = 4.", "wrong": [["", "−y^{4}", "漏咗負 × 負 = 正。", "You forgot that negative times negative is positive."], ["", "y^{8}", "(y^{−2})^{2} 寫咗 y^{0}(−2 同 2 相加);次方再次方要相乘 = y^{−4}。", "You added −2 and 2; a power of a power multiplies the indices, giving y^{−4}."]]}]], "part": 0}, {"tag": "Q25(b) 讀題", "page": "pA", "mark": {"q25b": "hl"}, "say": "Q25(b):有 ÷ 又有 ×,中間仲有一個負指數嘅括號。由左到右做:先處理 (−x)^{3},再處理「÷ 一個負指數」。", "say_en": "Q25(b): there is a division and a multiplication, and a bracket with a negative index. Work from left to right.", "w": [["P25b", "c", "(b)  (−x)^{3} ÷ (2x^{2})^{−2} × x^{−4}", "q25b"]], "tick": "", "part": 0}, {"tag": "Q25(b) 第 1 步", "page": "pA", "mark": {"q25b": "ok"}, "say": "點解?(−x)^{3}:3 係單數,負號留低,= −x^{3}。", "say_en": "Why: 3 is odd, so the minus sign stays: (−x)^{3} = −x^{3}.", "w": [["P25b", "o", "\n= −x^{3} ÷ (2x^{2})^{−2} × x^{−4}", "", false, null, {"head": "呢一步 This step: ", "ans": "= −x^{3} ÷ (2x^{2})^{−2} × x^{−4}", "whylab": "點解 Why:", "why": "點解?(−x)^{3}:3 係單數,負號留低,= −x^{3}。", "why_en": "Why: 3 is odd, so the minus sign stays: (−x)^{3} = −x^{3}.", "wrong": []}]], "part": 0}, {"tag": "Q25(b) 第 2 步", "page": "pA", "mark": {"q25b": "ok"}, "say": "點解?負指數 = 分數:(2x^{2})^{−2} = [[1|(2x^{2})^{2}]]。", "say_en": "Why: a negative index means a fraction: (2x^{2})^{−2} = [[1|(2x^{2})^{2}]].", "w": [["P25b", "o", "\n= −x^{3} ÷ [[1|(2x^{2})^{2}]] × x^{−4}", "", false, "規則:負指數 = 分數,唔係負數(老師堂上講過)。\n數字:2^{3} ÷ 2^{5} = [[2×2×2|2×2×2×2×2]] = [[1|2^{2}]];用定律就係 2^{3−5} = 2^{−2}。\n所以 2^{−2} = [[1|2^{2}]],a^{−n} = [[1|a^{n}]]。\nRule: a negative index means a fraction, not a negative number: a^{−n} = [[1|a^{n}]].", {"head": "呢一步 This step: ", "ans": "= −x^{3} ÷ [[1|(2x^{2})^{2}]] × x^{−4}", "whylab": "點解 Why:", "why": "點解?負指數 = 分數:(2x^{2})^{−2} = [[1|(2x^{2})^{2}]]。", "why_en": "Why: a negative index means a fraction: (2x^{2})^{−2} = [[1|(2x^{2})^{2}]].", "wrong": []}]], "part": 0}, {"tag": "Q25(b) 第 3 步", "page": "pA", "mark": {"q25b": "ok"}, "say": "點解?除以一個分數 = 乘佢上下調轉:÷ [[1|(2x^{2})^{2}]] 變成 × (2x^{2})^{2}。", "say_en": "Why: dividing by a fraction is multiplying by it upside down, so ÷ [[1|(2x^{2})^{2}]] becomes × (2x^{2})^{2}.", "w": [["P25b", "o", "\n= −x^{3} × (2x^{2})^{2} × x^{−4}", "", false, "規則:除以一個分數 = 乘佢上下調轉。\n數字:6 ÷ [[1|2]] = 6 × 2 = 12(6 入面有 12 個半)。\n所以 ÷ [[1|A]] = × A。\nRule: dividing by a fraction is the same as multiplying by it upside down: ÷ [[1|A]] = × A.", {"head": "呢一步 This step: ", "ans": "= −x^{3} × (2x^{2})^{2} × x^{−4}", "whylab": "點解 Why:", "why": "點解?除以一個分數 = 乘佢上下調轉:÷ [[1|(2x^{2})^{2}]] 變成 × (2x^{2})^{2}。", "why_en": "Why: dividing by a fraction is multiplying by it upside down, so ÷ [[1|(2x^{2})^{2}]] becomes × (2x^{2})^{2}.", "wrong": []}]], "part": 0}, {"tag": "Q25(b) 第 4 步", "page": "pA", "mark": {"q25b": "ok"}, "say": "點解?括號外嘅 2 次方派畀入面每樣:2^{2} = 4,(x^{2})^{2} = x^{4}。", "say_en": "Why: the index 2 outside goes to everything inside: 2^{2} = 4 and (x^{2})^{2} = x^{4}.", "w": [["P25b", "o", "\n= −x^{3} × 4x^{4} × x^{−4}", "", false, "規則:括號外嘅次方要派畀括號入面每一樣,連數字都要。\n數字:(2 × 3)^{2} = (2×3) × (2×3) = 2^{2} × 3^{2} = 36。\n所以 (ab)^{n} = a^{n}b^{n}:(2x^{2})^{2} = 2^{2}x^{4} = 4x^{4},唔好漏咗個 2。\nRule: the index outside a bracket goes to every factor inside, numbers too: (ab)^{n} = a^{n}b^{n}.", {"head": "呢一步 This step: ", "ans": "= −x^{3} × 4x^{4} × x^{−4}", "whylab": "點解 Why:", "why": "點解?括號外嘅 2 次方派畀入面每樣:2^{2} = 4,(x^{2})^{2} = x^{4}。", "why_en": "Why: the index 2 outside goes to everything inside: 2^{2} = 4 and (x^{2})^{2} = x^{4}.", "wrong": []}]], "part": 0}, {"tag": "Q25(b) 第 5 步", "page": "pA", "mark": {"q25b": "ok"}, "say": "數字乘數字:−1 × 4 = −4;x 同 x 相乘,指數相加。", "say_en": "Multiply the numbers: minus one times four is minus four. Same base x multiplied, so add the indices.", "w": [["P25b", "o", "\n= −4x^{3 + 4 + (−4)}", "", false, null, {"head": "呢一步 This step: ", "ans": "= −4x^{3 + 4 + (−4)}", "whylab": "點解 Why:", "why": "數字乘數字:−1 × 4 = −4;x 同 x 相乘,指數相加。", "why_en": "Multiply the numbers: minus one times four is minus four. Same base x multiplied, so add the indices.", "wrong": []}]], "part": 0}, {"tag": "Q25(b) 第 6 步", "page": "pA", "mark": {"q25b": "ok"}, "say": "3 + 4 − 4 = 3。指數係正數,完成。", "say_en": "Three plus four minus four is three, a positive index, so we are done.", "w": [["P25b", "o", "\n= −4x^{3}", "", true, null, {"ans": "−4x^{3}", "why": "÷ (2x^{2})^{−2} = × (2x^{2})^{2} = × 4x^{4};x^{4} 同 x^{−4} 抵銷,剩 −4x^{3}。", "why_en": "Dividing by (2x^{2})^{−2} is multiplying by 4x^{4}; x^{4} and x^{−4} cancel, leaving −4x^{3}.", "wrong": [["", "−x^{3}", "漏咗 (2x^{2})^{2} 入面 2^{2} = 4。", "You forgot that 2 squared is 4 inside the bracket."], ["", "−[[1|4x^{5}]]", "將「÷ (2x^{2})^{−2}」當咗「× (2x^{2})^{−2}」。÷ 負指數 = × 正指數。", "You multiplied by (2x^{2})^{−2} instead of dividing; dividing by a negative index is multiplying by the positive index."]]}]], "part": 0}, {"tag": "Q25(b) 抄上紙", "page": "pA", "mark": {"q25b": "ok"}, "stamp": {"q25b": "做完 ✓"}, "say": "抄上紙:第 1 行 = 第 1–3 步(單數次方、÷ 負指數 = × 正指數),第 2 行 = 第 4 步,第 3 行 = 第 5–6 步。", "say_en": "Copy to paper: line 1 is steps 1 to 3, line 2 is step 4, line 3 is steps 5 and 6.", "w": [["P25b", "o", "\n抄上紙 Copy to paper:\n(b)  (−x)^{3} ÷ (2x^{2})^{−2} × x^{−4}\n= −x^{3} × (2x^{2})^{2} × x^{−4}\n= −x^{3} × 4x^{4} × x^{−4}\n= −4x^{3}\n", "", true, null, {"ans": "−4x^{3}", "why": "÷ (2x^{2})^{−2} = × (2x^{2})^{2} = × 4x^{4};x^{4} 同 x^{−4} 抵銷,剩 −4x^{3}。", "why_en": "Dividing by (2x^{2})^{−2} is multiplying by 4x^{4}; x^{4} and x^{−4} cancel, leaving −4x^{3}.", "wrong": [["", "−x^{3}", "漏咗 (2x^{2})^{2} 入面 2^{2} = 4。", "You forgot that 2 squared is 4 inside the bracket."], ["", "−[[1|4x^{5}]]", "將「÷ (2x^{2})^{−2}」當咗「× (2x^{2})^{−2}」。÷ 負指數 = × 正指數。", "You multiplied by (2x^{2})^{−2} instead of dividing; dividing by a negative index is multiplying by the positive index."]]}]], "part": 0}, {"tag": "Q27(a) 讀題", "page": "pA", "mark": {"q27a": "hl"}, "say": "Q27(a):兩個括號相乘,每個括號外面都有負次方。先逐個括號拆,再相乘。", "say_en": "Q27(a): two brackets are multiplied, and each has a negative index outside. Open each bracket first, then multiply.", "w": [["P27a", "c", "27. (a)  (p^{−3}q^{−2})^{−4}(−p^{0}q^{−2})^{−3}", "q27a"]], "tick": "Q27", "part": 0}, {"tag": "Q27(a) 第 1 步", "page": "pA", "mark": {"q27a": "ok"}, "say": "點解?第一個括號外面嘅 −4 要派畀入面 p^{−3} 同 q^{−2} 兩樣。", "say_en": "Why: the index −4 outside the first bracket goes to both p^{−3} and q^{−2}.", "w": [["P27a", "o", "\n= (p^{−3})^{−4}(q^{−2})^{−4} × (−p^{0}q^{−2})^{−3}", "", false, null, {"head": "呢一步 This step: ", "ans": "= (p^{−3})^{−4}(q^{−2})^{−4} × (−p^{0}q^{−2})^{−3}", "whylab": "點解 Why:", "why": "點解?第一個括號外面嘅 −4 要派畀入面 p^{−3} 同 q^{−2} 兩樣。", "why_en": "Why: the index −4 outside the first bracket goes to both p^{−3} and q^{−2}.", "wrong": []}]], "part": 0}, {"tag": "Q27(a) 第 2 步", "page": "pA", "mark": {"q27a": "ok"}, "say": "次方再次方,指數相乘:(−3) × (−4) = 12,(−2) × (−4) = 8(負負得正)。", "say_en": "Power of a power: multiply the indices. Minus three times minus four is 12, and minus two times minus four is 8.", "w": [["P27a", "o", "\n= p^{12}q^{8} × (−p^{0}q^{−2})^{−3}", "", false, null, {"head": "呢一步 This step: ", "ans": "= p^{12}q^{8} × (−p^{0}q^{−2})^{−3}", "whylab": "點解 Why:", "why": "次方再次方,指數相乘:(−3) × (−4) = 12,(−2) × (−4) = 8(負負得正)。", "why_en": "Power of a power: multiply the indices. Minus three times minus four is 12, and minus two times minus four is 8.", "wrong": []}]], "part": 0}, {"tag": "Q27(a) 第 3 步", "page": "pA", "mark": {"q27a": "ok"}, "say": "點解?p^{0} = 1,乘 1 唔會變,所以 p^{0} 可以拎走。", "say_en": "Why: p^{0} = 1, and multiplying by one changes nothing, so p^{0} disappears.", "w": [["P27a", "o", "\n= p^{12}q^{8} × (−q^{−2})^{−3}", "", false, "規則:任何數(唔係 0)嘅 0 次方 = 1。\n數字:2^{3} ÷ 2^{3} = 8 ÷ 8 = 1;用定律就係 2^{3−3} = 2^{0}。\n所以 a^{0} = 1,p^{0} = 1。\nRule: any number (except zero) to the power 0 is 1: a^{0} = 1.", {"head": "呢一步 This step: ", "ans": "= p^{12}q^{8} × (−q^{−2})^{−3}", "whylab": "點解 Why:", "why": "點解?p^{0} = 1,乘 1 唔會變,所以 p^{0} 可以拎走。", "why_en": "Why: p^{0} = 1, and multiplying by one changes nothing, so p^{0} disappears.", "wrong": []}]], "part": 0}, {"tag": "Q27(a) 第 4 步", "page": "pA", "mark": {"q27a": "ok"}, "say": "括號入面其實係 (−1) × q^{−2},−3 次方要派畀 (−1) 同 q^{−2} 兩樣。", "say_en": "Inside the bracket is min   function nowT(){ return START[cur]+Math.min(EST[cur],((paused?pauseAt:Date.now())-stepT0)/1000*SPEED); }
  setInterval(function(){ var t=nowT(); $("fill").style.width=(t/TOTAL*100)+"%"; $("knob").style.left=(t/TOTAL*100)+"%"; $("ptime").textContent=fmt(t)+" / "+fmt(TOTAL); $("pp").textContent=playing?"❚❚":"▶"; },200);
  function seekFrac(f){ var t=f*TOTAL, i=0; for(var j=0;j<START.length;j++) if(START[j]<=t) i=j; return i; }
  var dragging=false;
  function fracOf(e){ var r=$("track").getBoundingClientRect(); return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); }
  $("track").addEventListener("pointerdown",function(e){ dragging=true; $("track").setPointerCapture(e.pointerId); var f=fracOf(e); $("knob").style.left=(f*100)+"%"; });
  $("track").addEventListener("pointermove",function(e){ if(!dragging) return; var f=fracOf(e); $("knob").style.left=(f*100)+"%"; $("ptime").textContent=fmt(f*TOTAL)+" / "+fmt(TOTAL); });
  $("track").addEventListener("pointerup",function(e){ if(!dragging) return; dragging=false; var i=seekFrac(fracOf(e)); go(i); });
  $("pp").onclick=function(){ $("play").onclick(); };
  function setSpeed(v){
    var t=nowT(); SPEED=v; stepT0=Date.now()-(t-START[cur])*1000/SPEED; if(paused) pauseAt=Date.now();
    document.documentElement.style.setProperty("--tf",(0.95/SPEED)+"s");
    document.documentElement.style.setProperty("--tz",(0.6/SPEED)+"s");
    $("spd").value=String(v); $("spdv").textContent=v.toFixed(2)+"x"; document.documentElement.style.setProperty("--tc",(0.8/SPEED)+"s");
    try{ localStorage.setItem("hwv_math_speed",String(v)); }catch(e){}
    window.__speed=v;
  }
  $("spd").oninput=function(){ setSpeed(parseFloat($("spd").value)); };
  try{ var sv=parseFloat(localStorage.getItem("hwv_math_speed")); if(sv>0) setSpeed(sv); }catch(e){}

  $("allnotes").onclick=function(){ showAll=true; boardAdd(STEPS.length); applyPart(); };
  $("play").textContent="▶ 播放";
  go(0);
  window.__hw={qmenu:QMENU,part:function(){return curPart;},page:function(){return STEPS[cur].page;},go:go,cur:function(){return cur;},n:STEPS.length,playing:function(){return playing;},setSpeed:setSpeed};
})();
</script>
</body>
