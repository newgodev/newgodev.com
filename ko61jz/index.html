ent a sixth aspect. Say the English line, then the Chinese.", "teach_zh": "每方面一句就夠填充。不要自己加第六方面。 先英後中各講一次。", "pen": "green", "ex": {"why": "One sentence each is enough for fill-in. Do not invent a sixth aspect.", "why_zh": "每方面一句就夠填充。不要自己加第六方面。", "other": [], "avoid": [["Invented facts not on page", "不要自己發明課本沒有的事實"]]}, "from": "five", "pad_text": "Mil / Econ / Geo / Pol / Cult — five only"}], "sec": "nb", "onepage": true, "tbmark": ["five"]}, {"tag": "列強名單", "tb": "nb2", "wb": "note", "say": "European powers list in notes: Britain, Germany, France, Austria-Hungary, Russia (Italy also in textbook).", "say_zh": "筆記列強：英、德、法、奧匈、俄（課本亦有意大利）。", "mark": [["list", "hl"]], "stamp": "列強名單", "teach": "Be ready to name them cold. Spelling Austria-Hungary matters. Pause the video and say this point out loud once before continuing. If you cannot say it, rewind.", "teach_zh": "要能默寫。Austria-Hungary拼寫要對。 暫停，把這一點大聲講一次；講不出就倒帶。", "fills": [{"id": "n30_1", "box": [0.08, 0.3, 0.92, 0.52], "text": "Powers: GB · DE · FR · AH · RU (+ IT in TB)", "zh": "列強：英·德·法·奧匈·俄（課本＋意）", "q": "名單", "note": "Powers: GB · DE · FR · AH · RU (+ IT in TB)", "kind": "text", "fs": 0.018, "teach": "Be ready to name them cold. Spelling Austria-Hungary matters. Say the English line, then the Chinese.", "teach_zh": "要能默寫。Austria-Hungary拼寫要對。 先英後中各講一次。", "pen": "blue", "ex": {"why": "Be ready to name them cold. Spelling Austria-Hungary matters.", "why_zh": "要能默寫。Austria-Hungary拼寫要對。", "other": [], "avoid": [["Invented facts not on page", "不要自己發明課本沒有的事實"]]}, "from": "list", "pad_text": "Powers: GB · DE · FR · AH · RU (+ IT in TB)"}], "sec": "nb", "onepage": true, "quiz": true, "tbmark": ["list"]}, {"tag": "四遠因", "tb": "nb3", "wb": "note", "say": "Underlying causes (遠因): 1 Extreme nationalism 2 Alliance system 3 Armament race 4 Colonial rivalry. Immediate cause: Sarajevo 1914.", "say_zh": "遠因：1極端民族主義 2同盟制度 3軍備競賽 4殖民競爭。近因：1914薩拉熱窩。", "mark": [["outline", "hl"]], "stamp": "四遠因", "teach": "Say the four aloud every day. Imm var TOC=[{"i": 0, "sec": "intro", "label": "考試三數", "zh": "統一測驗：2026年10月29日第9節，25分鐘，滿分40。"}, {"i": 1, "sec": "intro", "label": "範圍清單", "zh": "範圍：課本p.5–12、Notebook遠因、漫畫海報、Pre-lesson WS1–2、WS1–2。WS3老師"}, {"i": 2, "sec": "intro", "label": "題型比重", "zh": "題型：選擇9、是非6、填充8、漫畫4、資料題13。"}, {"i": 3, "sec": "intro", "label": "一頁一刻", "zh": "本片做法：一頁一刻——鏡頭對準一段，筆記板只寫這一點，然後清板再下一點。"}, {"i": 4, "sec": "tb", "label": "兩戰年份", "zh": "一戰1914–1918；二戰1939–1945。"}, {"i": 5, "sec": "tb", "label": "陣營名稱", "zh": "一戰：同盟國 Central vs 協約國 Allied。二戰：軸心 Axis vs 同盟 Allied。"}, {"i": 6, "sec": "tb", "label": "規模比較", "zh": "一戰：逾30國、主戰場歐洲、約800–1000萬死亡。二戰：逾60國、歐亞非、死亡遠更高。"}, {"i": 7, "sec": "tb", "label": "英國優勢", "zh": "英國：最多殖民地；最強海軍；「光榮孤立」。"}, {"i": 8, "sec": "tb", "label": "德國新興", "zh": "德國：新興強國；陸軍強；海軍與殖民地威脅英國地位。"}, {"i": 9, "sec": "tb", "label": "法國復仇", "zh": "法國：第二大殖民帝國之一；1871普法戰敗；想復仇。"}, {"i": 10, "sec": "tb", "label": "俄國大哥", "zh": "俄國：領土遼闊；向歐洲／地中海擴張；「斯拉夫人的大哥」。"}, {"i": 11, "sec": "tb", "label": "奧匈衰落", "zh": "奧匈：多民族帝國；自19世紀中葉衰落。"}, {"i": 12, "sec": "tb", "label": "意大利", "zh": "意大利：新興但在列強中相對較弱；後加入三國同盟。"}, {"i": 13, "sec": "tb", "label": "極端民族", "zh": "極端民族主義（約1870後）：侵略性擴張與復仇，不只求獨立。"}, {"i": 14, "sec": "tb", "label": "泛德意志", "zh": "德國：泛德意志主義——統一日耳曼人；防法國復仇；爭殖民地。"}, {"i": 15, "sec": "tb", "label": "泛斯拉夫", "zh": "俄國：泛斯拉夫主義——在俄國領導下統一斯拉夫人；影響巴爾幹。"}, {"i": 16, "sec": "tb", "label": "亞爾薩斯", "zh": "法國想打敗德國，奪回阿爾薩斯－洛林。"}, {"i": 17, "sec": "tb", "label": "兩大同盟", "zh": "三國同盟1882：德、奧匈、意。三國協約1907：英、法、俄。"}, {"i": 18, "sec": "tb", "label": "連鎖反應", "zh": "同盟影響：爭執更容易因連鎖反應變成大規模戰爭。"}, {"i": 19, "sec": "tb", "label": "陣營地圖", "zh": "地圖：20世紀初歐洲兩大對立陣營——同盟 vs 協約。"}, {"i": 20, "sec": "tb", "label": "敵友關係", "zh": "活動例子：普法戰爭後，法德為敵。"}, {"i": 21, "sec": "tb", "label": "殖民原因", "zh": "工業革命→需要殖民地提供原料與市場；德國擴張積極。"}, {"i": 22, "sec": "tb", "label": "三場危機", "zh": "非洲衝突：突尼斯1881法vs意；法紹達1898英vs法；摩洛哥1905–06／1911法vs德。"}, {"i": 23, "sec": "tb", "label": "軍備競賽", "zh": "軍備競賽：擴軍（徵兵制）、武器、無畏艦；英德競爭最烈。"}, {"i": 24, "sec": "tb", "label": "軍力上升", "zh": "比較表1870對1914：常備軍、陸軍軍費、海軍軍費、軍艦噸位——全部急升。"}, {"i": 25, "sec": "tb", "label": "無畏艦", "zh": "無畏艦HMS Dreadnought（英國，1906）：火力與動力更強→全球海軍競賽。"}, {"i": 26, "sec": "tb", "label": "海牙失敗", "zh": "海牙會議1899與1907嘗試裁軍但失敗。"}, {"i": 27, "sec": "nb", "label": "Great power", "zh": "列強／強國：在文化、軍事、政治、經濟、地理方面強大，因而有重大世界影響力。"}, {"i": 28, "sec": "nb", "label": "五方面細", "zh": "軍事：武器／陸海軍。經濟：貿易／GDP。地理：資源／位置。政治：穩定政府。文化：語言／宗教／習俗。"}, {"i": 29, "sec": "nb", "label": "列強名單", "zh": "筆記列強：英、德、法、奧匈、俄（課本亦有意大利）。"}, {"i": 30, "sec": "nb", "label": "四遠因", "zh": "遠因：1極端民族主義 2同盟制度 3軍備競賽 4殖民競爭。近因：1914薩拉熱窩。"}, {"i": 31, "sec": "nb", "label": "民族筆記", "zh": "民族主義：同語言／文化／種族求獨立。1870後極端＝擴張＋復仇。"}, {"i": 32, "sec": "nb", "label": "泛德筆記", "zh": "泛德意志（課本p.7）：大德意志帝國；統一日耳曼人；更多殖民地；稱霸。"}, {"i": 33, "sec": "nb", "label": "泛斯筆記", "zh": "泛斯拉夫：在俄國下統一斯拉夫人；俄國在巴爾幹半島的影響力。"}, {"i": 34, "sec": "nb", "label": "法復仇筆記", "zh": "法國復仇：打德國；失去阿爾薩斯－洛林；普法戰後巨額賠款。"}, {"i": 35, "sec": "nb", "label": "大塞爾維亞", "zh": "塞爾維亞：大塞爾維亞運動——在巴爾幹擴張。"}, {"i": 36, "sec": "nb", "label": "奧匈巴爾幹", "zh": "奧匈：在巴爾幹擴張（如對俄、塞）；壓制獨立運動。"}, {"i": 37, "sec": "nb", "label": "民族影響", "zh": "極端民族主義影響：緊張↑；軍備競賽↑（如英德海軍）；推動擴張→殖民競爭。"}, {"i": 38, "sec": "nb", "label": "俾斯麥目的", "zh": "同盟制度：俾斯麥（德國）旨在避免對法、俄兩面作戰。"}, {"i": 39, "sec": "nb", "label": "三皇同盟", "zh": "三皇同盟1873：德、奧匈、俄。"}, {"i": 40, "sec": "nb", "label": "同盟影響", "zh": "影響：1兩大陣營／氣氛緊張 2地區戰→全面戰 3秘密同盟→互相猜忌。"}, {"i": 41, "sec": "nb", "label": "殖民心智圖", "zh": "殖民競爭原因心智圖：市場·原料·宗教·國際地位·實力象徵·擴張。"}, {"i": 42, "sec": "nb", "label": "帝國主義", "zh": "帝國主義：把一國政治經濟影響力與領土伸延到國土以外的思想與政策。"}, {"i": 43, "sec": "nb", "label": "要殖民地", "zh": "為何要殖民地：1工業革命後——原料、市場、廉價勞工 2國力象徵。"}, {"i": 44, "sec": "nb", "label": "殖民影響", "zh": "影響：關係惡化；衝突→戰前危機；軍備↑；促成同盟（意因突尼斯；協約因第一次摩洛哥）。"}, {"i": 45, "sec": "nb", "label": "軍備原因", "zh": "為何軍備：防衛／安全·不安·擴張·備戰·保護國與殖民地·實力象徵。"}, {"i": 46, "sec": "nb", "label": "軍備形式", "zh": "形式：陸軍競賽＋徵兵；武器（炮、坦克、機槍）；1906起無畏艦海軍競賽英vs德。"}, {"i": 47, "sec": "nb", "label": "軍備影響", "zh": "影響：關係惡化；好戰氣氛；不願和平解決；拒絕裁軍——海牙1899與1907失敗。"}, {"i": 48, "sec": "nb", "label": "遠因互連", "zh": "總複習：四個遠因互相推動——民族推軍備與殖民；殖民推同盟；同盟令戰爭更大。"}, {"i": 49, "sec": "cart", "label": "漫畫入門", "zh": "政治漫畫用比喻與誇張圖像。先認國族符號。"}, {"i": 50, "sec": "cart", "label": "英國符號", "zh": "英國符號：約翰牛 John Bull · 獅。"}, {"i": 51, "sec": "cart", "label": "法國符號", "zh": "法國符號：瑪麗安 Marianne · 公雞。"}, {"i": 52, "sec": "cart", "label": "德國符號", "zh": "德國：戴尖頂盔（Pickelhaube）的士兵。"}, {"i": 53, "sec": "cart", "label": "其他符號", "zh": "奧匈：雙頭鷹。美國：Uncle Sam／禿鷹。俄國：熊。"}, {"i": 54, "sec": "cart", "label": "Source A", "zh": "Source A（約1900法漫畫「和平愛好者」）：人坐在炸藥桶上——三國同盟背景。"}, {"i": 55, "sec": "cart", "label": "Source B", "zh": "Source B（1904英）：Only William’s Way——德皇威廉二世；法國夫人與約翰牛。"}, {"i": 56, "sec": "cart", "label": "答題結構", "zh": "漫畫答法：指出特徵；用資料＋自己知識分析態度／國際局勢。"}, {"i": 57, "sec": "ws", "label": "WS2漫畫", "zh": "Worksheet 2 Source A：1908英漫畫——德皇(Y)押三艘無畏艦；約翰牛(X)再加三艘。"}, {"i": 58, "sec": "ws", "label": "(a) 認人", "zh": "(a) 指出X與Y：X＝約翰牛（英國）；Y＝德皇威廉二世（德國）。"}, {"i": 59, "sec": "ws", "label": "(b) 競賽", "zh": "(b) 所示競賽：英德海軍／無畏艦競賽。線索：他們用無畏艦模型打賭。"}, {"i": 60, "sec": "ws", "label": "(c) 答法", "zh": "(c) 競賽如何影響英德關係：資料一個理由＋自己知識一個（1+2+2）。"}, {"i": 61, "sec": "ws", "label": "Pre-WS", "zh": "Pre-lesson WS1–2在範圍內。同一套漫畫方法：符號→線索→資料＋自己知識。"}, {"i": 62, "sec": "tb", "label": "時間線", "zh": "戰爭時間線背景：拿破崙→克里米亞→普法→日俄→巴爾幹→一戰。"}, {"i": 63, "sec": "tb", "label": "死亡數字", "zh": "死亡：一戰約800–1000萬；二戰高得多（數千萬）。不同版本數字可略有出入。"}, {"i": 64, "sec": "tb", "label": "學習焦點", "zh": "學習焦點1比較兩次大戰，方便之後放入一戰遠因。"}, {"i": 65, "sec": "tb", "label": "海軍與孤立", "zh": "英國最強海軍保護航線與帝國；孤立≠弱。"}, {"i": 66, "sec": "tb", "label": "威脅句", "zh": "考試句：德國增長的海軍與殖民地威脅英國的世界地位。"}, {"i": 67, "sec": "tb", "label": "普法三點", "zh": "普法1870–1871：法敗；亞洛歸德；巨額賠款。"}, {"i": 68, "sec": "tb", "label": "大哥含意", "zh": "「斯拉夫大哥」＝俄國自認領導斯拉夫民族。"}, {"i": 69, "sec": "tb", "label": "多民族", "zh": "多民族＝多人要獨立；奧匈要壓制。"}, {"i": 70, "sec": "tb", "label": "對比句", "zh": "對比句：民族主義求獨立；極端民族主義求擴張或復仇。"}, {"i": 71, "sec": "tb", "label": "背誦法", "zh": "背誦：同盟1882德奧意（歐陸三角）。協約1907把海軍強國英國加進法俄。"}, {"i": 72, "sec": "tb", "label": "地圖顏色", "z  var EST=STEPS.map(function(s,si){var t=2.3;(s.tbmark||[]).concat(s.wbmark||[]).forEach(function(k){if(MSTEP[k]===si&&LABEL[k])t+=3.15;});if(s.teach)t+=s.teach.length*0.02+0.9;(s.fills||[]).forEach(function(f){t+=0.25+(f.kind==="circle"?0.9:f.text.length*(f.text.length>40?0.014:0.045)+0.3);if(f.from)t+=1.12;if(f.teach)t+=f.teach.length*0.02+0.9;});t+=1.4;return Math.max(t,3.2);});
 var START=[],TOTAL=0;EST.forEach(function(e){START.push(TOTAL);TOTAL+=e;});
 var lastSec="";STEPS.forEach(function(s,i){if(!i)return;var k=document.createElement("div");k.className="tick";k.style.left=(START[i]/TOTAL*100)+"%";if(s.sec&&s.sec!==lastSec){var sp=document.createElement("span");sp.textContent=s.sec.charAt(0);k.appendChild(sp);k.style.background="#ffdd00";lastSec=s.sec;}$("track").appendChild(k);});
 function fmt(s){s=Math.max(0,Math.floor(s));return("0"+Math.floor(s/60)).slice(-2)+":"+("0"+(s%60)).slice(-2);}
 function nowT(){return START[cur]+Math.min(EST[cur],((paused?pauseAt:Date.now())-stepT0)/1000*SPEED);}
 setInterval(function(){var t=nowT();$("fill").style.width=(t/TOTAL*100)+"%";$("knob").style.left=(t/TOTAL*100)+"%";$("ptime").textContent=fmt(t)+" / "+fmt(TOTAL);},200);
 function seekFrac(f){var t=f*TOTAL,i=0;for(var j=0;j<START.length;j++)if(START[j]<=t)i=j;return i;}
 var dragging=false;
 function fracOf(e){var r=$("track").getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));}
 $("track").addEventListener("pointerdown",function(e){dragging=true;$("track").setPointerCapture(e.pointerId);var f=fracOf(e);$("knob").style.left=(f*100)+"%";});
 $("track").addEventListener("pointermove",function(e){if(!dragging)return;var f=fracOf(e);$("knob").style.left=(f*100)+"%";$("ptime").textContent=fmt(f*TOTAL)+" / "+fmt(TOTAL);});
 $("track").addEventListener("pointerup",function(e){if(!dragging)return;dragging=false;go(seekFrac(fracOf(e)));});
 $("pp").onclick=function(){$("play").onclick();};
 function setSpeed(v){var t=nowT();SPEED=v;stepT0=Date.now()-(t-START[cur])*1000/SPEED;if(paused)pauseAt=Date.now();
   document.documentElement.style.setProperty("--tf",(0.9/SPEED)+"s");document.documentElement.style.setProperty("--tz",(0.6/SPEED)+"s");document.documentElement.style.setProperty("--tc",(0.8/SPEED)+"s");$("spd").value=String(v);$("spdv").textContent=v.toFixed(2)+"x";
   try{localStorage.setItem("geo1_spd",String(v));}catch(e){}}
 $("spd").oninput=function(){setSpeed(parseFloat($("spd").value));};
 try{var sv=parseFloat(localStorage.getItem("geo1_spd"));if(sv>0)setSpeed(sv);}catch(e){}
 function setZh(on){document.body.classList.toggle("zhon",on);$("zhbtn").classList.toggle("on",on);$("zhbtn").textContent=on?"中文 ✓":"中文";try{localStorage.setItem("hwv_zh",on?"1":"0");}catch(e){}}
 $("zhbtn").onclick=function(){setZh(!document.body.classList.contains("zhon"));};
 try{setZh(localStorage.getItem("hwv_zh")==="1");}catch(e){setZh(false);}
 document.querySelectorAll(".stage img").forEach(function(im){im.addEventListener("load",function(){if(lastT)focusCam("tcam",lastT[0],lastT[1]);if(lastW)focusCam("wcam",lastW[0],lastW[1]);});});
 window.go=go; window.onStepDone=onStepDone; window.setPlay=setPlay;
 (function(){var m=location.search.match(/[?&]step=(\d+)/);var n=m?+m[1]:0;if(!(n>=0&&n<STEPS.length))n=0;go(n);setPlay(false);})();
})();
</script>

<script>
(function(){
  function install(){
    if(typeof onStepDone!=="function" || !window.__histMaybeQuiz){setTimeout(install,50);return;}
    if(onStepDone.__hist)return;
    var orig=onStepDone;
    window.onStepDone=function(){
      var s=STEPS[cur];
      window.__histMaybeQuiz(s, function(){ orig(); });
    };
    window.onStepDone.__hist=1;
    var _go=go;
    window.go=function(n){if(n===0&&window.__histResetQuizRun)__histResetQuizRun(); return _go(n);};
  }
  install();
})();
</script>

<script>
(function(){
  function bootStep(){
    if(typeof go!=="function"||!window.STEPS){setTimeout(bootStep,50);return;}
    var m=location.search.match(/[?&]step=(\d+)/);
    if(!m)return;
    var n=+m[1];
    if(n>=0&&n<STEPS.length){setTimeout(function(){go(n);setPlay(false);},1200);setTimeout(function(){go(n);setPlay(false);},2200);}
  }
  bootStep();
})();
</script>
</body>
