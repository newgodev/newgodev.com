<!DOCTYPE html>
<html lang="zh-HK">
<head>
<script>if(location.protocol==="http:")location.replace("https://"+location.host+location.pathname+location.search);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作文默寫練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&family=Noto+Serif+HK:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#14121a;--muted:#5d5a66;--pur:#5b2bd6;--pur2:#8a63ff;--blue:#1d4ed8;--red:#d4351c;--ok:#15803d;--gold:#b88400}
*{box-sizing:border-box}
html{color-scheme:light;background:#fff;font-size:18px}
body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans HK",Arial,sans-serif;min-height:100vh;overflow-x:hidden}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:4px solid var(--pur);padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ttl{font-family:"Noto Serif HK",serif;font-weight:900;font-size:1.2rem;color:var(--pur)}
.rank{font-weight:900;color:#fff;background:linear-gradient(90deg,var(--pur),var(--pur2));border-radius:999px;padding:3px 14px;font-size:.9rem;box-shadow:0 0 12px rgba(91,43,214,.45)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:inherit;font-size:.8rem;font-weight:700;border:2px solid #d9d0f7;background:#fff;color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip.on{border-color:var(--pur);color:var(--pur)}
.chip.done{background:#efe9ff}
.sp{flex:1}
.mute{font-family:inherit;font-weight:900;border:2px solid var(--ink);background:#fff;border-radius:6px;padding:3px 10px;cursor:pointer}
.wrap{max-width:1250px;margin:0 auto;padding:14px 16px 40px}
.roxy{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.roxy .av{flex:none;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a9c4ff,#3b5bdb);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #dbe4ff}
.roxy .bub{background:#f3f6ff;border:2px solid #c9d6ff;border-radius:14px;padding:8px 14px;font-weight:700;line-height:1.6}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.paperbox{position:relative;border:2px solid var(--ink);border-radius:8px;padding:16px 18px 22px;background:#fff;overflow:hidden;min-height:340px}
.circle{position:absolute;right:-120px;top:-120px;width:420px;height:420px;opacity:.09;animation:spin 40s linear infinite;pointer-events:none}
.circle.small{left:-90px;bottom:-110px;right:auto;top:auto;width:300px;height:300px;animation-duration:28s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.plab{position:relative;font-weight:900;color:var(--muted);font-size:.85rem;margin-bottom:6px}
.prog{position:relative;display:flex;gap:6px;margin-bottom:10px}
.prog i{flex:1;height:8px;border-radius:999px;background:#eee}
.prog i.on{background:linear-gradient(90deg,var(--pur),var(--pur2))}
.prog i.cur{background:#cdbcff;animation:pulseb 1s infinite}
@keyframes pulseb{50%{opacity:.5}}
.para{position:relative;font-family:"Noto Serif HK",serif;font-size:1.25rem;line-height:2.3;text-indent:2em;margin:0}
.c{color:var(--blue)}
.o{color:var(--red)}
.bk{display:inline-block;min-height:1.5em;line-height:1.5em;border-bottom:3px dashed #b9a8f0;margin:0 3px;vertical-align:baseline;text-indent:0;color:#c9bff0;border-radius:3px;transition:background .3s}
.bk.cur{border-bottom-color:var(--pur);background:rgba(138,99,255,.12);animation:glow 1.1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(138,99,255,.18)}}
.bk.fill{border-bottom-color:transparent;background:none;animation:land .5s}
.bk.fill.o{color:var(--red)}.bk.fill.c{color:var(--blue)}
@keyframes land{0%{transform:scale(1.4);filter:drop-shadow(0 0 10px #8a63ff)}100%{transform:scale(1)}}
.paperbox.cleared{box-shadow:0 0 0 5px #d9f2df;border-color:var(--ok)}
.side h3{margin:0 0 8px;font-size:1rem}
.side h3 span{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tile{font-family:"Noto Serif HK",serif;font-size:1.02rem;font-weight:700;text-align:left;border:2px solid #d9d0f7;background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 #e4ddfb;transition:transform .12s,box-shadow .12s,opacity .3s;animation:tin .35s backwards}
.tile:hover{transform:translateY(-2px);box-shadow:0 5px 0 #d4c8fb;border-color:var(--pur2)}
.tile.bad{animation:shake .4s;border-color:var(--red);background:#fff0ee}
@keyframes tin{from{opacity:0;transform:scale(.7)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fly{position:fixed;z-index:60;pointer-events:none;font-family:"Noto Serif HK",serif;font-weight:700;background:#fff;border:2px solid var(--pur2);border-radius:10px;padding:8px 12px;box-shadow:0 10px 30px rgba(91,43,214,.35);
  transition:left .45s cubic-bezier(.5,0,.2,1),top .45s cubic-bezier(.5,0,.2,1),transform .45s,opacity .45s}
.mana{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-weight:900;color:var(--pur)}
.mana .bar{flex:1;height:12px;border-radius:999px;background:#eee;overflow:hidden}
.mana .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a63ff,#3b82f6,#8a63ff);background-size:200% 100%;animation:flow 2s linear infinite;transition:width .3s}
@keyframes flow{to{background-position:200% 0}}
.stat{font-size:.85rem;color:var(--muted)}
.ol{border:2px solid #cfcfd6;border-radius:10px;padding:10px 12px;font-size:.85rem;line-height:1.6;background:#fff}
.ol .h{font-weight:900;color:var(--red);margin-bottom:4px}
.ol .bx{border:1.5px solid #aaa;border-radius:8px;padding:4px 8px;margin-bottom:6px}
.ol .lab{font-weight:700;color:#555;font-size:.78rem}
.ol .r{color:var(--red)}
.ol .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ol ul{margin:0;padding-left:1.1em}
.btn{font-family:inherit;font-weight:900;font-size:1rem;border:0;border-radius:10px;padding:10px 20px;background:var(--pur);color:#fff;cursor:pointer;box-shadow:0 5px 0 #3a1896}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3a1896}
.btn.ghost{background:#fff;color:var(--pur);border:2px solid var(--pur);box-shadow:none}
.card{border:2px solid #e3dcfa;border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card .hd b{flex:1}
.chk{cursor:pointer;border-bottom:2px dotted var(--red);border-radius:3px;transition:background .2s}
.chk.got{background:#dcfce7;color:var(--ok);border-bottom-color:var(--ok)}
.hide{display:none!important}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none}
.over{position:fixed;inset:0;z-index:80;background:rgba(255,255,255,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .4s}
.over.show{opacity:1;pointer-events:auto}
.over .mc{width:min(70vw,420px);height:min(70vw,420px);animation:spin 6s linear infinite;filter:drop-shadow(0 0 18px rgba(91,43,214,.5))}
.over .big{font-family:"Noto Serif HK",serif;font-weight:900;font-size:2.4rem;color:var(--pur);margin-top:calc(-1 * min(40vw,240px));position:relative}
.over .sub{font-weight:700;font-size:1.1rem;margin:14px 0 18px;max-width:560px;line-height:1.7;position:relative;background:rgba(255,255,255,.88);border-radius:10px;padding:6px 14px}
.over .big{background:rgba(255,255,255,.8);border-radius:12px;padding:0 14px}
.over.rankup .mc{animation:spin 6s linear infinite,grow .9s cubic-bezier(.2,.9,.2,1.2)}
@keyframes grow{from{transform:scale(0) rotate(-180deg)}}
.seal{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b18cff,#5b2bd6 60%,#3a1896);box-shadow:0 0 40px rgba(91,43,214,.6),inset 0 0 30px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Noto Serif HK",serif;font-weight:900;font-size:2.4rem;cursor:pointer;animation:breathe 1.8s infinite;position:relative}
@keyframes breathe{50%{transform:scale(1.05);box-shadow:0 0 70px rgba(91,43,214,.8),inset 0 0 30px rgba(0,0,0,.25)}}
.seal.crack{animation:crack .7s forwards}
@keyframes crack{30%{transform:scale(1.15) rotate(-6deg)}100%{transform:scale(2.4);opacity:0}}
body.shake .wrap{animation:shake .35s}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="over show" id="intro">
  <div style="font-weight:900;color:var(--muted);margin-bottom:18px">作文默寫練習 · 按一下開始</div>
  <div class="seal" id="seal">開始</div>
</div>

<div class="over" id="rk">
  <svg class="mc" viewBox="0 0 200 200" id="mc"></svg>
  <div class="big" id="rkBig"></div>
  <div class="sub" id="rkSub"></div>
  <button class="btn" id="rkGo">繼續 →</button>
</div>

<div class="top">
  <span class="ttl">作文默寫練習</span><span class="rank" id="rank">初級</span>
  <div class="chips" id="chips"></div><div class="sp"></div>
</div>

<div class="wrap">
  <div class="roxy"><div class="av">文</div><div class="bub" id="say"></div></div>

  <div id="play">
    <div class="grid">
      <div class="paperbox" id="pbox">
        <svg class="circle" viewBox="0 0 200 200" id="c1"></svg><svg class="circle small" viewBox="0 0 200 200" id="c2"></svg>
        <div class="prog" id="prog"></div>
        <div class="plab" id="plab"></div>
        <p class="para" id="para"></p>
      </div>
      <div class="side">
        <div class="mana">熟練度 <div class="bar"><i id="mana"></i></div><span id="combo"></span></div>
        <h3>要填的詞<span id="poolHint">按下一格要放的那個詞</span></h3>
        <div class="pool" id="pool"></div>
        <div class="stat" id="stat"></div>
        <div id="olWrap" class="hide" style="margin-top:14px"><h3>你的大綱<span>星期三 iPad 上只有這一張</span></h3><div class="ol" id="ol1"></div></div>
      </div>
    </div>
  </div>

  <div id="silent" class="hide">
    <div class="grid">
      <div id="cards"></div>
      <div class="side"><h3>你的大綱<span>只看這一張,講出口或者寫在紙上</span></h3><div class="ol" id="ol2"></div>
        <div class="card" style="margin-top:14px"><b>記到幾多紅字:</b> <span id="silScore">0 / 0</span><div class="stat" style="margin-top:6px">每段展開之後,按一下你記得的紅字,它會變綠。</div>
        <div style="margin-top:10px"><button class="btn" id="finish">完成</button></div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
var $=function(id){return document.getElementById(id);};
var PARAS=[
 [["o","孔子說:"],["c","「益者三友……友直,友諒,友多聞,益矣。」"],["o","意思是正直、誠實可信、見聞廣博的朋友,對我們有益。"],["o","《無職轉生》的主角"],["c","魯迪是否一位益友"],["o","呢?"],["c","益友"],["o",",就是"],["c","正直、誠實可信、見聞廣博"],["o",",又能"],["c","令朋友變好"],["o","的人。"],["o","我認為,"],["c","魯迪是一位益友"],["o","。"]],
 [["o","首先,"],["c","魯迪正直,敢為朋友出頭"],["o","。"],["c","希露菲"],["o","因為一頭"],["c","綠頭髮"],["o",",常常被村中的孩子"],["c","欺負"],["o","。"],["c","魯迪"],["o","沒有袖手旁觀,他"],["c","出手保護"],["o","希露菲,更"],["c","成為她第一個朋友"],["o","。"],["o","孔子說:"],["c","「見義不為,無勇也。」"],["o","意思是看見應該做的事卻不去做,就是沒有勇氣。"],["o","魯迪做到了,可見他是一位正直的益友。"]],

 [["o","綜上所述,魯迪"],["c","正直"],["o","、"],["c","誠實可信"],["o",",又"],["c","見聞廣博"],["o",",符合孔子所說的「益者三友」。所以,我認為"],["c","魯迪是一位益友"],["o","。"],["o","我們交朋友時,也要學會分辨益友,更要努力成為別人的益友。"]]
];
var LABS=["第一段 · 引入 + 立場","第二段 · 左格:正直","第三段 · 中格:誠實可信","第四段 · 右格:見聞廣博","第五段 · 結論(大綱沒有這一格)"];
var DECOY=[["首先,","可見他是一位益友。","我覺得魯迪可能是益友。"],["其次,","意思是要做一個令朋友信任的人。","可見他是一位誠實可信的益友。"],["首先,","可見他是一位正直的益友。","意思是看見應該做的事卻不去做,就是沒有勇氣。"],["其次,","可見他是一位正直的益友。","所以他很厲害。"],["由此可見,魯迪","首先,","所以,魯迪可能不是益友。"]];
var LV=[
 {n:"初級",hint:true,say:"作文不是背出來的,是組合出來的。藍字大綱已經幫你寫好,紅字才是要記的重點。每一格給你第一個字做提示。"},
 {n:"中級",say:"很好。這一級,提示沒有了。紅字要自己認得。"},
 {n:"上級",dec:true,say:"干擾選項會混進來 —— 「其次」放錯段、「可見」用錯詞。看清楚這一段是哪一格。"},
 {n:"高級",dec:true,blue:true,ol:true,say:"連大綱上的字也要你自己放。右邊只有大綱,跟星期三一模一樣。"},
 {n:"默寫級",silent:true,say:"最後一關:全默。沒有詞語卡,只有大綱。每一段先講出口,或者寫在紙上,然後才展開對答案。"}
];
var TITLES=["初級","中級","上級","高級","默寫級","進階","滿分級"];
var lv=0,pi=0,blanks=[],cur=0,combo=0,wrong=0,done={},muted=false,AC=null;
try{ done=JSON.parse(localStorage.getItem("mushou_done")||"{}")||{}; }catch(e){ done={}; }
function save(){ try{ localStorage.setItem("mushou_done",JSON.stringify(done)); }catch(e){} }

function snd(f,d,type,vol){ return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime; o.type=type||"triangle"; o.frequency.value=f; g.gain.setValueAtTime(vol||.07,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d); }catch(e){} }

function fanfare(){ [523,659,784,1047,1319].forEach(function(f,k){ setTimeout(function(){ snd(f,.4,"triangle",.08); },k*110); }); }
function thud(){ snd(120,.3,"sawtooth",.06); }

var cv=$("fx"),cx=cv.getContext("2d"),P=[];
function fit(){ cv.width=innerWidth; cv.height=innerHeight; } fit(); addEventListener("resize",fit);
function burst(x,y,n,cols,sp){ for(var k=0;k<n;k++){ var a=Math.random()*Math.PI*2,v=(sp||6)*(.3+Math.random()); P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.05,l:50+Math.random()*40,c:cols[k%cols.length],s:2+Math.random()*4}); } }

(function loop(){ cx.clearRect(0,0,cv.width,cv.height); P=P.filter(function(p){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=.98; p.l--; cx.globalAlpha=Math.min(1,p.l/25); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.s,0,Math.PI*2); cx.fill(); return p.l>0; }); cx.globalAlpha=1; requestAnimationFrame(loop); })();

   col("魯迪見聞廣博,教朋友知識",["教希露菲治癒魔法","艾莉絲九歲只會寫名字","教了三年:會讀寫計算","前後對比:朋友變更好"],"舉例、對比")+"</div>";
}
$("ol1").innerHTML=outlineHTML(); $("ol2").innerHTML=outlineHTML();

function core(t){ return t.replace(/[,。、:;?!「」《》…\s]/g,""); }
function isBlank(seg,L){ if(core(seg[1]).length<2) return false; return seg[0]==="o" || !!L.blue; }
function shuffle(a){ a=a.slice(); for(var k=a.length-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var x=a[k]; a[k]=a[j]; a[j]=x; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function chips(){
  var h=""; LV.forEach(function(L,k){ h+='<button class="chip'+(k===lv?" on":"")+(done[k]?" done":"")+'" data-k="'+k+'">'+L.n+(done[k]?" ✓":"")+"</button>"; });
  $("chips").innerHTML=h; document.querySelectorAll(".chip").forEach(function(b){ b.onclick=function(){ startLevel(+b.dataset.k); }; });
  $("rank").textContent=TITLES[lv];
}
function startLevel(k){
  lv=k; pi=0; combo=0; wrong=0; chips(); $("say").textContent="「"+LV[k].say+"」";
  if(LV[k].silent){ $("play").classList.add("hide"); $("silent").classList.remove("hide"); silentStart(); return; }
  $("silent").classList.add("hide"); $("play").classList.remove("hide");
  $("olWrap").classList.toggle("hide",!LV[k].ol);
  renderPara();
}
function renderPara(){
  var L=LV[lv], segs=PARAS[pi], h=""; blanks=[]; cur=0;
  $("pbox").classList.remove("cleared");
  $("plab").textContent=LABS[pi];
  var pg=""; for(var k=0;k<5;k++) pg+='<i class="'+(k<pi?"on":k===pi?"cur":"")+'"></i>'; $("prog").innerHTML=pg;
  segs.forEach(function(s,k){
    if(isBlank(s,L)){ var id=blanks.length; blanks.push({t:s[1],kind:s[0]});
      var w=Math.max(2,s[1].length)*1.05;
      h+='<span class="bk" id="bk'+id+'" style="min-width:'+w+'em">'+(L.hint?'<span style="opacity:.55">'+esc(s[1][0]===","||s[1][0]==="。"?s[1].slice(0,2):s[1][0])+"</span>":"")+"</span>";
    } else h+='<span class="'+s[0]+'">'+esc(s[1])+"</span>";
  });
  $("para").innerHTML=h;
  var pieces=blanks.map(function(b){return b.t;});
  if(L.dec) pieces=pieces.concat(DECOY[pi]);
  var pool=$("pool"); pool.innerHTML="";
  shuffle(pieces).forEach(function(t,k){ var b=document.createElement("button"); b.className="tile"; b.textContent=t; b.style.animationDelay=(k*0.03)+"s"; b.onclick=function(){ tap(b); }; pool.appendChild(b); });
  mark(); stat();
}
function mark(){ document.querySelectorAll(".bk").forEach(function(e){ e.classList.remove("cur"); }); var e=$("bk"+cur); if(e) e.classList.add("cur"); }
function stat(){ $("stat").textContent="第 "+(pi+1)+" / 5 段 · 這一段還差 "+(blanks.length-cur)+" 片 · 放錯 "+wrong+" 次"; $("mana").style.width=Math.min(100,combo*10)+"%"; $("combo").textContent=combo>=3?"連擊 × "+combo:""; }
function tap(btn){
  var b=blanks[cur]; if(!b) return;
  if(btn.textContent===b.t){
    var r=btn.getBoundingClientRect(), tg=$("bk"+cur), tr=tg.getBoundingClientRect();
    var f=document.createElement("div"); f.className="fly"; f.textContent=b.t; f.style.left=r.left+"px"; f.style.top=r.top+"px"; document.body.appendChild(f);
    btn.remove(); var k=cur; cur++;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ f.style.left=tr.left+"px"; f.style.top=(tr.top-6)+"px"; f.style.transform="scale(.9)"; f.style.opacity=".2"; }); });
    setTimeout(function(){ f.remove(); tg.innerHTML=esc(b.t); tg.style.minWidth="0"; tg.classList.add("fill",b.kind); var rr=tg.getBoundingClientRect(); burst(rr.left+rr.width/2,rr.top+rr.height/2,26,b.kind==="o"?["#d4351c","#ff9b7a","#8a63ff"]:["#1d4ed8","#7ab0ff","#8a63ff"],5); sparkle(); }, 460);
    combo++; if(combo===10){ setTimeout(function(){ var m=$("mana").getBoundingClientRect(); ring(m.left+m.width/2,m.top); fanfare(); },480); }
    mark(); stat();
    if(cur>=blanks.length) setTimeout(paraDone,900);
  } else {
    wrong++; combo=0; btn.classList.remove("bad"); void btn.offsetWidth; btn.classList.add("bad"); thud();
    document.body.classList.remove("shake"); void document.body.offsetWidth; document.body.classList.add("shake");
    var dc=DECOY[pi].indexOf(btn.textContent)>=0;
    $("say").textContent="「"+(dc?"這是干擾選項。想一想:這一段是哪一格?開頭應該用哪個詞?":"次序不對。先想想這一句下一步要講什麼。")+"」";
    stat();
  }
}
function paraDone(){
  $("pbox").classList.add("cleared"); var r=$("pbox").getBoundingClientRect(); ring(r.left+r.width/2,r.top+r.height/2); fanfare();
  setTimeout(function(){ pi++; if(pi>=5) levelDone(); else { $("say").textContent="「"+LV[lv].say+"」"; renderPara(); } },1300);
}
function rankUp(big,sub,btn,cb){
  var o=$("rk"); o.classList.remove("rankup"); void o.offsetWidth; o.classList.add("rankup","show");
  $("rkBig").textContent=big; $("rkSub").textContent=sub; $("rkGo").textContent=btn;
  setTimeout(function(){ ring(innerWidth/2,innerHeight/2); burst(innerWidth/2,innerHeight/2,120,["#5b2bd6","#8a63ff","#3b82f6","#b88400"],10); fanfare(); },500);
  $("rkGo").onclick=function(){ o.classList.remove("show"); cb(); };
}
function levelDone(){
  done[lv]=1; save();
  var next=lv+1;
  rankUp("升級 · "+TITLES[next], "「"+LV[next].say+"」(這一級放錯 "+wrong+" 次)", "開始"+LV[next].n+" →", function(){ startLevel(next); });
}

var silTotal=0,silGot=0;
function silentStart(){
  var h=""; silTotal=0; silGot=0;
  PARAS.forEach(function(segs,k){
    h+='<div class="card"><div class="hd"><b>'+LABS[k]+'</b><button class="btn ghost" data-p="'+k+'">講完 / 寫完,展開</button></div><p class="para hide" id="sp'+k+'"></p></div>';
  });
  $("cards").innerHTML=h; $("silScore").textContent="0 / 0";
  document.querySelectorAll("#cards .btn").forEach(function(b){ b.onclick=function(){ reveal(+b.dataset.p,b); }; });
}
function reveal(k,btn){
  var p=$("sp"+k), h="";
  PARAS[k].forEach(function(s){ if(s[0]==="o" && core(s[1]).length>=2){ silTotal++; h+='<span class="o chk">'+esc(s[1])+"</span>"; } else h+='<span class="'+s[0]+'">'+esc(s[1])+"</span>"; });
  p.innerHTML=h; p.classList.remove("hide"); btn.remove();
  var r=p.getBoundingClientRect(); burst(r.left+r.width/2,r.top+20,60,["#5b2bd6","#8a63ff","#3b82f6"],7); sparkle();
  p.querySelectorAll(".chk").forEach(function(c){ c.onclick=function(){ c.classList.toggle("got"); silGot+=c.classList.contains("got")?1:-1; $("silScore").textContent=silGot+" / "+silTotal; if(c.classList.contains("got")){ var q=c.getBoundingClientRect(); burst(q.left+q.width/2,q.top+q.height/2,14,["#15803d","#86efac"],4); snd(1760,.12,"triangle",.05); } }; });
  $("silScore").textContent=silGot+" / "+silTotal;
}
$("finish").onclick=function(){
  if(document.querySelectorAll("#cards .btn").length){ $("say").textContent="「還有段落未展開。五段都講完、寫完,才算完成。」"; return; }
  done[4]=1; save(); var pct=silTotal?Math.round(silGot/silTotal*100):0, god=pct>=90;
  rankUp((god?"滿分":"完成")+" · 全默達成",
    "紅字你記得 "+silGot+" / "+silTotal+"("+pct+"%)。你只用了兩日就記熟。星期三,你只需要看大綱,然後默寫。"+(god?"":"再練一次,90% 以上就是滿分。"),
    "再練一次", function(){ startLevel(god?0:4); });
  $("rank").textContent=god?TITLES[6]:TITLES[5];
};

$("seal").onclick=function(){
  var s=$("seal"), r=s.getBoundingClientRect(); s.classList.add("crack");
  burst(r.left+r.width/2,r.top+r.height/2,160,["#5b2bd6","#8a63ff","#3b82f6","#b88400","#fff"],12); ring(r.left+r.width/2,r.top+r.height/2); fanfare();
  setTimeout(function(){ $("intro").classList.remove("show"); startLevel(0); },700);
};
chips();
})();
</script>
