<!doctype html>
<html lang="zh-Hant">
<head>
<script>if(location.protocol==="http:")location.replace("https://"+location.host+location.pathname+location.search);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>hw video</title>
<meta name="description" content="功課影片。打開就揀一個做。">
<meta name="theme-color" content="#14110d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230B0B0E'/%3E%3CclipPath id='c'%3E%3Crect x='0' y='96' width='512' height='416'/%3E%3C/clipPath%3E%3Cg clip-path='url(%23c)'%3E%3Cpolyline points='104,372 104,96 200,372 272,96 344,372 416,96' fill='none' stroke='%23FCBC24' stroke-width='68' stroke-linejoin='miter' stroke-miterlimit='30' stroke-linecap='butt'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Spline+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  font-size:20px;
  --bg:#14110d; --panel:#0f0c09; --line:#2c241a;
  --gold:#e7b173; --gold2:#f3cf99; --gold3:#c98e4a;
  --mtl:#FCBC24; --mtl2:#FFF3C9; --mtl3:#E0A310;
  --ink:#efe4d6; --dim:rgba(164,148,129,.85);
  --hot:#e8674f; --warm:#e7b173; --cool:#9bbf95;
  --card:rgba(28,23,16,.55);
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:#c98e4a #16120d}
::-webkit-scrollbar{width:12px}
::-webkit-scrollbar-track{background:#16120d}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#e7b173,#c98e4a);border-radius:999px;border:3px solid #16120d}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Spline Sans",system-ui,-apple-system,sans-serif; line-height:1.5;
  min-height:100vh; -webkit-font-smoothing:antialiased;
  padding:max(26px,env(safe-area-inset-top)) 0 60px;
  background-image:radial-gradient(1100px 560px at 82% -10%,rgba(252,188,36,.06),transparent 60%),
                   radial-gradient(900px 500px at -10% 110%,rgba(231,177,115,.05),transparent 60%);
}
.wrap{max-width:960px; margin:0 auto; padding:0 20px}
.top{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:11px; margin-right:auto}
.mark{width:40px;height:40px}
.brand h1{font-family:"Fraunces",serif; font-weight:800; font-size:1.7rem; margin:0; letter-spacing:.5px;
  background:linear-gradient(180deg,var(--mtl2),var(--mtl),var(--mtl3));
  -webkit-background-clip:text; background-clip:text; color:transparent}
.search{position:relative; flex:1; min-width:180px; max-width:340px}
.search input{
  width:100%; font-size:.9rem; font-family:inherit; color:var(--ink);
  background:var(--panel); border:1px solid var(--line); border-radius:11px;
  padding:11px 14px 11px 38px; outline:none; transition:border-color .12s;
}
.search input:focus{border-color:var(--gold3)}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; fill:var(--gold3)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:14px}
a.tile{
  display:flex; flex-direction:column; text-decoration:none; color:inherit;
  background:var(--card); border:1px solid var(--line); border-top:4px solid var(--warm);
  border-radius:var(--r); padding:16px 16px 14px; position:relative; min-height:158px;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
  -webkit-tap-highlight-color:rgba(252,188,36,.18);
}
a.tile:active{transform:scale(.985)}
a.tile:hover{border-color:var(--gold3); background:rgba(40,32,22,.66)}
a.tile.hot{border-top-color:var(--hot)}
a.tile.warm{border-top-color:var(--warm)}
a.tile.cool{border-top-color:var(--cool)}
.tags{display:flex; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap}
.tag{font-family:"JetBrains Mono",monospace; font-size:.62rem; letter-spacing:1px; text-transform:uppercase;
  padding:2px 7px; border-radius:99px; border:1px solid var(--line); color:var(--dim)}
.tag.pri-hot{color:#1a0f0b; background:var(--hot); border-color:var(--hot); font-weight:700}
.tag.pri-warm{color:#1a1206; background:var(--warm); border-color:var(--warm); font-weight:700}
.tag.pri-cool{color:#0f1a0d; background:var(--cool); border-color:var(--cool); font-weight:700}
.tt{font-family:"Fraunces",serif; font-weight:600; font-size:1.12rem; color:var(--gold2); margin:0 0 4px}
.sub{font-size:.76rem; color:var(--dim); font-family:"JetBrains Mono",monospace}
.foot-row{margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; gap:8px; padding-top:12px}
.date{font-size:.68rem; color:var(--dim); font-family:"JetBrains Mono",monospace}
.play{width:38px;height:38px;flex:0 0 auto;border-radius:50%;
  background:linear-gradient(180deg,var(--mtl),var(--mtl3)); display:grid; place-items:center;
  box-shadow:0 5px 13px rgba(224,163,16,.3)}
.play svg{width:15px;height:15px;margin-left:2px;fill:#1a1206}
.empty{grid-column:1/-1; border:1px dashed var(--line); border-radius:var(--r); padding:26px; text-align:center; color:var(--dim); font-size:.9rem}
.sec{display:flex; align-items:center; gap:10px; margin:30px 0 12px; font-family:"Fraunces",serif; font-weight:600; font-size:1.05rem; color:var(--gold2)}
.sec .n{font-family:"JetBrains Mono",monospace; font-size:.7rem; color:var(--dim); border:1px solid var(--line); border-radius:99px; padding:1px 8px}
.sec::after{content:""; flex:1; height:1px; background:var(--line)}
a.tile.done{opacity:.62; border-top-color:#6f8f6a; min-height:0}
a.tile.done:hover{opacity:.95}
.tag.ok{color:#0f1a0d; background:#9bbf95; border-color:#9bbf95; font-weight:700}
@media(max-width:520px){
  :root{font-size:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:11px}
  .search{max-width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0B0B0E"/><polyline points="104,372 104,140 200,372 272,140 344,372 416,140" fill="none" stroke="#FCBC24" stroke-width="60" stroke-linejoin="miter" stroke-miterlimit="30"/></svg>
      <h1>hw video</h1>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24"><path d="M21 20l-4.35-4.35a7.5 7.5 0 10-1.4 1.4L20 21zM5 10.5a5.5 5.5 0 1111 0 5.5 5.5 0 01-11 0z"/></svg>
      <input id="q" type="search" placeholder="搜尋科目、功課、日期…" autocomplete="off">
    </label>
  </div>

  <div class="grid" id="grid"></div>
  <div class="sec" id="doneh">已完成 <span class="n" id="donen">0</span></div>
  <div class="grid" id="done"></div>
</div>

<script>
// 加一份新功課:喺 ITEMS 加一行,再喺 repo 開 那個 code/index.html。
// pri 3=最緊要 2=緊要 1=普通;板按 pri 由高到低排,search 即時篩。
var ITEMS = [
  { code:"fn8k2d", title:"FinEd BAFS ACC1 + ACC2 會計等式", subject:"FinEd", kind:"教學片", pri:1, date:"2026-09-30" },
  { code:"rc5w2k", title:"RAC Unit 11 The Art of LEGO", subject:"英文 RAC", kind:"教學片", pri:1, date:"2026-09-30" },
  { code:"zx3m7q", title:"單元一 自習篇章《孟子二則》", subject:"中文", kind:"教學片", pri:2, date:"2026-09-30" },
  { code:"ut9c4n", title:"中文 UT 單元檢測（一）點解錯", subject:"中文", kind:"教學片", pri:3, date:"2026-09-30" },
  { code:"g4w8tz", title:"GEO Workbook Ch1 點樣做", subject:"地理", kind:"教學片", pri:3, date:"2026-09-29" },
{ code:"ze1sdi", done:true, title:"Laws of Indices 小測 點解錯", subject:"數學", kind:"教學片", pri:3, date:"2026-09-29" },
  { code:"6bx7l9", done:true, title:"科學記數法 + 數系", subject:"數學 SOIN", kind:"教學片", pri:3, date:"2026-09-29" },
  { code:"r7m2kq", title:"由大綱寫成文章", subject:"中文作文", kind:"教學片", pri:3, date:"2026-09-28" },
  { code:"q9x4vn", title:"作文 Kahoot",             subject:"中文作文", kind:"練習題", pri:2, date:"2026-09-28" },
  { code:"w3h8pz", title:"作文默寫練習",     subject:"中文作文", kind:"挑戰",   pri:1, date:"2026-09-28" },
];

var LV = {3:{c:"hot",t:"最緊要"},2:{c:"warm",t:"緊要"},1:{c:"cool",t:"普通"}};
var grid = document.getElementById("grid");
var q = document.getElementById("q");
var PLAY = '<span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>';
var sorted = ITEMS.slice().sort(function(a,b){return (b.pri||1)-(a.pri||1);});

var done = document.getElementById("done");
var doneh = document.getElementById("doneh");
var donen = document.getElementById("donen");
function tile(it){
  var lv = LV[it.pri||1];
  var cls = it.done ? "done" : lv.c;
  var first = it.done ? '<span class="tag ok">已完成</span>' : '<span class="tag pri-'+lv.c+'">'+lv.t+'</span>';
  return '<a class="tile '+cls+'" href="./'+it.code+'/">'
    + '<span class="tags">'+first
    +   '<span class="tag">'+it.subject+'</span><span class="tag">'+it.kind+'</span></span>'
    + '<div class="tt">'+it.title+'</div>'
    + '<div class="sub">'+it.code+'</div>'
    + '<div class="foot-row"><span class="date">建立 '+it.date+'</span>'+PLAY+'</div>'
    + '</a>';
}
function render(term){
  term = (term||"").trim().toLowerCase();
  var list = sorted.filter(function(it){
    if(!term) return true;
    return (it.title+" "+it.subject+" "+it.kind+" "+it.date+" "+it.code+(it.done?" 已完成 done":"")).toLowerCase().indexOf(term) >= 0;
  });
  var todo = list.filter(function(it){return !it.done;});
  var fin = list.filter(function(it){return it.done;});
  grid.innerHTML = todo.length ? todo.map(tile).join("")
    : '<div class="empty">'+(term?'找不到「'+term+'」。':'全部做完了。')+'</div>';
  done.innerHTML = fin.map(tile).join("");
  doneh.style.display = fin.length ? "" : "none";
  donen.textContent = fin.length;
}
q.addEventListener("input", function(){ render(q.value); });
render("");
</script>
</body>
</html>
