<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>簡用PDF</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d7dbe2; font-family: "Segoe UI", "PingFang HK", sans-serif; color: #17181a; }
  .phone { width: min(100%, 375px); min-height: 100vh; margin: 0 auto; background: #eef0f3; display: flex; flex-direction: column; }
  button { font: inherit; min-height: 48px; border: 0; background: transparent; color: #17181a; }
  .bar, .foot { display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 0 8px; background: #fff; }
  .grow { flex: 1; min-width: 0; text-align: left; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch { min-width: 48px; color: #1565c0; font-weight: 650; }
  .stage { flex: 1; overflow: auto; padding: 12px; }
  .page { background: #fff; min-height: 460px; margin: 0 auto 12px; box-shadow: 0 1px 2px rgba(0,0,0,.12); display: flex; flex-direction: column; }
  .page b { padding: 16px 16px 0; }
  .page p { margin: 12px 16px 16px; line-height: 1.6; }
  .sheet { width: min(100%, 280px); }
  .wide { width: 100%; }
  .foot button { flex: 1; }
  .muted { color: #5f656e; font-size: 14px; text-align: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .thumb { background: #fff; min-height: 96px; padding: 8px; text-align: left; border: 2px solid transparent; }
  .thumb.on { border-color: #1565c0; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
  .tools button, .save { background: #fff; border-radius: 8px; }
  .save { margin: 0 12px 12px; background: #1565c0; color: #fff; border-radius: 8px; }
  .drawer { position: fixed; inset: 0 auto 0 0; width: min(280px, 80vw); background: #fff; padding: 16px; transform: translateX(-105%); transition: transform .2s; }
  .drawer.on { transform: none; }
  .note { margin: 8px 12px 0; color: #5f656e; font-size: 13px; }
</style>
</head>
<body>
<div class="phone">
  <div class="bar">
    <button id="toc" type="button">目錄</button>
    <div class="grow" id="name">功課.pdf</div>
    <button id="mode" class="switch" type="button">改</button>
  </div>
  <p class="note" id="note">連續捲。適頁。每份檔會記住頁同放大。</p>
  <div class="stage" id="view"></div>
  <div class="foot" id="viewFoot">
    <button id="layout" type="button">單頁</button>
    <button id="zoom" type="button">適闊</button>
    <div class="muted" id="pos">1 / 4</div>
  </div>
  <div class="tools" id="tools" hidden>
    <button type="button" data-act="left">左轉</button>
    <button type="button" data-act="right">右轉</button>
    <button type="button" data-act="up">前移</button>
    <button type="button" data-act="down">後移</button>
    <button type="button" data-act="del">刪除</button>
    <button type="button" data-act="blank">空白頁</button>
  </div>
  <button class="save" id="save" type="button" hidden>儲存</button>
</div>
<aside class="drawer" id="drawer">
  <strong>目錄</strong>
  <p>呢份冇目錄。</p>
  <button id="closeToc" type="button">關閉</button>
</aside>
<script>
const pages = [
  { t: "第 1 頁", d: "中間係頁。連續捲落去。" },
  { t: "第 2 頁", d: "放大預設適頁。可以轉適闊。" },
  { t: "第 3 頁", d: "改頁先按右上角「改」。" },
  { t: "第 4 頁", d: "呢度未有簽名、辨字、出 Word。" }
];
let continuous = true, fit = true, edit = false, current = 0;
const view = document.getElementById("view");
const pos = document.getElementById("pos");
function paint() {
  document.getElementById("mode").textContent = edit ? "睇" : "改";
  document.getElementById("viewFoot").hidden = edit;
  document.getElementById("tools").hidden = !edit;
  document.getElementById("save").hidden = !edit;
  document.getElementById("layout").textContent = continuous ? "單頁" : "連續";
  document.getElementById("zoom").textContent = fit ? "適闊" : "適頁";
  document.getElementById("note").textContent = edit
    ? "改呢一頁。睇返按「睇」。"
    : (continuous ? "連續捲。" : "單頁。") + (fit ? "適頁。" : "適闊。");
  pos.textContent = pages.length ? (current + 1) + " / " + pages.length : "0";
  view.innerHTML = "";
  if (!pages.length) {
    view.innerHTML = "<p class='muted'>未有頁。</p>";
    return;
  }
  if (edit) {
    const grid = document.createElement("div");
    grid.className = "grid";
    pages.forEach((p, i) => {
      const b = document.createElement("button");
      b.className = "thumb" + (i === current ? " on" : "");
      b.textContent = p.t;
      b.onclick = () => { current = i; paint(); };
      grid.appendChild(b);
    });
    view.appendChild(grid);
    return;
  }
  const show = continuous ? pages : [pages[current]];
  show.forEach((p) => {
    const el = document.createElement("article");
    el.className = "page " + (fit ? "sheet" : "wide");
    el.innerHTML = "<b>" + p.t + "</b><p>" + p.d + "</p>";
    view.appendChild(el);
  });
}
document.getElementById("mode").onclick = () => { edit = !edit; paint(); };
document.getElementById("layout").onclick = () => { continuous = !continuous; paint(); };
document.getElementById("zoom").onclick = () => { fit = !fit; paint(); };
document.getElementById("toc").onclick = () => document.getElementById("drawer").classList.add("on");
document.getElementById("closeToc").onclick = () => document.getElementById("drawer").classList.remove("on");
document.getElementById("save").onclick = () => { document.getElementById("note").textContent = "已記低。手機版先寫入你揀嘅位置。"; };
document.getElementById("tools").onclick = (event) => {
  const act = event.target.dataset.act;
  if (!act || !pages.length) return;
  if (act === "del") pages.splice(current, 1);
  if (act === "blank") pages.splice(current + 1, 0, { t: "空白頁", d: "" });
  if (act === "up" && current > 0) {
    [pages[current - 1], pages[current]] = [pages[current], pages[current - 1]];
    current -= 1;
  }
  if (act === "down" && current < pages.length - 1) {
    [pages[current + 1], pages[current]] = [pages[current], pages[current + 1]];
    current += 1;
  }
  if (act === "left" || act === "right") pages[current].d = (act === "left" ? "已左轉。" : "已右轉。");
  current = Math.max(0, Math.min(current, pages.length - 1));
  paint();
};
paint();
</script>
</body>
</html>
