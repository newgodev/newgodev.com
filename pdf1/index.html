<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>簡用PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d7dbe2; font-family: "PingFang HK", "Segoe UI", sans-serif; color: #17181a; }
  button, input { font: inherit; color: inherit; }
  .phone { width: min(100%, 375px); min-height: 100vh; margin: 0 auto; background: #eef0f3; display: flex; flex-direction: column; position: relative; }
  .bar, .foot { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 8px; background: #fff; }
  .bar button, .foot button, .menu button, .onpage button { min-height: 48px; border: 0; background: transparent; }
  .name { flex: 1; min-width: 0; text-align: left; font-weight: 650; background: transparent; border: 0; min-height: 48px; padding: 0 8px; }
  .name:focus { outline: 2px solid #1565c0; }
  .switch { flex: none; min-width: 48px; color: #1565c0; font-weight: 650; }
  .stage { flex: 1; overflow: auto; padding: 12px; }
  .page { background: #fff; margin: 0 auto 12px; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .page.on { outline: 2px solid #1565c0; }
  .page canvas { display: block; width: 100%; height: auto; }
  .sheet { width: min(100%, 280px); }
  .wide { width: 100%; }
  .onpage { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; padding: 8px; background: #f4f7fb; }
  .onpage button { background: #fff; border-radius: 8px; }
  .foot button { flex: 1; }
  .muted { color: #5f656e; text-align: center; padding: 32px 16px; }
  .menu { position: absolute; top: 52px; left: 8px; z-index: 2; background: #fff; min-width: 180px; box-shadow: 0 8px 24px rgba(0,0,0,.16); display: none; }
  .menu.on { display: block; }
  .menu button { display: block; width: 100%; text-align: left; padding: 0 16px; }
  .drawer { position: absolute; inset: 56px auto 56px 0; width: min(280px, 86%); background: #fff; z-index: 2; padding: 8px 0; display: none; overflow: auto; }
  .drawer.on { display: block; }
  .drawer button { display: block; width: 100%; min-height: 48px; text-align: left; padding: 0 16px; border: 0; background: transparent; }
</style>
</head>
<body>
<div class="phone">
  <div class="bar">
    <button id="menuBtn" type="button">選單</button>
    <input id="name" class="name" value="未有檔" aria-label="檔名" />
    <button id="mode" class="switch" type="button">改</button>
  </div>
  <div class="menu" id="menu">
    <button id="upload" type="button">上傳</button>
    <button id="download" type="button">下載</button>
    <button id="toc" type="button">目錄</button>
  </div>
  <div class="stage" id="view"><p class="muted">未有檔。去選單上傳。</p></div>
  <div class="foot">
    <button id="layout" type="button">單頁</button>
    <button id="zoom" type="button">適闊</button>
    <div class="muted" id="pos" style="padding:0">0</div>
  </div>
  <aside class="drawer" id="drawer"></aside>
</div>
<input id="file" type="file" accept="application/pdf,image/jpeg,image/png" hidden />
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let bytes = null, order = [], continuous = true, fit = true, edit = false, current = 0, outlines = [], gen = 0;
const view = document.getElementById("view");
const menu = document.getElementById("menu");
const drawer = document.getElementById("drawer");
function closeMenus() { menu.classList.remove("on"); drawer.classList.remove("on"); }
function setStatus(text) {
  view.innerHTML = "";
  const p = document.createElement("p");
  p.className = "muted";
  p.textContent = text;
  view.appendChild(p);
  document.getElementById("pos").textContent = order.length ? (current + 1) + " / " + order.length : "0";
}
async function loadBytes(next, title) {
  bytes = next;
  const doc = await PDFLib.PDFDocument.load(bytes);
  order = doc.getPageIndices();
  current = 0;
  if (title) document.getElementById("name").value = title.replace(/\.pdf$/i, "");
  outlines = [];
  try {
    const pdf = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
    outlines = (await pdf.getOutline()) || [];
  } catch (e) { outlines = []; }
  await paint();
}
async function mutate(fn) {
  if (!bytes) return;
  const doc = await PDFLib.PDFDocument.load(bytes);
  await fn(doc);
  if (doc.getPageCount() === 0) { bytes = null; order = []; setStatus("未有頁。"); return; }
  bytes = await doc.save();
  order = Array.from({ length: doc.getPageCount() }, (_, i) => i);
  current = Math.max(0, Math.min(current, order.length - 1));
  await paint();
}
async function paint() {
  const id = ++gen;
  document.getElementById("mode").textContent = edit ? "睇" : "改";
  document.getElementById("layout").textContent = continuous ? "單頁" : "連續";
  document.getElementById("zoom").textContent = fit ? "適闊" : "適頁";
  document.getElementById("pos").textContent = order.length ? (current + 1) + " / " + order.length : "0";
  if (!bytes || !order.length) { setStatus("未有檔。去選單上傳。"); return; }
  view.innerHTML = "";
  const pdf = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
  if (id !== gen) return;
  const list = continuous ? order.map((_, i) => i) : [current];
  for (const i of list) {
    if (id !== gen) return;
    const page = await pdf.getPage(i + 1);
    const base = page.getViewport({ scale: 1 });
    const boxW = Math.max(120, view.clientWidth - 24);
    const boxH = Math.max(200, view.clientHeight - 24);
    const scale = fit ? Math.min(boxW / base.width, boxH / base.height) : boxW / base.width;
    const viewport = page.getViewport({ scale: Math.min(scale, 2) });
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    const el = document.createElement("article");
    el.className = "page " + (fit ? "sheet" : "wide") + (edit && i === current ? " on" : "");
    el.appendChild(canvas);
    el.onclick = () => { current = i; if (edit) paint(); };
    if (edit && i === current) {
      const bar = document.createElement("div");
      bar.className = "onpage";
      [["left","左轉"],["right","右轉"],["del","刪除"],["up","前移"],["down","後移"],["blank","空白頁"]].forEach(([act, label]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.onclick = (event) => { event.stopPropagation(); actOn(act); };
        bar.appendChild(b);
      });
      el.appendChild(bar);
    }
    view.appendChild(el);
  }
}
async function actOn(act) {
  if (act === "left" || act === "right") {
    await mutate((doc) => {
      const page = doc.getPage(current);
      const next = (page.getRotation().angle + (act === "left" ? -90 : 90) + 360) % 360;
      page.setRotation(PDFLib.degrees(next));
    });
  }
  if (act === "del") await mutate((doc) => doc.removePage(current));
  if (act === "blank") await mutate((doc) => doc.insertPage(current + 1, [595.28, 841.89]));
  if (act === "up" && current > 0) await move(-1);
  if (act === "down" && current < order.length - 1) await move(1);
}
async function move(dir) {
  const next = current + dir;
  await mutate(async (doc) => {
    const src = await PDFLib.PDFDocument.load(bytes);
    const pages = await doc.copyPages(src, src.getPageIndices());
    while (doc.getPageCount()) doc.removePage(0);
    const seq = src.getPageIndices();
    const [item] = seq.splice(current, 1);
    seq.splice(next, 0, item);
    seq.forEach((n) => doc.addPage(pages[n]));
  });
  current = next;
  await paint();
}
document.getElementById("menuBtn").onclick = (event) => {
  event.stopPropagation();
  drawer.classList.remove("on");
  menu.classList.toggle("on");
};
document.getElementById("upload").onclick = () => { closeMenus(); document.getElementById("file").click(); };
document.getElementById("file").onchange = async () => {
  const file = document.getElementById("file").files[0];
  document.getElementById("file").value = "";
  if (!file) return;
  setStatus("讀緊…");
  try {
    const raw = new Uint8Array(await file.arrayBuffer());
    if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
      await loadBytes(raw, file.name);
      return;
    }
    const doc = bytes ? await PDFLib.PDFDocument.load(bytes) : await PDFLib.PDFDocument.create();
    const img = /png$/i.test(file.name) ? await doc.embedPng(raw) : await doc.embedJpg(raw);
    const page = doc.addPage([595.28, 841.89]);
    const margin = 28;
    const s = Math.min((page.getWidth() - margin * 2) / img.width, (page.getHeight() - margin * 2) / img.height);
    const w = img.width * s, h = img.height * s;
    page.drawImage(img, { x: (page.getWidth() - w) / 2, y: (page.getHeight() - h) / 2, width: w, height: h });
    const title = bytes ? document.getElementById("name").value : file.name.replace(/\.(jpe?g|png)$/i, "");
    await loadBytes(await doc.save(), title);
  } catch (error) {
    const message = String(error && error.message || "");
    setStatus(/password|encrypt/i.test(message) ? "呢份有密碼，開唔到。" : "讀唔到呢份檔。");
  }
};
document.getElementById("download").onclick = () => {
  closeMenus();
  if (!bytes) { setStatus("未有檔。去選單上傳。"); return; }
  const blob = new Blob([bytes], { type: "application/pdf" });
  const a = document.createElement("a");
  const title = document.getElementById("name").value.trim() || "未命名";
  a.href = URL.createObjectURL(blob);
  a.download = title.toLowerCase().endsWith(".pdf") ? title : title + ".pdf";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("toc").onclick = () => {
  menu.classList.remove("on");
  drawer.innerHTML = "";
  const title = document.createElement("strong");
  title.textContent = "目錄";
  title.style.display = "block";
  title.style.padding = "12px 16px";
  drawer.appendChild(title);
  if (!outlines.length) {
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "呢份冇目錄。";
    drawer.appendChild(p);
  } else {
    outlines.forEach((item) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = item.title || "未命名";
      drawer.appendChild(b);
    });
  }
  drawer.classList.add("on");
};
document.getElementById("mode").onclick = () => { edit = !edit; closeMenus(); paint(); };
document.getElementById("layout").onclick = () => { continuous = !continuous; paint(); };
document.getElementById("zoom").onclick = () => { fit = !fit; paint(); };
document.body.addEventListener("click", (event) => {
  if (!menu.contains(event.target) && event.target.id !== "menuBtn") menu.classList.remove("on");
});
</script>
</body>
</html>
