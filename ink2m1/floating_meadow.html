<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Floating Meadow</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060f; font-family:'Georgia', serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  /* Title */
  .title-wrap { position:fixed; top:18px; left:50%; transform:translateX(-50%); text-align:center; z-index:10; pointer-events:none; }
  .title-kicker { font-size:9px; letter-spacing:4px; color:#b9a77a; text-transform:uppercase; opacity:.85; }
  .title-main { font-size:26px; color:#f2ead8; letter-spacing:2px; margin:6px 0 4px; font-weight:400; text-shadow:0 2px 14px rgba(0,0,0,.6); }
  .title-sub { font-size:9px; letter-spacing:3px; color:#c8c2ae; border:1px solid rgba(200,190,160,.35); padding:3px 10px; border-radius:2px; display:inline-block; }
  .title-sub span { color:#e8c877; }
  /* Controls panel */
  .panel { position:fixed; left:14px; bottom:14px; z-index:10; background:rgba(10,12,24,.72); border:1px solid rgba(200,190,150,.22); border-radius:8px; padding:12px 14px; width:210px; backdrop-filter:blur(6px); }
  .panel h2 { font-size:11px; letter-spacing:3px; color:#d8c89a; font-weight:400; text-align:center; border-bottom:1px solid rgba(200,190,150,.2); padding-bottom:7px; margin-bottom:10px; }
  .row { margin:9px 0; }
  .row label { display:flex; justify-content:space-between; font-size:8px; letter-spacing:2px; color:#a99f85; text-transform:uppercase; margin-bottom:4px; }
  .row label span { color:#e8c877; letter-spacing:1px; }
  input[type=range] { width:100%; -webkit-appearance:none; height:3px; background:rgba(200,190,150,.35); border-radius:2px; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#e8c877; border:2px solid #3a3320; cursor:pointer; }
  input[type=range]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#e8c877; border:2px solid #3a3320; cursor:pointer; }
  .qual-row { display:flex; gap:6px; margin-top:10px; }
  .qual-row button { flex:1; background:rgba(200,190,150,.12); border:1px solid rgba(200,190,150,.3); color:#cfc4a4; font-size:8px; letter-spacing:2px; padding:5px 0; border-radius:4px; cursor:pointer; font-family:'Georgia',serif; }
  .qual-row button.active { background:rgba(232,200,119,.2); border-color:#e8c877; color:#e8c877; }
  .hint { margin-top:9px; font-size:8px; color:#7d7460; letter-spacing:1px; text-align:center; }
  /* Credits */
  .credits { position:fixed; right:18px; bottom:16px; z-index:10; text-align:right; color:#e6e2d4; pointer-events:none; }
  .credits .l1 { font-size:13px; letter-spacing:1px; }
  .credits .l2 { font-size:11px; color:#b5b0a0; margin-top:2px; }
  .credits .l3 { font-size:7px; letter-spacing:2px; color:#6b6350; margin-top:6px; text-transform:uppercase; }
</style>
</head>
<body>
<div id="app"></div>

<div class="title-wrap">
  <div class="title-kicker">A Quiet Corner of the Sky</div>
  <div class="title-main">The Floating Meadow</div>
  <div class="title-sub"><span id="timeLabel">22:10</span> &nbsp;·&nbsp; NIGHT</div>
</div>

<div class="panel">
  <h2>— ISLAND CONTROLS —</h2>
  <div class="row">
    <label>Time <span id="timeVal">22:10</span></label>
    <input type="range" id="timeSlider" min="0" max="14" value="10">
  </div>
  <div class="row">
    <label>Wind <span id="windVal">0.60</span></label>
    <input type="range" id="windSlider" min="0" max="100" value="60">
  </div>
  <div class="row">
    <label>Quality</label>
    <div class="qual-row">
      <button id="qLow">LOW</button>
      <button id="qHigh" class="active">HIGH</button>
    </div>
  </div>
  <div class="hint">DRAG TO ORBIT · SCROLL TO ZOOM</div>
</div>

<div class="credits">
  <div class="l1">X@ItsmeAjayKV</div>
  <div class="l2">Inkling-2-mini-UD-Q4_K_XL</div>
  <div class="l3">Terrace &amp; Windmill · Liverin Dreamkaa</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a1a);
scene.fog = new THREE.Fog(0x070a1a, 26, 60);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 200);
camera.position.set(9.5, 6.5, 11.5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 1.6, 0);
controls.minDistance = 6;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.62;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

// Lights
const ambient = new THREE.AmbientLight(0x8890b8, 0.55);
scene.add(ambient);
const moon = new THREE.DirectionalLight(0xdde4ff, 1.5);
moon.position.set(-8, 12, 6);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -12; moon.shadow.camera.right = 12;
moon.shadow.camera.top = 12; moon.shadow.camera.bottom = -12;
moon.shadow.camera.far = 40;
scene.add(moon);
const warmLight = new THREE.PointLight(0xffc46b, 2.4, 8);
warmLight.position.set(0, 3.4, 0.1);
scene.add(warmLight);

// Stars
function makeStars(count, size, color) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const phase = new Float32Array(count);
  for (let i=0;i<count;i++) {
    const r = 60 + Math.random()*30;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(Math.random()*1.6 - 0.6);
    pos[i*3] = r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1] = r*Math.cos(phi);
    pos[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
    phase[i] = Math.random()*Math.PI*2;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('phase', new THREE.BufferAttribute(phase,1));
  const mat = new THREE.PointsMaterial({ size, color, transparent:true, opacity:0.9, depthWrite:false, sizeAttenuation:true });
  const pts = new THREE.Points(geo, mat);
  pts.userData.phase = phase;
  return pts;
}
const stars = makeStars(500, 0.35, 0xffffff);
scene.add(stars);
const starGlow = makeStars(40, 1.1, 0xd9d4b8);
scene.add(starGlow);

// Moon glow
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(2.4, 32, 32), new THREE.MeshBasicMaterial({ color:0xf4f1e2 }));
moonMesh.position.set(-22, 14, -16);
scene.add(moonMesh);
const moonHalo = new THREE.Mesh(new THREE.SphereGeometry(3.6, 32, 32), new THREE.MeshBasicMaterial({ color:0xd8dcae, transparent:true, opacity:0.12, depthWrite:false }));
moonMesh.add(moonHalo);

const island = new THREE.Group();
scene.add(island);

// Rock base
const rockMat = new THREE.MeshStandardMaterial({ color:0x4a3f33, roughness:0.95, flatShading:true });
const rock = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 1.6, 3.4, 9, 3), rockMat);
rock.position.y = -1.9;
rock.castShadow = rock.receiveShadow = true;
island.add(rock);
// rocky irregularity
const rockBumps = new THREE.Group();
rockBumps.position.y = -2.6;
for (let i=0;i<14;i++) {
  const b = new THREE.Mesh(new THREE.DodecahedronGeometry(0.25 + Math.random()*0.45, 0), rockMat);
  const a = Math.random()*Math.PI*2;
  const r = 1.2 + Math.random()*1.8;
  b.position.set(Math.cos(a)*r, -Math.random()*1.4, Math.sin(a)*r);
  b.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
  rockBumps.add(b);
}
island.add(rockBumps);

// Grass cap
const cap = new THREE.Mesh(new THREE.CylinderGeometry(4.7, 4.55, 0.5, 24), new THREE.MeshStandardMaterial({ color:0x2c3a22, roughness:1 }));
cap.position.y = 0.25;
cap.receiveShadow = true;
island.add(cap);
const grassTop = new THREE.Mesh(new THREE.CircleGeometry(4.7, 24), new THREE.MeshStandardMaterial({ color:0x5a9e3f, roughness:0.9 }));
grassTop.rotation.x = -Math.PI/2;
grassTop.position.y = 0.51;
grassTop.receiveShadow = true;
island.add(grassTop);

// Grass blades (instanced, wind-swayed via shader)
const bladeGeo = new THREE.ConeGeometry(0.06, 0.55, 4);
bladeGeo.translate(0, 0.275, 0);
const bladeMat = new THREE.MeshStandardMaterial({ color:0x6fc04a, roughness:0.9, flatShading:true });
const BLADES = 700;
const blades = new THREE.InstancedMesh(bladeGeo, bladeMat, BLADES);
blades.castShadow = false; blades.receiveShadow = true;
blades.frustumCulled = false;
const dummy = new THREE.Object3D();
const bladePhases = new Float32Array(BLADES);
for (let i=0;i<BLADES;i++) {
  const r = Math.sqrt(Math.random()) * 4.35;
  const a = Math.random()*Math.PI*2;
  const x = Math.cos(a)*r, z = Math.sin(a)*r;
  // avoid pond area (front-right)
  if (x > 0.6 && z > 0.4 && r < 2.6) { i--; continue; }
  dummy.position.set(x, 0.51, z);
  dummy.rotation.y = Math.random()*Math.PI*2;
  dummy.rotation.x = (Math.random()-0.5)*0.35;
  dummy.scale.set(0.8 + Math.random()*0.5, 0.7 + Math.random()*0.9, 0.8);
  dummy.updateMatrix();
  blades.setMatrixAt(i, dummy.matrix);
  bladePhases[i] = Math.random()*Math.PI*2;
}
island.add(blades);
blades.userData.phase = bladePhases;
let windUniform = { value: 0.6 };
bladeMat.onBeforeCompile = (sh) => {
  sh.uniforms.uTime = { value: 0 };
  sh.uniforms.uWind = windUniform;
  sh.uniforms.uPhase = { value: blades.userData.phase };
  sh.vertexShader = 'uniform float uTime; uniform float uWind; uniform float uPhase;\n' + sh.vertexShader;
  // can't index uniform array easily in lambert; use instance matrix position instead
  sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>',
    `#include <begin_vertex>
     float ph = instanceMatrix[3][0]*7.0 + instanceMatrix[3][2]*5.0;
     float sway = sin(uTime*2.2 + ph) * 0.18 * uWind;
     transformed.x += sway * position.y * 2.0;
     transformed.z += sway * 0.6 * position.y * 2.0;`);
  sh.uniforms.uTimeRef = sh.uniforms.uTime;
  island.userData.bladeShader = sh;
};

// Pond
const pond = new THREE.Mesh(new THREE.CircleGeometry(1.15, 24), new THREE.MeshStandardMaterial({ color:0x9fd8e8, roughness:0.15, metalness:0.3, transparent:true, opacity:0.85 }));
pond.rotation.x = -Math.PI/2;
pond.position.set(1.55, 0.52, 1.35);
pond.scale.x = 1.25;
island.add(pond);
for (let i=0;i<4;i++) {
  const pad = new THREE.Mesh(new THREE.CircleGeometry(0.16 + Math.random()*0.12, 8), new THREE.MeshStandardMaterial({ color:0x3f7a35, roughness:0.9 }));
  pad.rotation.x = -Math.PI/2;
  const a = Math.random()*Math.PI*2, r = Math.random()*0.85;
  pad.position.set(1.55 + Math.cos(a)*r, 0.535, 1.35 + Math.sin(a)*r*0.8);
  island.add(pad);
}
const lily = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), new THREE.MeshStandardMaterial({ color:0xff9ec4 }));
lily.position.set(1.35, 0.56, 1.3);
island.add(lily);

// Fence
const woodMat = new THREE.MeshStandardMaterial({ color:0x6b4a2e, roughness:0.9 });
function addFence(x, z, rot, segments) {
  const g = new THREE.Group();
  for (let i=0;i<segments;i++) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.55, 6), woodMat);
    post.position.set(i*0.55, 0.28, 0);
    post.castShadow = true;
    g.add(post);
  }
  const rail1 = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, segments*0.55, 6), woodMat);
  rail1.rotation.z = Math.PI/2;
  rail1.position.set((segments-1)*0.275, 0.38, 0);
  g.add(rail1);
  const rail2 = rail1.clone(); rail2.position.y = 0.2;
  g.add(rail2);
  g.position.set(x, 0.51, z);
  g.rotation.y = rot;
  island.add(g);
}
addFence(-2.6, 1.7, 0.5, 3);
addFence(0.6, -2.6, -0.3, 3);

// Trees
function makeTree(x, z, scale, layers=3) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18*scale, 0.24*scale, 0.7*scale, 6), woodMat);
  trunk.position.y = 0.35*scale; trunk.castShadow = true;
  g.add(trunk);
  const leafMat = new THREE.MeshStandardMaterial({ color:0x2e6b2f, roughness:0.9, flatShading:true });
  for (let i=0;i<layers;i++) {
    const cone = new THREE.Mesh(new THREE.ConeGeometry((1.1 - i*0.28)*scale, 0.95*scale, 7), leafMat);
    cone.position.y = (0.85 + i*0.62)*scale;
    cone.castShadow = true;
    g.add(cone);
  }
  g.position.set(x, 0.51, z);
  g.rotation.y = Math.random()*Math.PI*2;
  island.add(g);
  return g;
}
makeTree(-1.7, -2.4, 1.35, 3);
makeTree(2.9, -2.1, 1.15, 3);
makeTree(-3.3, 0.5, 0.95, 3);
const roundTree = new THREE.Group();
const rtTrunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.9, 6), woodMat);
rtTrunk.position.y = 0.45; rtTrunk.castShadow = true; roundTree.add(rtTrunk);
const rtLeaf = new THREE.Mesh(new THREE.SphereGeometry(0.85, 10, 8), new THREE.MeshStandardMaterial({ color:0x3f8a3a, roughness:0.9, flatShading:true }));
rtLeaf.position.y = 1.35; rtLeaf.castShadow = true; roundTree.add(rtLeaf);
roundTree.position.set(-2.7, 0.51, -1.6);
island.add(roundTree);

// Cottage
const cottage = new THREE.Group();
const wallMat = new THREE.MeshStandardMaterial({ color:0x8a5a33, roughness:0.85, flatShading:true });
const body = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.15, 1.35), wallMat);
body.position.y = 0.575; body.castShadow = body.receiveShadow = true;
cottage.add(body);
const roof = new THREE.Mesh(new THREE.ConeGeometry(1.45, 0.95, 4), new THREE.MeshStandardMaterial({ color:0x9a3b2a, roughness:0.8, flatShading:true }));
roof.position.y = 1.6; roof.rotation.y = Math.PI/4; roof.castShadow = true;
cottage.add(roof);
const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.65, 0.22), new THREE.MeshStandardMaterial({ color:0x7a5a40, roughness:0.9 }));
chimney.position.set(0.45, 1.95, 0.2); chimney.castShadow = true;
cottage.add(chimney);
const winMat = new THREE.MeshStandardMaterial({ color:0xffd977, emissive:0xffb347, emissiveIntensity:1.6 });
const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.34, 0.04), winMat);
win1.position.set(-0.38, 0.62, 0.686); cottage.add(win1);
const door = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.7, 0.05), new THREE.MeshStandardMaterial({ color:0x3d2415, roughness:0.8 }));
door.position.set(0.42, 0.35, 0.686); cottage.add(door);
const win2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.04), winMat);
win2.position.set(0, 0.62, -0.686); cottage.add(win2);
cottage.position.set(-1.6, 0.51, -0.85);
cottage.rotation.y = 0.45;
island.add(cottage);

// Windmill
const windmill = new THREE.Group();
const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.62, 2.1, 8), new THREE.MeshStandardMaterial({ color:0xdfd7c4, roughness:0.85, flatShading:true }));
tower.position.y = 1.05; tower.castShadow = true;
windmill.add(tower);
const capCone = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.55, 8), new THREE.MeshStandardMaterial({ color:0x9a3b2a, roughness:0.8 }));
capCone.position.y = 2.35; capCone.castShadow = true;
windmill.add(capCone);
const hub = new THREE.Group();
hub.position.set(0, 1.85, 0.5);
const bladesGroup = new THREE.Group();
const bladeMatW = new THREE.MeshStandardMaterial({ color:0xece4d0, roughness:0.7, side:THREE.DoubleSide });
for (let i=0;i<4;i++) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.55, 0.04), bladeMatW);
  b.position.y = 0.85;
  const pivot = new THREE.Group();
  pivot.rotation.z = i*Math.PI/2 + 0.2;
  pivot.add(b);
  bladesGroup.add(pivot);
}
hub.add(bladesGroup);
windmill.add(hub);
const hubCap = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 10), new THREE.MeshStandardMaterial({ color:0x6b4a2e }));
hubCap.position.set(0, 1.85, 0.55);
windmill.add(hubCap);
windmill.position.set(1.5, 0.51, -2.3);
windmill.rotation.y = -0.5;
island.add(windmill);

// Rocks
const rockSmallMat = new THREE.MeshStandardMaterial({ color:0x777777, roughness:1, flatShading:true });
[[-0.4, -1.4, 0.22],[2.3, 2.2, 0.18],[-3.2, 1.9, 0.28],[0.9, 1.9, 0.14],[3.4, 0.2, 0.2]].forEach(([x,z,s])=>{
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockSmallMat);
  r.position.set(x, 0.55 + s*0.4, z);
  r.rotation.set(Math.random()*3, Math.random()*3, 0);
  r.castShadow = true;
  island.add(r);
});

// Rabbit
const rabbit = new THREE.Group();
const rabbitMat = new THREE.MeshStandardMaterial({ color:0xf2efe6, roughness:0.9 });
const rBody = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10), rabbitMat);
rBody.scale.set(1.15, 0.95, 1.25); rBody.position.y = 0.3; rBody.castShadow = true;
rabbit.add(rBody);
const rHead = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), rabbitMat);
rHead.position.set(0, 0.62, 0.28); rHead.castShadow = true;
rabbit.add(rHead);
const earMat = rabbitMat;
[-1,1].forEach(s=>{
  const ear = new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.4, 4, 8), earMat);
  ear.position.set(s*0.11, 0.98, 0.22);
  ear.rotation.z = s*-0.28;
  rabbit.add(ear);
});
const tail = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), new THREE.MeshStandardMaterial({ color:0xffffff }));
tail.position.set(0, 0.38, -0.42);
rabbit.add(tail);
rabbit.position.set(0.2, 0.51, 2.5);
rabbit.rotation.y = 0.4;
island.add(rabbit);

// Floating satellite rocks
const satellites = [];
for (let i=0;i<7;i++) {
  const s = new THREE.Mesh(new THREE.DodecahedronGeometry(0.18 + Math.random()*0.4, 0), rockMat);
  const a = Math.random()*Math.PI*2;
  const r = 4.6 + Math.random()*2.2;
  s.position.set(Math.cos(a)*r, -0.8 - Math.random()*3.2, Math.sin(a)*r);
  s.castShadow = true;
  s.userData = { baseY:s.position.y, phase:Math.random()*Math.PI*2, speed:0.4+Math.random()*0.6 };
  satellites.push(s);
  island.add(s);
}

// Fireflies
const flyGeo = new THREE.BufferGeometry();
const flyCount = 26;
const flyPos = new Float32Array(flyCount*3);
const flyPhase = new Float32Array(flyCount);
for (let i=0;i<flyCount;i++) {
  const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*5.2;
  flyPos[i*3] = Math.cos(a)*r;
  flyPos[i*3+1] = 1.2 + Math.random()*2.4;
  flyPos[i*3+2] = Math.sin(a)*r;
  flyPhase[i] = Math.random()*Math.PI*2;
}
flyGeo.setAttribute('position', new THREE.BufferAttribute(flyPos,3));
const flyMat = new THREE.PointsMaterial({ color:0xffe9a0, size:0.14, transparent:true, opacity:0.9, depthWrite:false, blending:THREE.AdditiveBlending });
const fireflies = new THREE.Points(flyGeo, flyMat);
island.add(fireflies);

// Clouds (soft sprites)
const clouds = [];
for (let i=0;i<4;i++) {
  const c = new THREE.Group();
  for (let j=0;j<5;j++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.5+Math.random()*0.6, 7), new THREE.MeshBasicMaterial({ color:0x8f97c8, transparent:true, opacity:0.22, depthWrite:false }));
    m.position.set((Math.random()-0.5)*1.6, (Math.random()-0.5)*0.4, (Math.random()-0.5)*0.8);
    c.add(m);
  }
  c.position.set((Math.random()-0.5)*30, 2 + Math.random()*6, -14 - Math.random()*12);
  scene.add(c);
  clouds.push(c);
}

// UI wiring
let wind = 0.6;
const windSlider = document.getElementById('windSlider');
const timeSlider = document.getElementById('timeSlider');
const timeVal = document.getElementById('timeVal');
const windVal = document.getElementById('windVal');
const timeLabel = document.getElementById('timeLabel');

windSlider.addEventListener('input', () => {
  wind = windSlider.value/100;
  windUniform.value = wind;
  windVal.textContent = wind.toFixed(2);
});
timeSlider.addEventListener('input', () => {
  const h = 20 + Math.floor(timeSlider.value/2);
  const m = (timeSlider.value%2)*30;
  const str = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  timeVal.textContent = str;
  timeLabel.textContent = str;
});

document.getElementById('qHigh').addEventListener('click', () => {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  blades.count = BLADES;
  document.getElementById('qHigh').classList.add('active');
  document.getElementById('qLow').classList.remove('active');
});
document.getElementById('qLow').addEventListener('click', () => {
  renderer.setPixelRatio(1);
  blades.count = 350;
  document.getElementById('qLow').classList.add('active');
  document.getElementById('qHigh').classList.remove('active');
});

// Animation
const clock = new THREE.Clock();
let bladesShaderRef = null;
const origOnBeforeCompile = bladeMat.onBeforeCompile;
bladeMat.onBeforeCompile = (sh) => {
  origOnBeforeCompile(sh);
  bladesShaderRef = sh;
};

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.05);

  island.position.y = Math.sin(t*0.7)*0.35;
  island.rotation.z = Math.sin(t*0.4)*0.015;
  island.rotation.x = Math.cos(t*0.33)*0.015;

  // windmill
  bladesGroup.rotation.z = t * (0.6 + wind*4);
  hub.rotation.z = t * (0.6 + wind*4) * 0.0;

  // rabbit ear wiggle
  rabbit.rotation.y = 0.4 + Math.sin(t*1.3)*0.12;

  // fireflies drift
  const fp = fireflies.geometry.attributes.position;
  for (let i=0;i<flyCount;i++) {
    fp.array[i*3]   += Math.sin(t*0.9 + flyPhase[i]) * 0.0035;
    fp.array[i*3+1] += Math.cos(t*0.7 + flyPhase[i]*1.7) * 0.003;
    fp.array[i*3+2] += Math.sin(t*0.6 + flyPhase[i]*0.6) * 0.0035;
  }
  fp.needsUpdate = true;
  flyMat.opacity = 0.55 + Math.sin(t*2.4)*0.35;

  // satellites bob
  satellites.forEach(s => {
    s.position.y = s.userData.baseY + Math.sin(t*s.userData.speed + s.userData.phase)*0.45;
    s.rotation.y += 0.002;
  });

  // clouds drift
  clouds.forEach((c,i) => { c.position.x += 0.004 + i*0.001; if (c.position.x > 18) c.position.x = -18; });

  // stars twinkle
  stars.material.opacity = 0.75 + Math.sin(t*1.6)*0.2;
  starGlow.material.opacity = 0.7 + Math.sin(t*1.1 + 1.5)*0.25;

  // blade shader time
  if (bladesShaderRef) bladesShaderRef.uniforms.uTime.value = t;

  // moon pulse
  moonHalo.scale.setScalar(1 + Math.sin(t*1.2)*0.06);

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
