<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Design — Inkling 2 Mini</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#0b0f1a; font-family: Georgia, 'Times New Roman', serif; overflow:hidden; }
  #page { display:flex; flex-direction:column; height:100%; }
  header {
    background:#f4efe6; color:#2b2b2b; padding:18px 28px 10px;
    display:flex; justify-content:space-between; align-items:flex-end; gap:20px;
    border-bottom:1px solid #d8d2c4;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .box-icon { width:34px; height:34px; border:2px solid #3f7f8f; border-radius:6px; position:relative; }
  .box-icon::after { content:""; position:absolute; left:5px; right:5px; top:50%; height:2px; background:#3f7f8f; }
  .brand h1 { font-size:34px; font-weight:600; letter-spacing:1px; color:#7aa8a8; font-family:'Segoe UI', Helvetica, Arial, sans-serif; font-weight:300;}
  .arena { text-align:right; color:#222; }
  .arena .crown { font-size:26px; letter-spacing:2px; }
  .arena .name { font-size:30px; font-weight:700; letter-spacing:1px; font-family:'Georgia', serif; }
  .arena .by { font-size:13px; color:#666; font-style:italic; }
  .subhead { background:#fbf8f2; padding:10px 28px; display:flex; justify-content:center; border-bottom:1px solid #e5dfd2;}
  .subhead .info { text-align:center; }
  .subhead small, .subhead .label { display:block; font-size:11px; letter-spacing:2px; color:#555; font-family:'Segoe UI',sans-serif; text-transform:uppercase;}
  .subhead h2 { font-size:22px; font-family:'Segoe UI',sans-serif; font-weight:700; color:#1c1c1c; margin:4px 0 2px;}
  .subhead .price { font-size:15px; font-family:'Segoe UI',sans-serif; font-weight:600; color:#333;}
  #stage { position:relative; flex:1; min-height:0; }
  canvas { display:block; width:100%; height:100%; }
  #caption { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); color:#fff; font-size:14px; letter-spacing:2px; text-transform:uppercase; font-family:'Segoe UI',sans-serif; text-shadow:0 2px 8px #000; opacity:.85; pointer-events:none; text-align:center;}
  #hint { position:absolute; top:14px; right:16px; color:#cfd6e6; font-size:12px; font-family:'Segoe UI',sans-serif; background:rgba(10,14,26,.55); padding:8px 12px; border:1px solid rgba(255,255,255,.14); border-radius:8px; letter-spacing:1px; pointer-events:none;}
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="page">
  <header>
    <div class="brand"><div class="box-icon"></div><h1>3D Design</h1></div>
    <div class="arena">
      <div class="crown">❦❦&nbsp;DesignArena <span class="by">by Intelligence</span></div>
    </div>
  </header>
  <div class="subhead">
    <div class="info">
      <small>Thinking Machines</small>
      <h2>Inkling 2 Mini</h2>
      <div class="price">$0.028 &nbsp;·&nbsp; 3m 12s</div>
    </div>
  </div>
  <div id="stage">
    <canvas id="scene"></canvas>
    <div id="hint">Drag to orbit · Scroll to zoom</div>
    <div id="caption">Cosmic Spiral River — Inkling 2 Mini</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a18);
scene.fog = new THREE.FogExp2(0x060a18, 0.012);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);
camera.position.set(0, 7, 34);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 12;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.62;

// ---- deep space starfield
const starCount = 2600;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(starCount * 3);
for (let i=0;i<starCount;i++){
  const r = 120 + Math.random()*160;
  const theta = Math.random()*Math.PI*2;
  const phi = Math.acos(2*Math.random()-1);
  starPos[i*3]   = r*Math.sin(phi)*Math.cos(theta);
  starPos[i*3+1] = (Math.random()-0.5)*90;
  starPos[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xbfd0ff, size:0.55, sizeAttenuation:true, transparent:true, opacity:0.9, depthWrite:false }));
scene.add(stars);

// ---- spiral galaxy (painterly swirl)
const swirlGroup = new THREE.Group();
scene.add(swirlGroup);

const swirlCount = 1400;
const swirlGeo = new THREE.BufferGeometry();
const swirlPos = new Float32Array(swirlCount*3);
const swirlCol = new Float32Array(swirlCount*3);
const swirlRad = new Float32Array(swirlCount);
const palette = [ new THREE.Color(0xffe9b0), new THREE.Color(0x9fd0ff), new THREE.Color(0x7fa8ff), new THREE.Color(0xffffff) ];
for (let i=0;i<swirlCount;i++){
  const arm = i % 3;
  const t = Math.pow(Math.random(), 1.6);          // 0 center -> 1 rim
  const radius = t * 11 + 0.4;
  const angle = arm * (Math.PI*2/3) + t*5.2 + (Math.random()-0.5)*0.45;
  const x = Math.cos(angle)*radius;
  const z = Math.sin(angle)*radius;
  const y = (Math.random()-0.5)*0.55 + Math.sin(angle*2.0)*0.35*t;
  swirlPos[i*3] = x; swirlPos[i*3+1] = y; swirlPos[i*3+2] = z;
  const c = palette[Math.floor(Math.random()*palette.length)];
  const dim = 0.35 + 0.65*(1-t);
  swirlCol[i*3] = c.r*dim; swirlCol[i*3+1] = c.g*dim; swirlCol[i*3+2] = c.b*dim;
  swirlRad[i] = radius;
}
swirlGeo.setAttribute('position', new THREE.BufferAttribute(swirlPos,3));
swirlGeo.setAttribute('color', new THREE.BufferAttribute(swirlCol,3));
const swirlMat = new THREE.PointsMaterial({ size:0.42, vertexColors:true, transparent:true, opacity:0.95, depthWrite:false, blending:THREE.AdditiveBlending });
const swirl = new THREE.Points(swirlGeo, swirlMat);
swirlGroup.add(swirl);

// glowing core
const core = new THREE.Mesh(
  new THREE.SphereGeometry(1.7, 32, 32),
  new THREE.MeshBasicMaterial({ color:0xfff3d0, transparent:true, opacity:0.9 })
);
swirlGroup.add(core);
const coreGlow = new THREE.Mesh(
  new THREE.SphereGeometry(2.6, 32, 32),
  new THREE.MeshBasicMaterial({ color:0xffdf9e, transparent:true, opacity:0.22, blending:THREE.AdditiveBlending, depthWrite:false })
);
swirlGroup.add(coreGlow);

// drifting particles (dust motes)
const dustCount = 260;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount*3);
const dustSeed = new Float32Array(dustCount);
for (let i=0;i<dustCount;i++){
  dustPos[i*3] = (Math.random()-0.5)*26;
  dustPos[i*3+1] = (Math.random()-0.5)*14;
  dustPos[i*3+2] = (Math.random()-0.5)*26;
  dustSeed[i] = Math.random()*Math.PI*2;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos,3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color:0x9fd4ff, size:0.18, transparent:true, opacity:0.8, depthWrite:false, blending:THREE.AdditiveBlending }));
scene.add(dust);

// ---- lighting / cinematic
const hemi = new THREE.HemisphereLight(0x2a3a6a, 0x05070f, 0.7);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffe2b0, 1.6);
key.position.set(8, 12, 10);
scene.add(key);
const rim = new THREE.PointLight(0x5aa0ff, 60, 80);
rim.position.set(-10, 6, -8);
scene.add(rim);

// ---- vignette overlay
const vignette = document.createElement('div');
vignette.style.cssText = 'position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px rgba(0,0,0,.85);';
document.getElementById('stage').appendChild(vignette);

function resize(){
  const w = document.getElementById('stage').clientWidth;
  const h = document.getElementById('stage').clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
let t = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  t += dt;

  swirlGroup.rotation.y = t * 0.18;
  coreGlow.material.opacity = 0.18 + Math.sin(t*2.0)*0.08;
  core.scale.setScalar(1 + Math.sin(t*2.4)*0.05);

  // drift dust
  const p = dustGeo.attributes.position.array;
  for (let i=0;i<dustCount;i++){
    p[i*3+1] += Math.sin(t*0.6 + dustSeed[i]) * 0.004;
    p[i*3]   += Math.cos(t*0.4 + dustSeed[i]) * 0.003;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dust.rotation.y = t * 0.03;

  stars.rotation.y = t * 0.008;

  // gentle camera breathing (unless user interacting)
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
