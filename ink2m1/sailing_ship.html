<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ship — Low-Poly Open Water</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Segoe UI', system-ui, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; z-index:10; pointer-events:none; }
  #brand { top:14px; left:16px; color:#4a3b2a; }
  #brand h1 { font-size:15px; letter-spacing:6px; font-weight:700; }
  #brand p { font-size:7px; letter-spacing:2px; opacity:.6; margin-top:2px; }
  #handle { top:12px; right:16px; }
  #handle span { display:inline-flex; align-items:center; gap:6px; background:rgba(70,55,45,.55); color:#fff; font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px; backdrop-filter:blur(4px); }
  #capbar { bottom:0; left:0; right:0; padding:18px 16px 14px; display:flex; justify-content:center; }
  #cap { pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:8px; }
  #cap .pill { background:rgba(20,22,30,.78); color:#fff; font-size:13px; padding:7px 14px; border-radius:10px; backdrop-filter:blur(6px); }
  #cap .zh { color:#ffe14d; font-size:clamp(18px,3.4vw,30px); font-weight:800; text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.55); letter-spacing:1px; }
  #hint { bottom:16px; left:16px; font-size:11px; color:rgba(50,40,30,.75); letter-spacing:1px; background:rgba(255,255,255,.35); padding:5px 10px; border-radius:8px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="app"></div>
<div class="hud" id="brand"><h1>THE SHIP</h1><p>LOW-POLY OPEN WATER</p></div>
<div class="hud" id="handle"><span>𝕏&nbsp; @loktar00</span></div>
<div class="hud" id="hint">drag to orbit · scroll to zoom · ship idles on the waves</div>
<div class="hud" id="capbar">
  <div id="cap">
    <div class="pill">Inkling 2 Mini (NVFP4) · DeepSeek Harness · 1.6&times; tokens</div>
    <div class="zh">你就能够部署汉献模形</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd8d8c8, 60, 220);

// Sky gradient background (canvas texture)
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 16; skyCanvas.height = 512;
const sc = skyCanvas.getContext('2d');
const grad = sc.createLinearGradient(0,0,0,512);
grad.addColorStop(0,'#f5e6b8'); grad.addColorStop(.35,'#f2d9a0');
grad.addColorStop(.55,'#f0c79a'); grad.addColorStop(.7,'#7d9bb0');
grad.addColorStop(1,'#3a5f86');
sc.fillStyle = grad; sc.fillRect(0,0,16,512);
const skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTex;

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 500);
camera.position.set(10, 7.5, 14);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.target.set(0, 1.6, 0);
controls.minDistance = 6; controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = true; controls.autoRotateSpeed = 0.7;
controls.addEventListener('start', () => controls.autoRotate = false);

// Lights
const hemi = new THREE.HemisphereLight(0xffe9c4, 0x2b4a63, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d0, 1.8);
sun.position.set(-14, 18, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// Sea
const seaGeo = new THREE.PlaneGeometry(300, 300, 56, 56);
seaGeo.rotateX(-Math.PI/2);
const seaMat = new THREE.MeshPhongMaterial({ color:0x2e5878, shininess:90, specular:0x88b7d8, flatShading:true });
const sea = new THREE.Mesh(seaGeo, seaMat);
sea.receiveShadow = true;
scene.add(sea);
const seaPos = seaGeo.attributes.position;
const seaBase = seaPos.array.slice();

// Clouds
function makeCloud(x,y,z,s){
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color:0xffffff, transparent:true, opacity:0.92 });
  const blobs = [[0,0,0,1.6],[1.4,0.2,0.3,1.1],[-1.3,0.1,-0.2,1.2],[0.5,0.5,-0.6,0.9],[-0.6,0.4,0.5,0.85]];
  for (const [bx,by,bz,bs] of blobs){
    const m = new THREE.Mesh(new THREE.SphereGeometry(bs, 7, 6), mat);
    m.position.set(bx,by,bz); m.scale.y = 0.5; g.add(m);
  }
  g.position.set(x,y,z); g.scale.setScalar(s);
  scene.add(g); return g;
}
const clouds = [makeCloud(-24,9,-20,1.5),makeCloud(20,11,-26,1.9),makeCloud(4,8,-34,1.3),makeCloud(-30,10,14,1.2),makeCloud(26,12,10,1.4),makeCloud(-4,10,30,1.1)];

// Sail sun texture
function sunTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#f6efe0'; x.fillRect(0,0,256,256);
  x.strokeStyle = '#c9b98f'; x.lineWidth = 6;
  for (let i=1;i<4;i++){ x.beginPath(); x.moveTo(0,i*64); x.lineTo(256,i*64); x.stroke(); }
  x.fillStyle = '#e8a13a';
  const cx=128, cy=136, r=52;
  for(let i=0;i<12;i++){
    const a = i/12*Math.PI*2;
    x.save(); x.translate(cx+Math.cos(a)*r, cy+Math.sin(a)*r); x.rotate(a);
    x.fillRect(-7,-7,14,20); x.restore();
  }
  x.beginPath(); x.arc(cx,cy,44,0,Math.PI*2); x.fill();
  x.fillStyle = '#f6efe0'; x.beginPath(); x.arc(cx,cy,26,0,Math.PI*2); x.fill();
  x.fillStyle = '#e8a13a'; x.beginPath(); x.arc(cx,cy,10,0,Math.PI*2); x.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const sunTex = sunTexture();

// Flag textures
function flagTexture(colors){
  const c = document.createElement('canvas'); c.width = 128; c.height = 80;
  const x = c.getContext('2d');
  const h = 80/colors.length;
  colors.forEach((col,i)=>{ x.fillStyle = col; x.fillRect(0,i*h,128,h+1); });
  x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(0,0,4,80);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const shipFlag = flagTexture(['#3d7ac4','#f2d12e','#c94f4f']);
const sternFlag = flagTexture(['#1f7a63','#f2d12e','#c94f4f']);
const topFlag = flagTexture(['#e23b3b','#ffffff','#3d7ac4']);

// Ship group
const ship = new THREE.Group();
scene.add(ship);

const hullMat = new THREE.MeshPhongMaterial({ color:0x4a2c1a, shininess:30, flatShading:true });
const trimMat = new THREE.MeshPhongMaterial({ color:0xe5b94e, shininess:60 });
const deckMat = new THREE.MeshPhongMaterial({ color:0x8a6a44, flatShading:true });
const woodDark = new THREE.MeshPhongMaterial({ color:0x582f18, flatShading:true });

// Hull (lathe-ish tapered box via custom shape)
const hullGeo = new THREE.CylinderGeometry(0.0, 1.05, 3.4, 4, 1, false);
// simpler: build hull as extruded shape
const hullShape = new THREE.Shape();
hullShape.moveTo(-2.3, -1.1);
hullShape.quadraticCurveTo(-2.5, 0, -2.0, 0.35);
hullShape.lineTo(2.0, 0.35);
hullShape.quadraticCurveTo(2.5, 0, 2.3, -1.1);
hullShape.quadraticCurveTo(0, -1.7, -2.3, -1.1);
const hullGeo2 = new THREE.ExtrudeGeometry(hullShape, { depth: 2.2, bevelEnabled:true, bevelThickness:0.25, bevelSize:0.25, bevelSegments:2 });
hullGeo2.rotateY(Math.PI/2);
// orient: extrusion along z; rotate so length runs along x
const hull = new THREE.Mesh(new THREE.CapsuleGeometry(1.05, 2.2, 6, 10), hullMat);
hull.scale.set(1.15, 0.72, 0.62);
hull.rotation.z = 0;
hull.position.y = -0.55;
hull.castShadow = true; hull.receiveShadow = true;
ship.add(hull);

// Deck
const deck = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.22, 1.9), deckMat);
deck.position.y = 0.32; deck.castShadow = true; deck.receiveShadow = true;
ship.add(deck);

// Stern/bow rails
const railMat = new THREE.MeshPhongMaterial({ color:0x2e1b10, flatShading:true });
for (let i=-2;i<=2;i++){
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.42,6), railMat);
  post.position.set(i*0.95, 0.62, 0.85); ship.add(post);
  const post2 = post.clone(); post2.position.z = -0.85; ship.add(post2);
}
const rail1 = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,4.4,6), railMat);
rail1.rotation.z = Math.PI/2; rail1.position.set(0,0.84,0.85); ship.add(rail1);
const rail2 = rail1.clone(); rail2.position.z = -0.85; ship.add(rail2);

// Gold trim stripe
const trim = new THREE.Mesh(new THREE.BoxGeometry(4.45, 0.12, 1.95), trimMat);
trim.position.y = 0.22; ship.add(trim);

// Cabins / cargo
const cabin1 = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.85, 1.05), new THREE.MeshPhongMaterial({ color:0x9a7448, flatShading:true }));
cabin1.position.set(-1.35, 0.82, 0); cabin1.castShadow = true; ship.add(cabin1);
const cabin1roof = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.12, 1.25), woodDark);
cabin1roof.position.set(-1.35, 1.28, 0); cabin1roof.castShadow = true; ship.add(cabin1roof);

const cabin2 = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.62, 0.95), new THREE.MeshPhongMaterial({ color:0x7a5a36, flatShading:true }));
cabin2.position.set(1.35, 0.66, 0); cabin2.castShadow = true; ship.add(cabin2);
const cabin2roof = new THREE.Mesh(new THREE.ConeGeometry(0.75, 0.32, 4), woodDark);
cabin2roof.position.set(1.35, 1.18, 0); cabin2roof.rotation.y = Math.PI/4; cabin2roof.castShadow = true; ship.add(cabin2roof);

const crate = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), new THREE.MeshPhongMaterial({ color:0xb9895a, flatShading:true }));
crate.position.set(0.35, 0.62, 0.05); crate.rotation.y = 0.4; crate.castShadow = true; ship.add(crate);
const crateEdges = new THREE.Mesh(new THREE.BoxGeometry(0.52,0.52,0.1), woodDark);
crateEdges.position.copy(crate.position); crateEdges.rotation.copy(crate.rotation); ship.add(crateEdges);

// Masts
const mastMat = new THREE.MeshPhongMaterial({ color:0x2f1c12, flatShading:true });
function mast(x, height){
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.08,height,8), mastMat);
  m.position.y = height/2; m.castShadow = true;
  g.add(m);
  const yard = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.5,8), mastMat);
  yard.rotation.x = Math.PI/2; yard.position.y = height - 0.25; yard.castShadow = true;
  g.add(yard);
  g.position.set(x, 0.42, 0);
  ship.add(g);
  return { group:g, height };
}
const mainMast = mast(-0.15, 3.9);
const sternMast = mast(1.55, 3.1);

// Sails (curved planes)
function sail(texture, w, h, curve){
  const g = new THREE.PlaneGeometry(w, h, 12, 10);
  const p = g.attributes.position;
  for (let i=0;i<p.count;i++){
    const x = p.getX(i), y = p.getY(i);
    const bow = Math.sin((x/w + 0.5) * Math.PI);
    const sag = (1 - Math.abs(y)/(h/2));
    p.setZ(i, curve * bow * sag);
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshPhongMaterial({ map:texture, side:THREE.DoubleSide, shininess:5 }));
  m.castShadow = true;
  return m;
}
const mainSail = sail(sunTex, 1.35, 2.35, 0.5);
mainSail.position.set(-0.15, 2.2, 0); ship.add(mainSail);
const sternSail = sail(sunTex, 1.1, 1.9, 0.42);
sternSail.position.set(1.55, 2.0, 0); ship.add(sternSail);

// Flags (waving via vertex anim)
const flags = [];
function flag(texture, w, h, x, y, z){
  const g = new THREE.PlaneGeometry(w, h, 10, 6);
  const m = new THREE.Mesh(g, new THREE.MeshPhongMaterial({ map:texture, side:THREE.DoubleSide, shininess:0 }));
  m.position.set(x,y,z);
  m.geometry.translate(w/2, 0, 0);
  ship.add(m); flags.push(m);
  return m;
}
flag(topFlag, 0.85, 0.4, -0.15, 4.02, 0);
flag(sternFlag, 0.7, 0.34, 1.55, 3.3, 0);
flag(shipFlag, 0.8, 0.5, -2.15, 1.45, 0.55);

// Rigging (lines)
const rigMat = new THREE.LineBasicMaterial({ color:0x2a1a10 });
function line(a, b){
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]);
  ship.add(new THREE.Line(g, rigMat));
}
line([-0.15,4.1,0],[-2.3,0.45,0.75]); line([-0.15,4.1,0],[-2.3,0.45,-0.75]);
line([-0.15,4.1,0],[1.55,3.35,0]);
line([1.55,3.45,0],[2.45,0.45,0.7]); line([1.55,3.45,0],[2.45,0.45,-0.7]);
line([-0.15,4.1,0],[2.5,0.5,0]);

// Bowsprit
const bow = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.06,1.6,8), mastMat);
bow.rotation.z = Math.PI/2 - 0.18; bow.position.set(2.7, 0.62, 0); ship.add(bow);

// Lantern + figure (tiny person on deck)
const lantern = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.34,0.28), new THREE.MeshPhongMaterial({ color:0xfff0a0, emissive:0xffdd66, emissiveIntensity:0.7 }));
lantern.position.set(-0.75, 0.85, 0.55); ship.add(lantern);
const person = new THREE.Group();
const pBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.1,0.28,4,8), new THREE.MeshPhongMaterial({ color:0xc94f4f }));
pBody.position.y = 0.32; person.add(pBody);
const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.13,8,8), new THREE.MeshPhongMaterial({ color:0xf0c49a }));
pHead.position.y = 0.62; person.add(pHead);
person.position.set(-0.15, 0.42, -0.3); ship.add(person);

// Camera-rig smoke? Small glowing lantern at stern (like glow in screenshots)
const sternGlow = new THREE.PointLight(0xffc266, 1.2, 6);
sternGlow.position.set(2.45, 0.7, 0); ship.add(sternGlow);

// Pyramid in the far distance (as in screenshot)
const pyramid = new THREE.Mesh(new THREE.ConeGeometry(6, 5, 4), new THREE.MeshPhongMaterial({ color:0x5a4a38, flatShading:true }));
pyramid.position.set(-45, 1.2, -55); scene.add(pyramid);

// Gull birds
const birds = [];
function gull(x,y,z,s){
  const g = new THREE.Group();
  const wingMat = new THREE.MeshBasicMaterial({ color:0x3a3a3a });
  const w1 = new THREE.Mesh(new THREE.ConeGeometry(0.05,0.9,4), wingMat);
  w1.rotation.z = Math.PI/2; w1.position.x = -0.45; g.add(w1);
  const w2 = new THREE.Mesh(new THREE.ConeGeometry(0.05,0.9,4), wingMat);
  w2.rotation.z = -Math.PI/2; w2.position.x = 0.45; g.add(w2);
  g.position.set(x,y,z); g.scale.setScalar(s); g.rotation.y = Math.random()*Math.PI;
  scene.add(g); birds.push({ g, w1, w2, t:Math.random()*10 });
}
gull(-6,7,-6,1.1); gull(7,8.5,-8,0.9); gull(-2,6.5,4,0.8);

// Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Sea waves
  for (let i=0;i<seaPos.count;i++){
    const x = seaBase[i*3], z = seaBase[i*3+2];
    seaPos.setY(i, Math.sin(x*0.18 + t*1.1)*0.22 + Math.cos(z*0.15 + t*0.8)*0.2 + Math.sin((x+z)*0.08 + t*0.5)*0.15);
  }
  seaPos.needsUpdate = true; seaGeo.computeVertexNormals();

  // Ship bob
  ship.position.y = Math.sin(t*0.9)*0.18;
  ship.rotation.z = Math.sin(t*0.7 + 0.6)*0.045;
  ship.rotation.x = Math.sin(t*0.55)*0.035;

  // Sails ripple
  mainSail.rotation.y = Math.sin(t*0.8)*0.08;
  sternSail.rotation.y = Math.sin(t*0.9 + 1.2)*0.09;

  // Flags wave
  flags.forEach((f, i) => {
    const p = f.geometry.attributes.position;
    for (let j=0;j<p.count;j++){
      const x = p.getX(j);
      p.setZ(j, Math.sin(x*6 + t*6 + i*2)*0.07*(x/0.8));
    }
    p.needsUpdate = true; f.geometry.computeVertexNormals();
  });

  // Clouds drift
  clouds.forEach((c,i)=>{ c.position.x += Math.sin(t*0.1+i)*0.002; c.position.x += 0.008; if(c.position.x > 60) c.position.x = -60; });

  // Birds
  birds.forEach((b,i)=>{
    b.t += 0.12;
    const flap = Math.sin(b.t*6)*0.55;
    b.w1.rotation.z = Math.PI/2 - flap; b.w2.rotation.z = -Math.PI/2 + flap;
    b.g.position.x += Math.sin(t*0.3 + i)*0.01;
  });

  lantern.material.emissiveIntensity = 0.55 + Math.sin(t*7)*0.25;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
