<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALTOS — Weather</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#07070a; --panel:#121117; --panel2:#17151f; --line:#232030;
    --txt:#f4f2fb; --dim:#8f8aa3; --accent:#9d8cff; --accent2:#5ee0c8;
  }
  html,body { height:100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #161226 0%, var(--bg) 60%);
    color:var(--txt); font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; min-height:100vh;
  }
  .app {
    width:min(1080px,100%); height:min(720px, calc(100vh - 48px));
    background:linear-gradient(180deg,#14121c 0%,#0c0b12 100%);
    border:1px solid #262232; border-radius:20px; overflow:hidden;
    display:grid; grid-template-columns:230px 1fr; box-shadow:0 40px 100px rgba(0,0,0,.6);
  }
  /* sidebar */
  .sidebar { background:#0d0c13; border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 14px; gap:14px; min-height:0; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.12em; font-size:14px; }
  .logo-mark { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#6d5cff,#36e0c2); display:flex; align-items:center; justify-content:center; font-size:15px; color:#0c0b12; }
  .search { position:relative; }
  .search input {
    width:100%; background:#1a1826; border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:9px 12px 9px 34px; font-size:12.5px; outline:none;
  }
  .search input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(157,140,255,.15); }
  .search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.55; }
  .loc-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-right:4px; }
  .loc-list::-webkit-scrollbar { width:6px; } .loc-list::-webkit-scrollbar-thumb { background:#2a2740; border-radius:3px; }
  .loc-item {
    display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px; cursor:pointer;
    border:1px solid transparent; transition:.18s;
  }
  .loc-item:hover { background:#17151f; }
  .loc-item.active { background:#1b1830; border-color:#332b52; box-shadow:inset 0 0 0 1px rgba(157,140,255,.2); }
  .loc-item .ico { width:32px; height:32px; border-radius:9px; background:#221f31; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .loc-item .name { font-size:12.5px; font-weight:600; }
  .loc-item .meta { font-size:10.5px; color:var(--dim); margin-top:2px; }
  .loc-item .t { margin-left:auto; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  .hint { font-size:10.5px; color:#5f5a75; text-align:center; line-height:1.5; padding:10px 4px; border-top:1px solid var(--line); }

  /* main */
  .main { position:relative; display:flex; flex-direction:column; padding:26px 30px 22px; min-height:0; overflow-y:auto; }
  .main::-webkit-scrollbar { width:0; }
  .sky { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .sun { position:absolute; top:-140px; right:-90px; width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,214,130,.35) 0%, rgba(255,214,130,0) 62%); transition:opacity .6s; }
  .cloud { position:absolute; height:44px; border-radius:999px; background:rgba(255,255,255,.06); filter:blur(1px); animation:drift 26s linear infinite; }
  .cloud::before, .cloud::after { content:""; position:absolute; background:inherit; border-radius:50%; }
  .cloud::before { width:45%; height:150%; top:-80%; left:18%; }
  .cloud::after { width:55%; height:130%; top:-55%; right:12%; }
  @keyframes drift { from{ transform:translateX(-40%);} to{ transform:translateX(150%);} }
  .cloud.c1 { top:12%; width:190px; animation-duration:34s; opacity:.7;}
  .cloud.c2 { top:30%; width:130px; animation-duration:46s; animation-delay:-18s; opacity:.45;}
  .cloud.c3 { top:55%; width:230px; animation-duration:58s; animation-delay:-30s; opacity:.3;}

  .head { position:relative; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .loc-name { font-size:13px; color:var(--dim); letter-spacing:.14em; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
  .loc-name .dot { width:7px; height:7px; border-radius:50%; background:var(--accent2); box-shadow:0 0 8px var(--accent2); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .pill { padding:6px 12px; border-radius:999px; background:#1d1a2b; border:1px solid var(--line); font-size:11px; color:var(--dim); display:flex; gap:8px; align-items:center; }
  .pill b { color:var(--txt); font-variant-numeric:tabular-nums; }

  .hero { position:relative; display:flex; align-items:center; gap:26px; margin:26px 0 8px; }
  .big-temp { font-size:96px; font-weight:800; letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; }
  .big-temp .unit { font-size:44px; vertical-align:top; color:var(--dim); font-weight:600; }
  .cond { margin-left:2px; }
  .cond .c-name { font-size:19px; font-weight:650; margin-bottom:6px; }
  .cond .c-feels { font-size:13px; color:var(--dim); }
  .cond .c-feels b { color:var(--txt); }

  .stats { position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0 18px; }
  .stat { background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:13px 14px; }
  .stat .k { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); display:flex; align-items:center; gap:7px; }
  .stat .v { font-size:20px; font-weight:700; margin-top:8px; font-variant-numeric:tabular-nums; }
  .stat .s { font-size:11px; color:var(--dim); margin-top:4px; }

  .chart-wrap { position:relative; background:var(--panel2); border:1px solid var(--line); border-radius:16px; padding:16px 16px 8px; margin-bottom:16px; }
  .chart-wrap h3 { font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:650; margin-bottom:8px; }
  svg.chart { width:100%; height:150px; display:block; }
  .days { position:relative; display:flex; flex-direction:column; gap:8px; }
  .day { display:grid; grid-template-columns:88px 44px 1fr 46px; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; background:var(--panel2); border:1px solid transparent; transition:.15s; }
  .day:hover { border-color:#332b52; transform:translateX(4px); }
  .day .d { font-weight:600; font-size:13.5px; }
  .day .hi-lo { grid-column:4; text-align:right; font-variant-numeric:tabular-nums; font-size:13px; font-weight:700; }
  .bar { position:relative; height:6px; border-radius:3px; background:#221f31; overflow:hidden; }
  .bar i { position:absolute; top:0; bottom:0; border-radius:3px; background:linear-gradient(90deg,#58c7ff,#ffd166); }
  .empty { padding:10px; font-size:12px; color:#5f5a75; text-align:center; }
  .fade { animation:fade .45s ease; }
  @keyframes fade { from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  /* icons */
  .ico-sun,.ico-cloud,.ico-rain,.ico-snow,.ico-wind,.ico-storm { display:inline-block; position:relative; }
  .ico-sun { width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #ffe89b, #ffb84d); box-shadow:0 0 14px rgba(255,200,80,.55); }
  .ico-cloud { width:32px; height:18px; border-radius:999px; background:#cfd6ea; }
  .ico-cloud::before { content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:#e7ecf7; top:-9px; left:6px; }
  .ico-cloud::after { content:""; position:absolute; width:14px; height:14px; border-radius:50%; background:#dde3f2; top:-6px; right:5px; }
  .ico-rain { width:28px; height:26px; }
  .ico-rain::before { content:""; position:absolute; width:26px; height:14px; border-radius:999px; background:#b9c4de; top:2px; left:1px; }
  .ico-rain::after { content:""; position:absolute; bottom:0; left:5px; width:3px; height:9px; border-radius:2px; background:#6fc2ff; box-shadow:9px 0 0 #6fc2ff, 18px 0 0 #6fc2ff; animation:drip 1.2s infinite linear; }
  @keyframes drip { 0%{transform:translateY(-4px); opacity:0;} 30%{opacity:1;} 100%{transform:translateY(6px); opacity:0;} }
  .ico-snow { width:26px; height:26px; }
  .ico-snow::before { content:""; position:absolute; width:30px; height:16px; border-radius:999px; background:#dfe6f4; top:2px; left:-2px; }
  .ico-snow::after { content:"*"; position:absolute; bottom:0; left:8px; font-size:18px; color:#cfe6ff; animation:drip 1.6s infinite linear; letter-spacing:6px; }
  .ico-wind { width:26px; height:22px; }
  .ico-wind::before,.ico-wind::after { content:""; position:absolute; height:3px; border-radius:2px; background:#a9b4cf; }
  .ico-wind::before { width:22px; top:6px; left:0; animation:wind 2.4s infinite ease-in-out; }
  .ico-wind::after { width:14px; top:14px; left:5px; animation:wind 2.4s infinite ease-in-out reverse; }
  @keyframes wind { 0%,100%{transform:translateX(0);} 50%{transform:translateX(4px);} }
  .ico-storm { width:30px; height:28px; }
  .ico-storm::before { content:""; position:absolute; width:28px; height:15px; border-radius:999px; background:#8b8fa8; top:1px; left:0; }
  .ico-storm::after { content:"⚡"; position:absolute; bottom:0; left:11px; font-size:13px; color:#ffe066; animation:blink 1.4s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .big-ico .ico-sun{ width:44px;height:44px; } .big-ico .ico-cloud{ width:52px;height:30px;}
  .big-ico .ico-rain{ width:44px;height:40px;} .big-ico .ico-snow{ width:42px;height:42px;} .big-ico .ico-wind{ width:44px;height:34px;} .big-ico .ico-storm{ width:48px;height:44px;}

  @media (max-width:860px){
    .app { grid-template-columns:1fr; height:auto; }
    .sidebar { order:2; max-height:220px; } .stats{ grid-template-columns:repeat(2,1fr);} .big-temp{font-size:72px;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">AT</div>ALTOS</div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8f8aa3" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Search a city…" autocomplete="off">
    </div>
    <div class="loc-list" id="list"></div>
    <div class="hint">Demo dataset · pick a city or search</div>
  </aside>

  <main class="main" id="main">
    <div class="sky" id="sky">
      <div class="sun" id="sun"></div>
      <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    </div>

    <div class="head">
      <div class="loc-name"><span class="dot"></span><span id="regionLabel">Reykjavík · Iceland</span></div>
      <div class="pill"><span id="clock">--:--</span><b id="tz">GMT</b></div>
    </div>

    <div class="hero fade" id="hero">
      <div class="big-ico" id="bigIco"></div>
      <div class="big-temp" id="bigTemp">--<span class="unit">°C</span></div>
      <div class="cond">
        <div class="c-name" id="cName">—</div>
        <div class="c-feels">Feels like <b id="feels">—</b> · H <b id="hi">—</b> / L <b id="lo">—</b></div>
        <div class="c-feels" id="extra" style="margin-top:6px;font-size:12px;"></div>
      </div>
    </div>

    <div class="stats fade" id="stats"></div>

    <div class="chart-wrap fade" id="chartWrap">
      <h3>Hourly trend</h3>
      <svg class="chart" id="chart" viewBox="0 0 720 150" preserveAspectRatio="none"></svg>
    </div>

    <div class="days fade" id="days"></div>
  </main>
</div>

<script>
const ICONS = {
  sun:'ico-sun', cloud:'ico-cloud', rain:'ico-rain', snow:'ico-snow', wind:'ico-wind', storm:'ico-storm'
};
const DATA = {
  "Reykjavík, Iceland": { condition:"snow", cName:"Light Snow", temp:3, feels:-2, hi:5, lo:-1, humidity:78, wind:14, windDir:"NW", pressure:1014, uv:2, sun:"17:28",
    hourly:[3,4,3,2,1,2,3,4], week:[
      ["Today","snow",5,-1],["Tue","cloud",6,0],["Wed","rain",6,2],["Thu","sun",7,1],["Fri","wind",4,-2],["Sat","cloud",5,0],["Sun","snow",3,-3]] },
  "London, UK": { condition:"cloud", cName:"Overcast", temp:11, feels:9, hi:13, lo:7, humidity:81, wind:18, windDir:"SW", pressure:1018, uv:3, sun:"18:12",
    hourly:[11,12,12,11,10,10,11,12], week:[
      ["Today","cloud",13,7],["Tue","rain",11,6],["Wed","sun",14,8],["Thu","sun",15,9],["Fri","wind",12,7],["Sat","rain",10,6],["Sun","cloud",12,8]] },
  "Tokyo, Japan": { condition:"sun", cName:"Clear & Sunny", temp:21, feels:20, hi:24, lo:15, humidity:54, wind:9, windDir:"E", pressure:1019, uv:5, sun:"18:45",
    hourly:[18,19,21,23,24,23,21,19], week:[
      ["Today","sun",24,15],["Tue","sun",25,16],["Wed","cloud",22,16],["Thu","rain",19,14],["Fri","sun",23,15],["Sat","cloud",21,14],["Sun","sun",24,16]] },
  "Cairo, Egypt": { condition:"sun", cName:"Hot & Dry", temp:31, feels:34, hi:34, lo:21, humidity:22, wind:16, windDir:"W", pressure:1001, uv:9, sun:"18:05",
    hourly:[27,29,32,34,33,31,29,28], week:[
      ["Today","sun",34,21],["Tue","sun",35,22],["Wed","sun",36,23],["Thu","wind",33,21],["Fri","sun",35,22],["Sat","cloud",32,20],["Sun","sun",34,22]] },
  "Singapore, SG": { condition:"storm", cName:"Thunderstorms", temp:29, feels:33, hi:31, lo:25, humidity:92, wind:22, windDir:"SE", pressure:1007, uv:7, sun:"19:02",
    hourly:[28,29,30,30,29,28,28,28], week:[
      ["Today","storm",31,25],["Tue","rain",30,24],["Wed","storm",31,25],["Thu","rain",29,24],["Fri","storm",30,25],["Sat","cloud",28,24],["Sun","rain",30,25]] },
  "Paris, France": { condition:"wind", cName:"Breezy", temp:14, feels:11, hi:17, lo:8, humidity:64, wind:26, windDir:"N", pressure:1006, uv:4, sun:"19:20",
    hourly:[12,13,15,16,16,15,14,13], week:[
      ["Today","wind",17,8],["Tue","cloud",15,8],["Wed","rain",13,7],["Thu","sun",17,9],["Fri","sun",18,10],["Sat","wind",15,8],["Sun","cloud",14,8]] },
  "New York, USA": { condition:"rain", cName:"Rain Showers", temp:9, feels:7, hi:11, lo:5, humidity:88, wind:20, windDir:"NE", pressure:1003, uv:2, sun:"17:48",
    hourly:[8,9,10,10,9,8,7,8], week:[
      ["Today","rain",11,5],["Tue","rain",10,5],["Wed","wind",12,6],["Thu","sun",13,6],["Fri","cloud",11,5],["Sat","rain",9,4],["Sun","sun",12,5]] }
};

const list = document.getElementById('list');
const search = document.getElementById('search');
let current = "Reykjavík, Iceland";

function iconHTML(cond, big){ return `<span class="ico-${cond}" style="${big?'':'transform:scale(.8)'}"></span>`; }
function renderList(filter=''){
  const q = filter.trim().toLowerCase();
  const names = Object.keys(DATA).filter(n => !q || n.toLowerCase().includes(q));
  list.innerHTML = names.map(name => {
    const d = DATA[name];
    const short = name.split(',')[0];
    return `<div class="loc-item ${name===current?'active':''}" data-name="${name}">
      <div class="ico">${iconHTML(d.condition)}</div>
      <div><div class="name">${short}</div><div class="meta">${d.cName}</div></div>
      <div class="t">${d.temp}°</div>
    </div>`;
  }).join('') || '<div class="empty">No matching city</div>';
  list.querySelectorAll('.loc-item').forEach(el => el.addEventListener('click', () => select(el.dataset.name)));
}

function select(name){
  current = name;
  search.value = '';
  renderList();
  renderMain();
}

function renderMain(){
  const d = DATA[current];
  const parts = current.split(',');
  regionLabel.textContent = current;
  tz.textContent = 'GMT';
  clock.textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

  bigIco.innerHTML = iconHTML(d.condition, true);
  bigTemp.innerHTML = `${d.temp}<span class="unit">°C</span>`;
  cName.textContent = d.cName;
  feels.textContent = `${d.feels}°C`;
  hi.textContent = `${d.hi}°`; lo.textContent = `${d.lo}°`;
  extra.textContent = `Sunset ${d.sun} · Wind ${d.wind} km/h ${d.windDir}`;

  stats.innerHTML = `
    <div class="stat"><div class="k">💧 Humidity</div><div class="v">${d.humidity}%</div><div class="s">${d.humidity>70?'Moist air':'Dry air'}</div></div>
    <div class="stat"><div class="k">🌬️ Wind</div><div class="v">${d.wind} km/h</div><div class="s">from ${d.windDir}</div></div>
    <div class="stat"><div class="k">🌡️ Pressure</div><div class="v">${d.pressure}</div><div class="s">hPa</div></div>
    <div class="stat"><div class="k">☀️ UV Index</div><div class="v">${d.uv}</div><div class="s">${d.uv<3?'Low':d.uv<6?'Moderate':'High'}</div></div>`;

  // sun intensity based on uv
  sun.style.opacity = d.condition==='sun' ? 1 : d.condition==='wind' ? .5 : .18;
  sky.querySelectorAll('.cloud').forEach(c => c.style.opacity = d.condition==='sun' ? .3 : 1);

  // chart
  const vals = d.hourly, labels = ['Now','12','15','18','21','Now+6','',''];
  const mn = Math.min(...vals)-2, mx = Math.max(...vals)+2;
  const W=720,H=150,P=20;
  const pts = vals.map((v,i)=>[P + i*(W-2*P)/(vals.length-1), H-P - (v-mn)/(mx-mn)*(H-2*P-10)]);
  const path = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = path + ` L${pts[pts.length-1][0]},${H} L${pts[0][0]},${H} Z`;
  chart.innerHTML = `
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d8cff" stop-opacity=".45"/><stop offset="1" stop-color="#9d8cff" stop-opacity="0"/>
    </linearGradient></defs>
    ${[0,1,2,3].map(i=>`<line x1="${P}" y1="${P+i*(H-2*P)/3}" x2="${W-P}" y2="${P+i*(H-2*P)/3}" stroke="#231f33" stroke-width="1" stroke-dasharray="3 5"/>`).join('')}
    <path d="${area}" fill="url(#g)"/>
    <path d="${path}" fill="none" stroke="#9d8cff" stroke-width="2.5" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#17151f" stroke="#9d8cff" stroke-width="2"/>
      <text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="11" fill="#c7c2e0" font-weight="600">${vals[i]}°</text>`).join('')}`;

  const tmn = Math.min(...d.week.map(w=>w[3]))-1, tmx = Math.max(...d.week.map(w=>w[2]))+1;
  days.innerHTML = d.week.map(w=>{
    const [day,cond,hiV,loV] = w;
    const left = (loV-tmn)/(tmx-tmn)*100, right=(hiV-tmn)/(tmx-tmn)*100;
    return `<div class="day">
      <div class="d">${day}</div>
      <div>${iconHTML(cond)}</div>
      <div class="bar"><i style="left:${left}%;width:${right-left}%"></i></div>
      <div class="hi-lo">${hiV}°<span style="color:var(--dim)"> / </span>${loV}°</div>
    </div>`;
  }).join('');

  [hero,stats,chartWrap,days].forEach(el=>{ el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); });
  clock.textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

search.addEventListener('input', e => renderList(e.target.value));

search.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const matches = Object.keys(DATA).filter(n => !e.target.value.trim() || n.toLowerCase().includes(e.target.value.trim().toLowerCase()));
    if (matches.length) select(matches[0]);
  }
});

setInterval(() => { clock.textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }, 10000);

select("Reykjavík, Iceland");
</script>
</body>
</html>
