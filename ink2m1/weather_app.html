<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9b8d4">
<title>ATMOS — Weather</title>
<style>
  :root {
    --ink: #1a2230;
    --mute: rgba(26,34,48,.58);
    --glass: rgba(255,255,255,.28);
    --glass-2: rgba(255,255,255,.16);
    --stroke: rgba(255,255,255,.42);
    --stroke-soft: rgba(255,255,255,.22);
    --shadow: 0 24px 60px rgba(40,28,60,.22);
    --accent: #3d8ea8;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100dvh;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    background: #0e121c;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .frame {
    width: min(1100px, 100%);
    height: min(720px, 100dvh);
    border-radius: 28px;
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,.12);
  }
  .sky {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 520px at 8% 12%, rgba(255,186,140,.72) 0%, rgba(255,186,140,0) 58%),
      radial-gradient(800px 500px at 92% 18%, rgba(164,214,230,.7) 0%, rgba(164,214,230,0) 60%),
      radial-gradient(700px 480px at 70% 90%, rgba(186,168,220,.55) 0%, rgba(186,168,220,0) 62%),
      linear-gradient(160deg, #f3c7b4 0%, #d7c4e0 42%, #b9d4e6 100%);
    transition: background 700ms ease;
  }
  .sky canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .frost { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.04) 40%, rgba(30,40,60,.06)); pointer-events: none; }
  .app {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 232px 1fr;
    height: 100%;
    min-height: 0;
  }

  .side {
    display: flex; flex-direction: column; gap: 12px;
    padding: 18px 14px 16px;
    background: rgba(255,255,255,.18);
    border-right: 1px solid var(--stroke-soft);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    min-height: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 6px; }
  .orb {
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #fff6d8 0%, #ffb15a 42%, #ff7a4d 100%);
    box-shadow: 0 0 16px rgba(255,160,80,.55);
    flex-shrink: 0;
  }
  .brand h1 { font-size: 13px; letter-spacing: .22em; font-weight: 700; }
  .search { position: relative; }
  .search input {
    width: 100%;
    border: 1px solid var(--stroke-soft);
    background: rgba(255,255,255,.38);
    color: var(--ink);
    border-radius: 14px;
    padding: 10px 12px 10px 34px;
    font: inherit; font-size: 13px;
    outline: none;
  }
  .search input::placeholder { color: var(--mute); }
  .search input:focus { border-color: rgba(61,142,168,.55); background: rgba(255,255,255,.55); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .5; }
  .suggest {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px);
    background: rgba(255,255,255,.92);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    overflow: hidden;
    z-index: 8;
    box-shadow: 0 12px 30px rgba(30,20,50,.16);
    display: none;
  }
  .suggest.open { display: block; }
  .suggest button {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; padding: 10px 12px;
    font: inherit; font-size: 13px; cursor: pointer; color: var(--ink);
  }
  .suggest button:hover, .suggest button.active { background: rgba(61,142,168,.12); }
  .cities { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
  .cities::-webkit-scrollbar { width: 4px; }
  .cities::-webkit-scrollbar-thumb { background: rgba(255,255,255,.35); border-radius: 4px; }
  .city {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
    padding: 11px 12px; border-radius: 16px; cursor: pointer;
    border: 1px solid transparent;
    background: rgba(255,255,255,.16);
    text-align: left; font: inherit; color: inherit;
    transition: background .18s, border-color .18s, transform .18s;
  }
  .city:hover { background: rgba(255,255,255,.28); }
  .city.on {
    background: rgba(255,255,255,.46);
    border-color: rgba(255,255,255,.55);
    box-shadow: 0 8px 20px rgba(40,30,60,.1);
  }
  .city .n { font-size: 13px; font-weight: 600; }
  .city .c { grid-column: 1; font-size: 11px; color: var(--mute); }
  .city .t { grid-row: 1 / span 2; align-self: center; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .side-actions { display: flex; gap: 8px; }
  .ghost {
    flex: 1; border: 1px solid var(--stroke-soft); background: rgba(255,255,255,.22);
    color: var(--ink); border-radius: 12px; padding: 8px 8px; font: inherit; font-size: 11px;
    letter-spacing: .04em; cursor: pointer;
  }
  .ghost:hover { background: rgba(255,255,255,.4); }

  .main {
    min-width: 0; min-height: 0;
    overflow: auto;
    padding: 22px 26px 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .main::-webkit-scrollbar { width: 0; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .place .where { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .place .when { margin-top: 3px; font-size: 12px; color: var(--mute); }
  .unit {
    border: 1px solid var(--stroke); background: rgba(255,255,255,.28);
    border-radius: 999px; padding: 6px; display: flex; gap: 2px;
  }
  .unit button {
    border: 0; background: transparent; color: var(--mute);
    font: inherit; font-size: 12px; font-weight: 600;
    padding: 4px 9px; border-radius: 999px; cursor: pointer;
  }
  .unit button.on { background: rgba(26,34,48,.86); color: #fff; }

  .hero { display: flex; align-items: flex-end; gap: 18px; padding: 6px 0 2px; }
  .temp {
    font-size: 104px; font-weight: 600;
    letter-spacing: -.06em; line-height: .85;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 8px 30px rgba(255,255,255,.25);
  }
  .temp sup { font-size: .38em; font-weight: 500; margin-left: 2px; top: -.7em; }
  .hero-meta { padding-bottom: 10px; }
  .cond { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .feel { margin-top: 6px; font-size: 13px; color: var(--mute); }
  .feel b { color: var(--ink); font-weight: 600; }
  .wx { width: 28px; height: 28px; flex-shrink: 0; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat {
    background: var(--glass);
    border: 1px solid var(--stroke-soft);
    border-radius: 16px;
    padding: 12px 13px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .stat .k { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
  .stat .v { margin-top: 7px; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .s { margin-top: 3px; font-size: 11px; color: var(--mute); }

  .panel {
    background: var(--glass-2);
    border: 1px solid var(--stroke-soft);
    border-radius: 20px;
    padding: 14px 14px 10px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .panel h3 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); font-weight: 700; margin-bottom: 8px; }
  .chart { width: 100%; height: 148px; display: block; }
  .hours {
    display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px;
    scrollbar-width: none;
  }
  .hours::-webkit-scrollbar { display: none; }
  .hour {
    flex: 0 0 58px; text-align: center; padding: 8px 0;
    border-radius: 14px;
  }
  .hour .hh { font-size: 11px; color: var(--mute); font-weight: 600; }
  .hour .ht { margin-top: 8px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hour svg { margin: 8px auto 0; display: block; }

  .days { display: flex; flex-direction: column; gap: 4px; }
  .day {
    display: grid; grid-template-columns: 78px 28px 1fr 86px;
    align-items: center; gap: 10px;
    padding: 8px 6px; border-radius: 12px;
  }
  .day .dn { font-size: 13.5px; font-weight: 600; }
  .bar { height: 6px; border-radius: 99px; background: rgba(26,34,48,.1); position: relative; overflow: hidden; }
  .bar i {
    position: absolute; top: 0; bottom: 0; border-radius: 99px;
    background: linear-gradient(90deg, #7ec8e3, #f2c07a);
  }
  .hi-lo { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; }
  .hi-lo span { color: var(--mute); font-weight: 600; }

  .status {
    font-size: 11px; color: var(--mute); text-align: right;
    min-height: 14px;
  }
  .err { color: #8a2b2b; }

  @media (max-width: 860px) {
    body { background: #c9b8d4; }
    .frame {
      width: 100%; height: 100dvh; height: 100svh;
      border-radius: 0; border: 0; box-shadow: none;
    }
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .side {
      border-right: 0;
      border-bottom: 1px solid var(--stroke-soft);
      padding: calc(12px + var(--safe-t)) 14px 12px;
      gap: 10px;
    }
    .cities {
      flex-direction: row; overflow-x: auto; overflow-y: hidden;
      gap: 8px; padding-bottom: 2px;
    }
    .city { min-width: 148px; flex: 0 0 auto; }
    .main { padding: 16px 16px calc(18px + var(--safe-b)); }
    .temp { font-size: 84px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .cond { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="sky" id="sky"><canvas id="dust"></canvas></div>
  <div class="frost"></div>
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="orb" aria-hidden="true"></div><h1>ATMOS</h1></div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg>
        <input id="q" type="search" placeholder="Search a city" autocomplete="off" enterkeyhint="search">
        <div class="suggest" id="suggest" role="listbox"></div>
      </div>
      <div class="cities" id="cities"></div>
      <div class="side-actions">
        <button class="ghost" id="locate" type="button">Use my location</button>
      </div>
    </aside>
    <main class="main">
      <div class="top">
        <div class="place">
          <div class="where" id="where">Reykjavík, Iceland</div>
          <div class="when" id="when">—</div>
        </div>
        <div class="unit" role="group" aria-label="Temperature unit">
          <button type="button" id="uC" class="on">°C</button>
          <button type="button" id="uF">°F</button>
        </div>
      </div>
      <div class="hero">
        <div class="temp" id="temp">3<sup>°</sup></div>
        <div class="hero-meta">
          <div class="cond" id="cond"><span class="wx" id="wx"></span><span id="condText">Light snow</span></div>
          <div class="feel">Feels like <b id="feels">−2°</b> · H <b id="hi">5°</b> / L <b id="lo">−1°</b></div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="panel">
        <h3>Hourly</h3>
        <div class="hours" id="hours"></div>
        <svg class="chart" id="chart" viewBox="0 0 720 148" preserveAspectRatio="none"></svg>
      </div>
      <div class="panel">
        <h3>This week</h3>
        <div class="days" id="days"></div>
      </div>
      <div class="status" id="status"></div>
    </main>
  </div>
</div>
<script>
const PRESETS = [
  { name: "Reykjavík", country: "Iceland", lat: 64.1466, lon: -21.9426 },
  { name: "San Francisco", country: "USA", lat: 37.7749, lon: -122.4194 },
  { name: "Tokyo", country: "Japan", lat: 35.6762, lon: 139.6503 },
  { name: "London", country: "UK", lat: 51.5074, lon: -0.1278 },
  { name: "Sydney", country: "Australia", lat: -33.8688, lon: 151.2093 },
  { name: "Hong Kong", country: "China", lat: 22.3193, lon: 114.1694 }
];

const FALLBACK = {
  "Reykjavík|Iceland": {
    tz: "Atlantic/Reykjavik",
    current: { temperature_2m: 3, apparent_temperature: -2, relative_humidity_2m: 78, weather_code: 71, wind_speed_10m: 14, wind_direction_10m: 315, pressure_msl: 1014, uv_index: 2, is_day: 1 },
    hourly: { time: hoursFrom("06:00", 24), temperature_2m: [1,1,2,2,3,3,4,3,3,2,1,2,3,4,3,2,1,0,0,1,2,3,3,2], weather_code: Array(24).fill(71), precipitation_probability: [40,40,45,50,55,50,40,35,30,30,25,20,20,25,30,40,45,50,50,45,40,40,35,35] },
    daily: {
      time: ["d0","d1","d2","d3","d4","d5","d6"],
      weather_code: [71,3,61,0,51,3,71],
      temperature_2m_max: [5,6,6,7,4,5,3],
      temperature_2m_min: [-1,0,2,1,-2,0,-3],
      sunrise: ["2026-11-24T10:28"], sunset: ["2026-11-24T16:28"],
      uv_index_max: [2,2,1,2,1,2,1],
      precipitation_probability_max: [60,20,70,10,40,30,65]
    }
  }
};

function hoursFrom(start, n) {
  const [h] = start.split(":").map(Number);
  return Array.from({length: n}, (_, i) => {
    const t = (h + i) % 24;
    return `2000-01-01T${String(t).padStart(2,"0")}:00`;
  });
}

const cities = PRESETS.map((c) => ({...c}));
let current = cities[0];
let snap = null;
let unit = localStorage.getItem("atmos-unit") === "f" ? "f" : "c";
let suggestItems = [];
let suggestI = -1;

const $ = (id) => document.getElementById(id);

function wxIcon(code, isDay, size) {
  const s = size || 24;
  const sun = `<circle cx="12" cy="12" r="5" fill="#ffc14a"/><g stroke="#ffc14a" stroke-width="1.7" stroke-linecap="round"><path d="M12 2.2v2.2M12 19.6v2.2M2.2 12h2.2M19.6 12h2.2M4.8 4.8l1.6 1.6M17.6 17.6l1.6 1.6M19.2 4.8l-1.6 1.6M6.4 17.6l-1.6 1.6"/></g>`;
  const moon = `<path fill="#e8eef8" d="M14.5 4.2a7.6 7.6 0 1 0 5.2 13.2A8 8 0 1 1 14.5 4.2z"/>`;
  const cloud = `<path fill="#f4f7fb" stroke="rgba(80,100,130,.18)" d="M7.2 17.5h10.4a3.9 3.9 0 0 0 .4-7.8 5.1 5.1 0 0 0-9.8-1.1A3.8 3.8 0 0 0 7.2 17.5z"/>`;
  const rain = cloud + `<g stroke="#5aa7d6" stroke-width="1.6" stroke-linecap="round"><path d="M8.5 19.2v2.2M12 19.2v2.2M15.5 19.2v2.2"/></g>`;
  const snow = cloud + `<g fill="#d7e7f8" font-size="5"><text x="7.2" y="22">*</text><text x="11" y="22">*</text><text x="14.8" y="22">*</text></g>`;
  const storm = cloud + `<path fill="#ffe066" d="M12.6 14.2l-2.8 4.6h2.2l-1.2 4 4.2-5.6h-2.3z"/>`;
  const fog = `<g stroke="rgba(80,100,130,.45)" stroke-width="1.7" stroke-linecap="round"><path d="M4 10h16M5 13.2h14M6 16.4h12"/></g>`;
  let inner = cloud;
  if (code === 0) inner = isDay ? sun : moon;
  else if (code === 1 || code === 2) inner = (isDay ? sun : moon) + cloud;
  else if (code === 45 || code === 48) inner = fog;
  else if (code >= 71 && code <= 77 || code >= 85 && code <= 86) inner = snow;
  else if (code >= 95) inner = storm;
  else if (code >= 51) inner = rain;
  return `<svg class="wx" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`;
}

function labelOf(code, isDay) {
  if (code === 0) return isDay ? "Clear sky" : "Clear night";
  if (code === 1) return isDay ? "Mainly clear" : "Mostly clear";
  if (code === 2) return "Partly cloudy";
  if (code === 3) return "Overcast";
  if (code === 45 || code === 48) return "Fog";
  if (code >= 51 && code <= 57) return "Drizzle";
  if (code >= 61 && code <= 67) return "Rain";
  if (code >= 71 && code <= 77) return "Snow";
  if (code >= 80 && code <= 82) return "Rain showers";
  if (code >= 85 && code <= 86) return "Snow showers";
  if (code >= 95) return "Thunderstorm";
  return "Cloudy";
}

function skyFor(code, isDay) {
  if (code >= 95) return "radial-gradient(800px 500px at 20% 10%, rgba(180,150,210,.55) 0%, transparent 55%), linear-gradient(160deg, #8a93a8 0%, #5d6478 55%, #3e4558 100%)";
  if (code >= 71 && code <= 86) return "radial-gradient(900px 520px at 8% 12%, rgba(255,186,140,.72) 0%, rgba(255,186,140,0) 58%), radial-gradient(800px 500px at 92% 18%, rgba(164,214,230,.7) 0%, rgba(164,214,230,0) 60%), linear-gradient(160deg, #f3c7b4 0%, #d7c4e0 42%, #b9d4e6 100%)";
  if (code >= 51) return "radial-gradient(800px 480px at 80% 0%, rgba(170,200,220,.45) 0%, transparent 60%), linear-gradient(160deg, #9aa9b8 0%, #7d8b9a 50%, #667180 100%)";
  if (!isDay) return "radial-gradient(700px 480px at 80% 10%, rgba(120,140,210,.45) 0%, transparent 55%), linear-gradient(160deg, #2a3350 0%, #1b2238 55%, #12182a 100%)";
  if (code === 0) return "radial-gradient(900px 540px at 12% 8%, rgba(255,210,120,.85) 0%, transparent 55%), linear-gradient(160deg, #f7d9a6 0%, #9ec8ef 55%, #7eb0e0 100%)";
  return "radial-gradient(800px 500px at 10% 8%, rgba(255,200,160,.5) 0%, transparent 58%), linear-gradient(160deg, #d9e3ef 0%, #c3d0e0 50%, #a9bdd3 100%)";
}

function inkFor(isDay, code) {
  const dark = !isDay || code >= 95;
  document.documentElement.style.setProperty("--ink", dark ? "#f3f6fb" : "#1a2230");
  document.documentElement.style.setProperty("--mute", dark ? "rgba(243,246,251,.62)" : "rgba(26,34,48,.58)");
}

function toC(v) { return unit === "c" ? v : (v * 9/5 + 32); }
function deg(v, n) {
  if (v == null || Number.isNaN(v)) return "—";
  const x = toC(v);
  return (n == null ? Math.round(x) : x.toFixed(n)) + "°";
}
function compass(d) {
  const pts = ["N","NE","E","SE","S","SW","W","NW"];
  return pts[Math.round(((d % 360) + 360) % 360 / 45) % 8];
}
function uvWord(u) {
  if (u < 3) return "Low";
  if (u < 6) return "Moderate";
  if (u < 8) return "High";
  return "Very high";
}
function keyOf(c) { return c.name + "|" + c.country; }

function cityButton(c, live) {
  const t = live && live.current ? deg(live.current.temperature_2m) : "–";
  const s = live && live.current ? labelOf(live.current.weather_code, live.current.is_day) : "";
  const on = current.name === c.name && current.country === c.country ? " on" : "";
  return `<button type="button" class="city${on}" data-key="${keyOf(c)}">
    <span class="n">${c.name}</span>
    <span class="t">${t}</span>
    <span class="c">${s || c.country}</span>
  </button>`;
}

const cache = new Map();

async function fetchWeather(c) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}` +
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,uv_index,is_day` +
    `&hourly=temperature_2m,weather_code,precipitation_probability` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max` +
    `&timezone=auto&forecast_days=7`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Weather request failed");
  return res.json();
}

function fallbackFor(c) {
  const packed = FALLBACK[keyOf(c)];
  if (packed) return { ...packed, latitude: c.lat, longitude: c.lon };
  return {
    tz: "UTC",
    current: { temperature_2m: 12, apparent_temperature: 11, relative_humidity_2m: 60, weather_code: 2, wind_speed_10m: 12, wind_direction_10m: 180, pressure_msl: 1013, uv_index: 3, is_day: 1 },
    hourly: { time: hoursFrom("00:00", 24), temperature_2m: Array.from({length:24}, (_,i)=>10+Math.round(4*Math.sin(i/3))), weather_code: Array(24).fill(2), precipitation_probability: Array(24).fill(10) },
    daily: { time: Array.from({length:7},(_,i)=>"d"+i), weather_code: [2,1,3,61,0,2,3], temperature_2m_max: [16,17,14,13,18,16,15], temperature_2m_min: [8,9,7,6,9,8,7], sunrise:["2000-01-01T07:00"], sunset:["2000-01-01T17:30"], uv_index_max:[4], precipitation_probability_max:[10] }
  };
}

function clockIn(tz) {
  try {
    return new Date().toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit", timeZone: tz || undefined });
  } catch {
    return new Date().toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" });
  }
}

function fmtHour(iso, tz) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime()) && typeof iso === "string" && iso.includes("T")) {
    return iso.slice(11, 16);
  }
  try {
    return d.toLocaleTimeString(undefined, { hour: "numeric", timeZone: tz || undefined });
  } catch {
    return d.toLocaleTimeString(undefined, { hour: "numeric" });
  }
}

function dayName(iso, i) {
  if (i === 0) return "Today";
  if (typeof iso === "string" && iso.startsWith("d")) {
    return ["Today","Tue","Wed","Thu","Fri","Sat","Sun"][i] || "Day";
  }
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short" });
}

function renderList(liveMap) {
  $("cities").innerHTML = cities.map((c) => cityButton(c, liveMap && liveMap.get(keyOf(c)))).join("");
  $("cities").querySelectorAll(".city").forEach((btn) => {
    btn.addEventListener("click", () => {
      const found = cities.find((c) => keyOf(c) === btn.dataset.key);
      if (found) select(found);
    });
  });
}

function smoothPath(pts) {
  if (!pts.length) return "";
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i === 0 ? 0 : i - 1];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

function renderMain(data, fromNetwork) {
  snap = data;
  const cur = data.current;
  const tz = data.timezone || data.tz;
  const isDay = !!cur.is_day;
  $("sky").style.background = skyFor(cur.weather_code, isDay);
  inkFor(isDay, cur.weather_code);
  $("where").textContent = current.name + ", " + current.country;
  $("when").textContent = clockIn(tz);
  $("temp").innerHTML = Math.round(toC(cur.temperature_2m)) + "<sup>°</sup>";
  $("condText").textContent = labelOf(cur.weather_code, isDay);
  $("wx").outerHTML = wxIcon(cur.weather_code, isDay, 28).replace('class="wx"', 'class="wx" id="wx"');
  $("feels").textContent = deg(cur.apparent_temperature);
  $("hi").textContent = deg(data.daily.temperature_2m_max[0]);
  $("lo").textContent = deg(data.daily.temperature_2m_min[0]);

  const rise = data.daily.sunrise && data.daily.sunrise[0] ? fmtHour(data.daily.sunrise[0], tz) : "—";
  const set = data.daily.sunset && data.daily.sunset[0] ? fmtHour(data.daily.sunset[0], tz) : "—";
  $("stats").innerHTML = `
    <div class="stat"><div class="k">Humidity</div><div class="v">${Math.round(cur.relative_humidity_2m)}%</div><div class="s">${cur.relative_humidity_2m >= 70 ? "Moist air" : cur.relative_humidity_2m <= 30 ? "Dry air" : "Comfortable"}</div></div>
    <div class="stat"><div class="k">Wind</div><div class="v">${Math.round(cur.wind_speed_10m)} km/h</div><div class="s">${compass(cur.wind_direction_10m)}</div></div>
    <div class="stat"><div class="k">Pressure</div><div class="v">${Math.round(cur.pressure_msl)}</div><div class="s">hPa</div></div>
    <div class="stat"><div class="k">UV / Sun</div><div class="v">${(cur.uv_index ?? data.daily.uv_index_max[0] ?? 0).toFixed ? (cur.uv_index ?? data.daily.uv_index_max[0] ?? 0).toFixed(0) : (cur.uv_index ?? 0)}</div><div class="s">${uvWord(cur.uv_index ?? data.daily.uv_index_max[0] ?? 0)} · ${rise}–${set}</div></div>`;

  const now = Date.now();
  let start = 0;
  if (data.hourly.time[0] && !String(data.hourly.time[0]).startsWith("2000")) {
    start = data.hourly.time.findIndex((t) => new Date(t).getTime() >= now - 30 * 60 * 1000);
    if (start < 0) start = 0;
  }
  const slice = 24;
  const times = data.hourly.time.slice(start, start + slice);
  const temps = data.hourly.temperature_2m.slice(start, start + slice);
  const codes = data.hourly.weather_code.slice(start, start + slice);
  $("hours").innerHTML = times.map((t, i) => `<div class="hour">
    <div class="hh">${i === 0 ? "Now" : fmtHour(t, tz)}</div>
    ${wxIcon(codes[i], isDay, 22)}
    <div class="ht">${deg(temps[i])}</div>
  </div>`).join("");

  const W = 720, H = 148, P = 22;
  const mn = Math.min(...temps) - 2, mx = Math.max(...temps) + 2;
  const pts = temps.map((v, i) => [P + i * (W - 2 * P) / Math.max(temps.length - 1, 1), H - 28 - ((toC(v) - toC(mn)) / (toC(mx) - toC(mn) || 1)) * (H - 50)]);
  const line = smoothPath(pts);
  const last = pts[pts.length - 1];
  const first = pts[0];
  const area = line + ` L${last[0].toFixed(1)},${H - 8} L${first[0].toFixed(1)},${H - 8} Z`;
  const labels = times.map((t, i) => {
    if (i % 3 !== 0) return "";
    return `<text x="${pts[i][0].toFixed(1)}" y="${H - 2}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".55">${i === 0 ? "Now" : fmtHour(t, tz)}</text>`;
  }).join("");
  $("chart").innerHTML = `
    <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8ea8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3d8ea8" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#fill)"/>
    <path d="${line}" fill="none" stroke="#2f7d96" stroke-width="2.4" stroke-linecap="round"/>
    ${pts.map((p, i) => i % 2 === 0 ? `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="#2f7d96" stroke-width="1.6"/>
      <text x="${p[0]}" y="${(p[1] - 9).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="currentColor">${Math.round(toC(temps[i]))}°</text>` : "").join("")}
    ${labels}`;

  const tmin = Math.min(...data.daily.temperature_2m_min) - 1;
  const tmax = Math.max(...data.daily.temperature_2m_max) + 1;
  const span = tmax - tmin || 1;
  $("days").innerHTML = data.daily.time.map((t, i) => {
    const lo = data.daily.temperature_2m_min[i];
    const hi = data.daily.temperature_2m_max[i];
    const left = ((lo - tmin) / span) * 100;
    const width = ((hi - lo) / span) * 100;
    return `<div class="day">
      <div class="dn">${dayName(t, i)}</div>
      ${wxIcon(data.daily.weather_code[i], 1, 22)}
      <div class="bar"><i style="left:${left}%;width:${Math.max(width, 8)}%"></i></div>
      <div class="hi-lo">${deg(hi)} <span>/ ${deg(lo)}</span></div>
    </div>`;
  }).join("");

  $("status").className = "status" + (fromNetwork ? "" : " err");
  $("status").textContent = fromNetwork ? "Live forecast · Open-Meteo" : "Showing saved demo data — live weather is unavailable right now";
  $("uC").className = unit === "c" ? "on" : "";
  $("uF").className = unit === "f" ? "on" : "";
}

async function load(c, opts) {
  current = c;
  if (!cities.some((x) => keyOf(x) === keyOf(c))) {
    cities.unshift(c);
    if (cities.length > 8) cities.pop();
  }
  renderList(cache);
  $("status").className = "status";
  $("status").textContent = "Updating…";
  try {
    const data = await fetchWeather(c);
    cache.set(keyOf(c), data);
    renderList(cache);
    renderMain(data, true);
  } catch (err) {
    const fb = cache.get(keyOf(c)) || fallbackFor(c);
    cache.set(keyOf(c), fb);
    renderList(cache);
    renderMain(fb, false);
  }
}

function select(c) { load(c); }

function setUnit(next) {
  unit = next;
  localStorage.setItem("atmos-unit", next);
  renderList(cache);
  if (snap) renderMain(snap, $("status").textContent.startsWith("Live"));
}
$("uC").onclick = () => setUnit("c");
$("uF").onclick = () => setUnit("f");

const q = $("q");
const box = $("suggest");

function closeSuggest() { box.classList.remove("open"); box.innerHTML = ""; suggestItems = []; suggestI = -1; }

async function searchCities(term) {
  const url = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(term) + "&count=6&language=en&format=json";
  const res = await fetch(url);
  if (!res.ok) throw new Error("search failed");
  const json = await res.json();
  return (json.results || []).map((r) => ({
    name: r.name,
    country: r.admin1 ? r.admin1 + ", " + (r.country || "") : (r.country || ""),
    lat: r.latitude,
    lon: r.longitude
  }));
}

let searchTimer = 0;
q.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const term = q.value.trim();
  if (term.length < 2) { closeSuggest(); return; }
  searchTimer = setTimeout(async () => {
    try {
      suggestItems = await searchCities(term);
      suggestI = -1;
      if (!suggestItems.length) { closeSuggest(); return; }
      box.innerHTML = suggestItems.map((c, i) => `<button type="button" role="option" data-i="${i}">${c.name}<span style="color:var(--mute)"> · ${c.country}</span></button>`).join("");
      box.classList.add("open");
      box.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => pick(Number(b.dataset.i))));
    } catch {
      closeSuggest();
    }
  }, 220);
});

function pick(i) {
  const c = suggestItems[i];
  if (!c) return;
  q.value = "";
  closeSuggest();
  select(c);
}

q.addEventListener("keydown", (e) => {
  if (!box.classList.contains("open")) {
    if (e.key === "Enter" && suggestItems[0]) pick(0);
    return;
  }
  if (e.key === "ArrowDown") { e.preventDefault(); suggestI = Math.min(suggestItems.length - 1, suggestI + 1); paintActive(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); suggestI = Math.max(0, suggestI - 1); paintActive(); }
  else if (e.key === "Enter") { e.preventDefault(); pick(suggestI >= 0 ? suggestI : 0); }
  else if (e.key === "Escape") closeSuggest();
});

function paintActive() {
  box.querySelectorAll("button").forEach((b, i) => b.classList.toggle("active", i === suggestI));
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".search")) closeSuggest();
});

$("locate").addEventListener("click", () => {
  if (!navigator.geolocation) {
    $("status").className = "status err";
    $("status").textContent = "This browser cannot share a location";
    return;
  }
  $("status").textContent = "Finding your location…";
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    let name = "My location", country = lat.toFixed(2) + ", " + lon.toFixed(2);
    try {
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
      const j = await r.json();
      name = j.city || j.locality || j.principalSubdivision || name;
      country = j.countryName || country;
    } catch {}
    select({ name, country, lat, lon });
  }, () => {
    $("status").className = "status err";
    $("status").textContent = "Location permission was declined";
  }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
});

setInterval(() => {
  if (!snap) return;
  const tz = snap.timezone || snap.tz;
  $("when").textContent = clockIn(tz);
}, 15000);

(function dust() {
  const c = $("dust");
  const ctx = c.getContext("2d");
  let w, h, pts;
  function resize() {
    w = c.width = c.clientWidth * devicePixelRatio;
    h = c.height = c.clientHeight * devicePixelRatio;
    pts = Array.from({length: 70}, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.6 * devicePixelRatio + .3,
      a: Math.random() * .35 + .05,
      v: Math.random() * .12 + .03
    }));
  }
  resize();
  addEventListener("resize", resize);
  function tick() {
    ctx.clearRect(0, 0, w, h);
    for (const p of pts) {
      p.y -= p.v; if (p.y < 0) p.y = h;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${p.a})`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

renderList();
load(current);
</script>
</body>
</html>
