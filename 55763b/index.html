<title>WWI 生字 1–17 默書教學片</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0c0c;--muted:#505a5f;--line:#b1b4b6;--blue:#1d4ed8;--red:#d4351c;--hi:#ffdd00}
*{box-sizing:border-box}
html{color-scheme:light;background:#fff;font-size:17px}
body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans HK",Arial,sans-serif;line-height:1.6}
.top{background:#fff;border-bottom:6px solid #1d70b8;padding:9px 16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-weight:900;color:#fff;background:#1d70b8;border-radius:4px;padding:2px 12px}
.sec{font-weight:900;color:#1d70b8}
.num{color:var(--muted);font-size:.85rem}
.legend{font-size:.86rem}
.ctrl{margin-left:auto;display:flex;gap:8px}
.ctrl button{font-family:inherit;font-size:.9rem;font-weight:700;padding:7px 13px;border:2px solid var(--ink);background:#fff;border-radius:4px;cursor:pointer}
.ctrl button.main{background:var(--ink);color:#fff}
#zhbtn{display:none!important}#zhbtn.on{background:#b8860b;border-color:#b8860b;color:#fff}
.say{font-size:1.1rem;font-weight:700;margin:7px 0 0;min-height:2.6em}
.zh{display:none;color:#6b4e16;font-size:.9rem;font-weight:500;background:#fff8e6;border-radius:4px;padding:2px 8px;margin:3px 0}
body.zhon .zh{display:block}
.grid{display:grid;grid-template-columns:1.05fr 1.2fr .75fr;gap:12px;padding:10px 14px}
.col{display:flex;flex-direction:column;min-height:0}
.col h2{font-size:.92rem;font-weight:900;margin:0 0 6px}
.col h2 span{font-weight:400;color:var(--muted);margin-left:6px;font-size:.8rem}
.cam{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#eef0f1;min-height:360px}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;display:none;transition:width var(--tc,.8s) cubic-bezier(.4,0,.2,1),transform var(--tc,.8s) cubic-bezier(.4,0,.2,1)}
.stage.on{display:block}
.stage img{display:block;width:100%;height:auto}
.box{position:absolute;border-radius:4px;border:3px solid transparent;transition:all .35s;pointer-events:none}
.box.hl{border-color:var(--hi);background:rgba(255,221,0,.28);animation:pulse 1.2s infinite}
.box.flash{border-color:#ff00aa;background:rgba(255,0,170,.2)}
.box.hl,.box.flash{pointer-events:auto;cursor:pointer}.exgo{display:block;margin:6px 0 2px;border:2px solid var(--ink);background:#fff8e6;border-radius:6px;font-weight:800;padding:4px 8px;cursor:pointer;font-size:.85rem}.exgo:hover{background:#ffe9a8}
.hot,.qhot{position:absolute;cursor:pointer;border-radius:4px}.qhot:hover{background:rgba(0,120,255,.05)}.hot:hover{background:rgba(0,120,255,.14);outline:2px dashed rgba(0,90,200,.6)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,221,0,0)}50%{box-shadow:0 0 0 7px rgba(255,221,0,.4)}}
.ans{position:absolute;color:#d4001e;font-family:"Noto Sans HK","PingFang TC","Microsoft JhengHei",Arial,sans-serif;white-space:nowrap;line-height:1;display:flex;align-items:center;cursor:pointer;border-radius:3px}
.ans:hover{background:rgba(255,246,207,.8)}
.ans.circ{border:0;cursor:pointer}
.ans.circ::after{content:"";position:absolute;inset:-6% -4%;border:2.5px solid #d4001e;border-radius:50%;opacity:0;transform:scale(.4);transition:opacity .35s,transform .45s}
.ans.circ.on::after{opacity:1;transform:scale(1)}
.ans.now{outline:3px solid #ff00aa;outline-offset:2px}
.caret{display:inline-block;width:2px;height:.95em;background:var(--ink);margin-left:1px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.teach{border:3px solid var(--red);border-radius:12px;padding:9px 12px;background:#fff;font-size:.98rem;min-height:120px;transition:box-shadow .3s;margin-bottom:10px;overflow:auto;max-height:42%}
.teach .bh{font-weight:900;color:var(--red);font-size:.8rem;margin-bottom:3px}
.teach.on{box-shadow:0 0 0 6px rgba(212,53,28,.18)}
.board{border-radius:8px;padding:10px;background:#d9b98a;box-shadow:inset 0 0 0 3px #b8935f;display:flex;flex-direction:column;gap:9px;overflow:auto}
.bempty{font-size:.86rem;color:#5a4526}
.note{border-radius:4px;padding:6px 8px;box-shadow:0 3px 8px rgba(0,0,0,.22);font-size:.84rem;font-weight:700;line-height:1.4;cursor:pointer;background:#ffd9d3}
.note:nth-child(odd){transform:rotate(-.8deg)}.note:nth-child(even){transform:rotate(.8deg)}
.note i{font-style:normal;font-size:.68rem;color:#fff;background:var(--red);border-radius:3px;padding:0 5px;margin-right:5px}
.fly{position:fixed;z-index:60;background:var(--hi);border:2px solid var(--ink);border-radius:5px;padding:4px 10px;font-size:.9rem;font-weight:700;max-width:320px;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:left var(--tf,.9s) cubic-bezier(.5,0,.2,1),top var(--tf,.9s) cubic-bezier(.5,0,.2,1),opacity .3s}
.expop{position:fixed;z-index:70;width:min(390px,92vw);background:#fff;border:3px solid var(--ink);border-radius:10px;padding:10px 14px 12px;box-shadow:0 12px 30px rgba(0,0,0,.25);font-size:.92rem;line-height:1.5}
.exh{font-weight:900;color:#d4001e;margin-right:30px}
.exl{font-size:.72rem;font-weight:900;color:var(--muted);margin-top:8px}
.exl.bad{color:var(--red)}
.exw{font-weight:700}
.exz{color:#6b4e16;background:#fff8e6;border-radius:4px;padding:2px 6px;margin-top:3px;font-size:.88rem}
.exo,.exa{margin:2px 0 0;padding-left:18px}.exo li{color:#00703c;font-weight:700}.exa li{color:var(--red)}
.exzi{color:#6b4e16;font-weight:500}
.exx{position:absolute;right:8px;top:6px;border:2px solid var(--ink);background:#fff;border-radius:4px;font-weight:900;cursor:pointer;font-family:inherit}
.player{background:#0b0c0c;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.player button{font-family:inherit;font-size:1rem;font-weight:900;width:42px;height:34px;border:0;border-radius:4px;background:#fff;color:#0b0c0c;cursor:pointer}
.track{position:relative;flex:1;height:12px;background:#444;border-radius:999px;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hi);border-radius:999px}
.knob{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:3px solid var(--hi);left:0}
.tick{position:absolute;top:-4px;width:2px;height:20px;background:#888}
.tick span{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:.7rem;color:#ddd;font-weight:900}
.ptime{font-size:.85rem;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.spdwrap{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:900}
.spdwrap input{width:120px;accent-color:#ffdd00;cursor:pointer}

.zoom{position:fixed;z-index:70;background-repeat:no-repeat;background-color:#fff;border:5px solid var(--hi);border-radius:6px;box-shadow:0 14px 44px rgba(0,0,0,.45);pointer-events:none;
  transition:left var(--tz,.6s) cubic-bezier(.4,0,.2,1),top var(--tz,.6s) cubic-bezier(.4,0,.2,1),width var(--tz,.6s) cubic-bezier(.4,0,.2,1),height var(--tz,.6s) cubic-bezier(.4,0,.2,1)}
.zoomcap{position:fixed;z-index:71;background:#0b0c0c;color:#fff;font-weight:900;font-size:1.05rem;padding:6px 12px;border-radius:4px;pointer-events:none;transition:opacity .3s;max-width:700px}
.zoomcap .zc{display:block;font-weight:500;font-size:.9rem;color:#ffe9a8}
.note.ev{background:#fff3a3}
.note .crop{width:100%;background-repeat:no-repeat;background-color:#fff;border:1px solid rgba(0,0,0,.2);border-radius:2px;margin-bottom:4px}
.note .evz{display:block;font-weight:500;color:#6b4e16;font-size:.78rem}
@media (min-width:1101px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .top{flex:none}.grid{flex:1;min-height:0}.col{height:100%}
  .cam,.board{flex:1;min-height:0}
  .player{flex:none}
}
@media (max-width:1100px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:720px){.grid{grid-template-columns:1fr}.cam{min-height:420px}}

<script id="dtap-js">
(function(){var last=0,lx=-99,ly=-99;
document.addEventListener("touchend",function(e){
 var t=Date.now(),p=e.changedTouches&&e.changedTouches[0],x=p?p.clientX:0,y=p?p.clientY:0,el=e.target,ptr=false;
 try{ptr=!!(el&&el.nodeType===1&&(el.closest("button,a,input,select,textarea,label,[role=button],[onclick]")||getComputedStyle(el).cursor==="pointer"));}catch(_){}
 if(t-last<350&&Math.abs(x-lx)<45&&Math.abs(y-ly)<45&&!ptr&&e.cancelable){e.preventDefault();}

   if(cam==="tcam"){lastT=[kp[0],kp[1]];$("tbname").textContent=TB[kp[0]].name;}else{lastW=[kp[0],kp[1]];$("wbname").textContent=WB[kp[0]].name;}
   focusCam(cam,kp[0],kp[1]);var e=markEl(k);if(e){e.classList.add("flash");setTimeout(function(){e.classList.remove("flash");},5000);}}
 function run(n,onDone){
   clearAll();token++;var my=token;cur=Math.max(0,Math.min(STEPS.length-1,n));stepT0=Date.now();if(paused)pauseAt=stepT0;
   var s=STEPS[cur];
   $("tag").textContent=s.tag;$("sec").textContent=s.sec||"";$("say").textContent=s.say;$("sayzh").textContent=s.say_zh||"";$("num").textContent=cur+" / "+(STEPS.length-1);
   $("prev").disabled=cur===0;$("next").disabled=cur===STEPS.length-1;
   fillInstant(cur);boardUpTo(cur);setView(s);$("teachtext").textContent=s.teach?"":"先看左邊黃色框，再看紅字寫去哪一格。";$("teachzh").textContent=s.teach?"":"留意左邊黃色框,再看答案去哪一格。";
   later(function(){
     if(my!==token)return;var k=0,fills=s.fills||[];
     function finish(){if(onDone)later(function(){if(my===token)onDone();},1400);}
     function nextFill(){
       if(my!==token)return;if(k>=fills.length){finish();return;}
       var f=fills[k++];

     }
     var nk=(s.tbmark||[]).concat(s.wbmark||[]).filter(function(k){return MSTEP[k]===cur&&LABEL[k];}),ni=0;
     function nextZoom(){if(my!==token)return;if(ni<nk.length){zoomNote(nk[ni++],my,function(){later(nextZoom,200);});return;}if(s.teach)teach(s.teach,s.teach_zh,my,nextFill);else nextFill();}
     nextZoom();
   },900);
 }
 function closeEx(){var d=$("expop");if(d)d.remove();}

   var r=anchor.getBoundingClientRect(),W=d.offsetWidth,H=d.offsetHeight,x=Math.min(innerWidth-W-10,Math.max(10,r.left)),y=r.bottom+8;if(y+H>innerHeight-70)y=Math.max(10,r.top-H-8);

 document.addEventListener("click",function(e){var d=$("expop");if(d&&!d.contains(e.target))closeEx();});

   setPlay(false);closeEx();var L=LABEL[k]||[k,""];
   var uses=Object.keys(FILLS).map(function(i){return FILLS[i];}).filter(function(f){return f.from===k;});
   var d=document.createElement("div");d.className="expop";d.id="expop";
   var h='<button class="exx" id="exx">✕</button><div class="exh" style="color:#0b0c0c">'+esc(L[0])+'</div>';
   if(L[1])h+='<div class="exz">中文:'+esc(L[1])+'</div>';
   STEPS.forEach(function(ss){var mx=ss.markex&&ss.markex[k];if(mx){h+='<div class="exl">About this line 這一句</div><div class="exw">'+esc(mx.why)+'</div>'+(mx.why_zh?'<div class="exz">'+esc(mx.why_zh)+'</div>':'');}});var cs=STEPS[cur];if(cs&&(cs.tbmark||[]).concat(cs.wbmark||[]).indexOf(k)>=0)h+='<div class="exl">In this step</div><div class="exw">'+esc(cs.say||"")+'</div>'+(cs.say_zh?'<div class="exz">'+esc(cs.say_zh)+'</div>':"");

   if(uses.length){uses.forEach(function(f){var ex=f.ex||{};
     h+='<div class="exw">→ '+esc(f.q||"")+': <span style="color:#d4001e">'+esc(f.text)+'</span></div>'+(ex.why?'<div>'+esc(ex.why)+'</div>':'')+(ex.why_zh?'<div class="exz">'+esc(ex.why_zh)+'</div>':'')+'<button class="exgo" data-id="'+f.id+'">Show me this answer 看這個答案</button>';});}
   else h+='<div class="exw">This is the part the question is about. Look here first, then read the question again.</div><div class="exz">這是題目在問的地方。先看這裡,再讀一次題目。</div>';

 }
 document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest(".box.hl,.box.flash");if(b)showMark(b.id.slice(3),b);});
 function setBox(d,b){d.style.left=(b[0]*100)+"%";d.style.top=(b[2]*100)+"%";d.style.width=((b[1]-b[0])*100)+"%";d.style.height=((b[3]-b[2])*100)+"%";}
 function placePop(d,anchor){document.body.appendChild(d);var r=anchor.getBoundingClientRect(),W=d.offsetWidth,H=d.offsetHeight,x=Math.min(innerWidth-W-10,Math.max(10,r.left)),y=r.bottom+8;if(y+H>innerHeight-70)y=Math.max(10,r.top-H-8);
   d.style.left=x+"px";d.style.top=y+"px";var xb=d.querySelector("#exx");if(xb)xb.onclick=function(e){e.stopPropagation();closeEx();};
   d.querySelectorAll(".exgo").forEach(function(b){b.onclick=function(e){e.stopPropagation();var id=b.getAttribute("data-id");closeEx();locate(id);};});}
 function fillBlock(f){var ex=f.ex||{};return '<div class="exl">Answer '+esc(f.q||"")+'</div><div class="exw" style="color:#d4001e">'+esc(f.text)+'</div>'+(ex.why?'<div>'+esc(ex.why)+'</div>':'')+(ex.why_zh?'<div class="exz">'+esc(ex.why_zh)+'</div>':'')+'<button class="exgo" data-id="'+f.id+'">Show me this answer 看這個答案</button>';}
 function showQ(si,anchor){setPlay(false);closeEx();var s=STEPS[si],d=document.createElement("div");d.className="expop";d.id="expop";
   var h='<button class="exx" id="exx">✕</button><div class="exh" style="color:#0b0c0c">'+esc(s.tag)+'</div><div class="exw">'+esc(s.say||"")+'</div>'+(s.say_zh?'<div class="exz">'+esc(s.say_zh)+'</div>':"");

 function showHot(si,hi,anchor){setPlay(false);closeEx();var hh=STEPS[si].hot[hi],f=hh.fill?FILLS[hh.fill]:null,d=document.createElement("div");d.className="expop";d.id="expop";

 STEPS.forEach(function(s,si){(s.hot||[]).forEach(function(hh,hi){var st=$("st_"+s.wb);if(!st)return;var d=document.createElement("div");d.className="hot";setBox(d,hh.box);d.setAttribute("data-si",si);d.setAttribute("data-hi",hi);st.querySelector("img").after(d);});});
 STEPS.forEach(function(s,si){if(!s.wb||!s.wbfocus)return;var st=$("st_"+s.wb);if(!st)return;var d=document.createElement("div");d.className="qhot";setBox(d,[s.wbfocus[0],s.wbfocus[2],s.wbfocus[1],s.wbfocus[3]]);d.setAttribute("data-si",si);st.querySelector("img").after(d);});

 function locate(id){setPlay(false);var i=FSTEP[id];if(i>=cur)go(i+1);else{var s=STEPS[i];setView(s);}var a=$("an_"+id);if(a)setTimeout(function(){showExplain(id,a);},450);}
 var ended=false;

 function setPlay(on){playing=on;$("play").textContent=on?"❚❚ 暫停":"▶ 播放";$("pp").textContent=on?"❚❚":"▶";if(on)unfreeze();else freeze();}

 document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);if(e.key===" "){e.preventDefault();$("play").onclick();}});
 var EST=STEPS.map(function(s,si){var t=2.3;(s.tbmark||[]).concat(s.wbmark||[]).forEach(function(k){if(MSTEP[k]===si&&LABEL[k])t+=3.15;});if(s.teach)t+=s.teach.length*0.02+0.9;(s.fills||[]).forEach(function(f){t+=0.25+(f.kind==="circle"?0.9:f.text.length*(f.text.length>40?0.014:0.045)+0.3);if(f.from)t+=1.12;if(f.teach)t+=f.teach.length*0.02+0.9;});t+=1.4;return Math.max(t,3.2);});
 var START=[],TOTAL=0;EST.forEach(function(e){START.push(TOTAL);TOTAL+=e;});
 var lastSec="";STEPS.forEach(function(s,i){if(!i)return;var k=document.createElement("div");k.className="tick";k.style.left=(START[i]/TOTAL*100)+"%";if(s.sec&&s.sec!==lastSec){var sp=document.createElement("span");sp.textContent=s.sec.charAt(0);k.appendChild(sp);k.style.background="#ffdd00";lastSec=s.sec;}$("track").appendChild(k);});
 function fmt(s){s=Math.max(0,Math.floor(s));return("0"+Math.floor(s/60)).slice(-2)+":"+("0"+(s%60)).slice(-2);}
 function nowT(){return START[cur]+Math.min(EST[cur],((paused?pauseAt:Date.now())-stepT0)/1000*SPEED);}
 setInterval(function(){var t=nowT();$("fill").style.width=(t/TOTAL*100)+"%";$("knob").style.left=(t/TOTAL*100)+"%";$("ptime").textContent=fmt(t)+" / "+fmt(TOTAL);},200);
 function seekFrac(f){var t=f*TOTAL,i=0;for(var j=0;j<START.length;j++)if(START[j]<=t)i=j;return i;}
 var dragging=false;
 function fracOf(e){var r=$("track").getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));}
 $("track").addEventListener("pointerdown",function(e){dragging=true;$("track").setPointerCapture(e.pointerId);var f=fracOf(e);$("knob").style.left=(f*100)+"%";});
