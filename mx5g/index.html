<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1a16">
<title>第5組｜孟子·仁愛謙和 · HTML簡報＋轉盤遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<img class="fx-burst" id="burstImg" src="./assets/burst.gif" alt="" hidden>
<img class="fx-confetti" id="confettiImg" src="./assets/confetti.png" alt="" hidden>

<header class="topbar">
  <div class="brand">
    <span class="mark"></span>
    <div>
      <strong>3G 第5組 · 孟子</strong>
      <small>好玩例子 · 轉盤抽人 · 彈出問答</small>
    </div>
  </div>
  <nav class="modes">
    <button type="button" class="mode on" data-mode="deck">簡報</button>
    <button type="button" class="mode" data-mode="game">轉盤遊戲</button>
  </nav>
  <div class="progress" id="progress"><i></i></div>
</header>

<main id="deck" class="stage"></main>

<section id="game" class="game hidden" aria-label="轉盤抽人問答">
  <div class="wheel-only">
    <div class="wheel-wrap big">
      <img class="wheel-glow" src="./assets/wheel-glow.png" alt="">
      <div class="pointer"></div>
      <canvas id="wheel" width="560" height="560"></canvas>
      <div class="hub">
        <span>抽座號</span>
        <b id="pickedNum">?</b>
      </div>
    </div>
    <div class="wheel-actions">
      <button type="button" class="btn primary big" id="spinBtn">轉盤抽人</button>
      <button type="button" class="btn ghost" id="reshuffleBtn">重設 1–30</button>
    </div>
    <p class="hintline">抽中 → 問題＋提示彈出 → 撳掣睇答案／近似 → 5 秒自動返轉盤</p>
    <p class="scoreline">累積分：<b id="scorePill">0</b> · 已玩 <b id="qIndex">0</b> 題</p>
  </div>
</section>

<!-- Popup 1: question + hint -->
<div class="modal" id="qModal" hidden>
  <div class="modal-card pop-in">
    <div class="modal-top">
      <span class="pill" id="diffPill">易</span>
      <span class="who-badge" id="whoBadge">座號 ?</span>
    </div>
    <h2 id="qTitle">問題</h2>
    <div class="choices" id="choices"></div>
    <div class="hint-box">
      <div class="hint-label">提示（已顯示）</div>
      <p id="hintText"></p>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn accent big" id="showAnswerBtn">揭曉正確答案＋近似答案</button>
    </div>
  </div>
</div>

<!-- Popup 2: final + near answers -->
<div class="modal" id="aModal" hidden>
  <div class="modal-card answer pop-in">
    <div class="modal-top">
      <span class="pill soft">答案卡</span>
      <span class="countdown" id="countdown">5 秒後返回轉盤</span>
    </div>
    <h2>正確答案</h2>
    <p class="final-ans" id="revealText"></p>
    <h3>近似答案（這樣講都 OK）</h3>
    <p class="near-ans" id="nearText"></p>
    <p class="explain" id="explainText"></p>
    <div class="modal-actions">
      <button type="button" class="btn primary" id="backNowBtn">立刻返回轉盤</button>
    </div>
    <div class="bar"><i id="cdBar"></i></div>
  </div>
</div>

<footer class="deck-nav" id="deckNav">
  <button type="button" class="btn ghost" id="prevBtn">上一頁</button>
  <span id="pageLabel">1 / 1</span>
  <button type="button" class="btn primary" id="nextBtn">下一頁</button>
  <button type="button" class="btn accent" id="toGameBtn">開始轉盤遊戲 →</button>
</footer>

<script src="./questions.js"></script>
<script src="./app.js"></script>
</body>
</html>
