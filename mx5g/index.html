<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="孟子簡報">
<meta name="theme-color" content="#0f1a16">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<title>3G 第5組｜孟子 · 簡報＋轉盤</title>
<link rel="stylesheet" href="./style.css?v=20251123e">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark"></span>
    <div>
      <strong>3G 第5組 · 孟子</strong>
      <small>仁愛謙和 · 轉盤問答</small>
    </div>
  </div>
  <nav class="modes">
    <button type="button" class="mode on" id="modeDeck">簡報</button>
    <button type="button" class="mode" id="modeGame">轉盤</button>
  </nav>
  <button type="button" class="mode gold" data-fs-btn>全螢幕</button>
  <div class="progress"><i id="progressBar"></i></div>
</header>

<main id="deck" class="stage"></main>

<section id="game" class="game is-hide" aria-label="轉盤">
  <div class="wheel-only">
    <div class="wheel-wrap">
      <img class="wheel-glow" src="./assets/wheel-glow.png" alt="">
      <div class="pointer"></div>
      <canvas id="wheel" width="560" height="560"></canvas>
      <div class="hub" id="hub">
        <span>抽座號</span>
        <b id="pickedNum">?</b>
      </div>
    </div>
    <div class="wheel-actions">
      <button type="button" class="btn primary big" id="spinBtn">轉盤抽人</button>
      <button type="button" class="btn ghost" id="reshuffleBtn">重設 1–30</button>
    </div>
    <p class="hintline">抽中 → 問題＋提示 → 揭曉答案／近似 → 5 秒返轉盤</p>
    <p class="scoreline">累積分：<b id="scorePill">0</b> · 已玩 <b id="playedPill">0</b> 題</p>
  </div>
</section>

<div class="modal is-hide" id="qModal">
  <div class="modal-card">
    <div class="modal-top">
      <span class="pill" id="diffPill">易</span>
      <span class="who-badge" id="whoBadge">座號 ?</span>
    </div>
    <h2 id="qTitle">問題</h2>
    <div class="choices" id="choices"></div>
    <div class="hint-box">
      <div class="hint-label">提示</div>
      <p id="hintText"></p>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn accent big" id="showAnswerBtn">揭曉正確答案＋近似答案</button>
    </div>
  </div>
</div>

<div class="modal is-hide" id="aModal">
  <div class="modal-card answer">
    <div class="modal-top">
      <span class="pill soft">答案卡</span>
      <span class="countdown" id="countdown">5 秒後返回轉盤</span>
    </div>
    <h2>正確答案</h2>
    <p class="final-ans" id="revealText"></p>
    <h3>近似答案（這樣講都 OK）</h3>
    <p class="near-ans" id="nearText"></p>
    <p class="explain" id="explainText"></p>
    <div class="modal-actions">
      <button type="button" class="btn primary" id="backNowBtn">立刻返回轉盤</button>
    </div>
    <div class="bar"><i id="cdBar"></i></div>
  </div>
</div>

<footer class="deck-nav" id="deckNav">
  <button type="button" class="btn ghost" id="prevBtn">上一頁</button>
  <span id="pageLabel">1 / 1</span>
  <button type="button" class="btn primary" id="nextBtn">下一頁</button>
  <button type="button" class="btn accent" id="toGameBtn">轉盤 →</button>
  <button type="button" class="btn gold" data-fs-btn>全螢幕</button>
</footer>

<div id="ipadHelp" role="dialog" aria-modal="true" aria-labelledby="ipadHelpTitle">
  <div class="sheet">
    <h2 id="ipadHelpTitle">iPad 全螢幕</h2>
    <p>Safari 有時擋網頁全螢幕。最穩：分享 → <strong>加入主畫面</strong> → 再開「孟子簡報」。</p>
    <div class="row">
      <button type="button" class="btn primary" id="ipadHelpTry">再試一次</button>
      <button type="button" class="btn ghost" id="ipadHelpClose">關閉</button>
    </div>
  </div>
</div>

<script src="./questions.js?v=20251123e"></script>
<script src="./fs.js?v=20251123e"></script>
<script src="./app.js?v=20251123e"></script>
<script>
  if (window.MX5FS) MX5FS.wire();
</script>
</body>
</html>
