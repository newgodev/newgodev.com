<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>因式分解 · hw video</title>
<meta name="theme-color" content="#14110d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Spline+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  font-size:21px;
  --bg:#14110d; --panel:#0f0c09; --line:#2c241a;
  --gold:#e7b173; --gold2:#f3cf99; --gold3:#c98e4a;
  --mtl:#FCBC24; --mtl2:#FFF3C9; --mtl3:#E0A310;
  --ink:#efe4d6; --dim:rgba(164,148,129,.85);
  --paper:#fbf4e6; --paperink:#2a2015;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Spline Sans",system-ui,-apple-system,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:max(20px,env(safe-area-inset-top)) 18px 30px;-webkit-font-smoothing:antialiased}
a.back{align-self:flex-start;color:var(--gold3);text-decoration:none;font-family:"JetBrains Mono",monospace;
  font-size:.82rem;margin-bottom:14px;-webkit-tap-highlight-color:transparent}
.title{font-family:"Fraunces",serif;font-weight:800;font-size:1.5rem;margin:0 0 4px;text-align:center;
  background:linear-gradient(180deg,var(--mtl2),var(--mtl),var(--mtl3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:.82rem;margin:0 0 16px;font-family:"JetBrains Mono",monospace;text-align:center}
.player{width:100%;max-width:820px;background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.5)}
.stage{position:relative;aspect-ratio:16/10;background:radial-gradient(120% 120% at 50% 0%,#20180f,#0b0906);overflow:hidden}
.paper{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transition:transform .8s cubic-bezier(.5,0,.2,1);transform-origin:center;will-change:transform}
.sheet{background:var(--paper);color:var(--paperink);border-radius:10px;padding:26px 30px;
  font-family:"Fraunces",serif;box-shadow:0 10px 30px rgba(0,0,0,.5);width:min(560px,88%)}
.sheet .q{font-size:1.4rem;font-weight:600;margin-bottom:16px}
.line{font-size:1.4rem;margin:11px 0;opacity:.18;transition:opacity .5s;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.line.on{opacity:1}
.line .why{font-family:"Spline Sans",sans-serif;font-size:.72rem;color:#8a6d3f}
.hl{background:linear-gradient(transparent 55%,#ffe08a 55%);padding:0 3px;border-radius:3px}
.pair{color:#b8791f;font-weight:800}
.brain{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(18,14,9,.86);
  border:1px solid var(--gold3);border-radius:12px;padding:11px 15px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  color:var(--gold2);font-size:.86rem;opacity:0;transform:translateY(10px);transition:.45s}
.brain.on{opacity:1;transform:none}
.brain b{color:var(--mtl2)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 13px;background:#0d0a07;border-top:1px solid var(--line)}
.pp{width:42px;height:42px;flex:0 0 auto;border:none;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,var(--mtl),var(--mtl3));display:grid;place-items:center}
.pp svg{width:18px;height:18px;fill:#1a1206}
.track{flex:1;height:8px;background:#241c12;border-radius:99px;position:relative;cursor:pointer;touch-action:none}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--gold3),var(--mtl));border-radius:99px}
.tnum{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--dim);min-width:72px;text-align:right}
.spd{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--gold2);background:#241c12;border:1px solid var(--line);
  border-radius:8px;padding:5px 9px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.note{max-width:820px;color:var(--dim);font-size:.78rem;margin-top:14px;text-align:center;font-family:"JetBrains Mono",monospace}
</style>
</head>
<body>
<a class="back" href="../">← 返 hw video</a>
<h1 class="title">因式分解 x² + 5x + 6</h1>
<p class="sub">示範片 · 撳播放,鏡頭會帶你一步一步睇</p>

<div class="player">
  <div class="stage">
    <div class="paper" id="paper">
      <div class="sheet">
        <div class="q">因式分解:x² + 5x + 6</div>
        <div class="line" data-t="0">x² + 5x + 6</div>
        <div class="line" data-t="1">搵兩個數,<span class="pair">相乘 = 6</span>,<span class="pair">相加 = 5</span> <span class="why">← 尾同中間</span></div>
        <div class="line" data-t="2">2 × 3 = <span class="hl">6</span>,2 + 3 = <span class="hl">5</span> <span class="why">← 就係 2 同 3</span></div>
        <div class="line" data-t="3">= (x + <span class="pair">2</span>)(x + <span class="pair">3</span>) <span class="why">← 答案</span></div>
      </div>
    </div>
    <div class="brain" id="brain"><b>你的腦這樣想:</b> <span id="btext">x² + 5x + 6 呢種,尾嗰個數(6)係兩個數相乘,中間嗰個(5)係佢哋相加。搵到就填入去。</span></div>
  </div>
  <div class="bar">
    <button class="pp" id="pp" aria-label="播放"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <div class="tnum" id="tnum">0:00 / 3:20</div>
    <button class="spd" id="spd">1×</button>
  </div>
</div>
<p class="note">真暫停 · 可調速 · 呢個係示範。真功課會做成自己一條隨機網址。</p>

<script>
(function(){
  var STEPS=[
    {brain:"先睇條題。x² + 5x + 6，我哋要拆返做兩個括號相乘。"},
    {brain:"規則:搵兩個數，相乘等於尾嗰個 6，相加等於中間嗰個 5。"},
    {brain:"試:2 × 3 = 6 ✓，2 + 3 = 5 ✓。就係佢哋。"},
    {brain:"填返入去:(x + 2)(x + 3)。搞掂。"}
  ];
  var DUR=[26,54,64,56], ZOOM=[1,1.12,1.28,1.12];
  var total=0; for(var k=0;k<DUR.length;k++) total+=DUR[k];
  var lines=[].slice.call(document.querySelectorAll(".line"));
  var paper=document.getElementById("paper"), brain=document.getElementById("brain"), btext=document.getElementById("btext");
  var fill=document.getElementById("fill"), tnum=document.getElementById("tnum");
  var pp=document.getElementById("pp"), track=document.getElementById("track"), spd=document.getElementById("spd");
  var cur=-1, t=0, playing=false, speed=1, last=0, raf=0;
  function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
  function stepAt(sec){var acc=0;for(var i=0;i<DUR.length;i++){acc+=DUR[i];if(sec<acc)return i;}return DUR.length-1;}
  function render(){
    var i=stepAt(t);
    if(i!==cur){cur=i;
      for(var k=0;k<lines.length;k++){ if(k<=i) lines[k].classList.add("on"); else lines[k].classList.remove("on"); }
      paper.style.transform="scale("+ZOOM[i]+")";
      brain.classList.remove("on"); void brain.offsetWidth; btext.textContent=STEPS[i].brain; brain.classList.add("on");
    }
    fill.style.width=(t/total*100)+"%";
    tnum.textContent=fmt(t)+" / "+fmt(total);
  }
  function loop(ts){
    if(!playing)return;
    if(!last)last=ts;
    t+=(ts-last)/1000*speed; last=ts;
    if(t>=total){t=total;playing=false;setIcon();render();return;}
    render(); raf=requestAnimationFrame(loop);
  }
  function setIcon(){ pp.innerHTML = playing
    ? '<svg viewBox="0 0 24 24" fill="#1a1206"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="#1a1206"><path d="M8 5v14l11-7z"/></svg>';
    pp.setAttribute("aria-label",playing?"暫停":"播放"); }
  function play(){ if(t>=total)t=0; playing=true; last=0; setIcon(); raf=requestAnimationFrame(loop); }
  function pause(){ playing=false; if(raf)cancelAnimationFrame(raf); setIcon(); }
  pp.addEventListener("click",function(){ playing?pause():play(); });
  track.addEventListener("click",function(e){ var r=track.getBoundingClientRect(); t=(e.clientX-r.left)/r.width*total; if(t<0)t=0; if(t>total)t=total; cur=-1; last=0; render(); });
  spd.addEventListener("click",function(){ var s=[1,1.5,2,.75]; speed=s[(s.indexOf(speed)+1)%s.length]; spd.textContent=speed+"×"; });
  render();
})();
</script>
</body>
</html>
