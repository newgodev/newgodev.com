.top{background:#fff;border-bottom:6px solid #1d70b8;padding:9px 16px}

.grid{display:grid;grid-template-columns:1.05fr 1.2fr .75fr;gap:12px;padding:10px 14px}
.col{display:flex;flex-direction:column;min-height:0}

.cam{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#eef0f1;min-height:360px}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;display:none;transition:width var(--tc,.8s) cubic-bezier(.4,0,.2,1),transform var(--tc,.8s) cubic-bezier(.4,0,.2,1)}
.stage.on{display:block}
.stage img{display:block;width:100%;height:auto}
.box{position:absolute;border-radius:4px;border:3px solid transparent;transition:all .35s;pointer-events:none}
.box.hl{border-color:var(--hi);background:rgba(255,221,0,.28);animation:pulse 1.2s infinite}
.box.flash{border-color:#ff00aa;background:rgba(255,0,170,.2)}
.box.hl,.box.flash{pointer-events:auto;cursor:pointer}.exgo{display:block;margin:6px 0 2px;border:2px solid var(--ink);background:#fff8e6;border-radius:6px;font-weight:800;padding:4px 8px;cursor:pointer;font-size:.85rem}.exgo:hover{background:#ffe9a8}
.hot,.qhot{position:absolute;cursor:pointer;border-radius:4px}.qhot:hover{background:rgba(0,120,255,.05)}.hot:hover{background:rgba(0,120,255,.14);outline:2px dashed rgba(0,90,200,.6)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,221,0,0)}50%{box-shadow:0 0 0 7px rgba(255,221,0,.4)}}

.ans:hover{background:rgba(255,246,207,.8)}
.ans.circ{border:0;cursor:pointer}
.ans.circ::after{content:"";position:absolute;inset:-6% -4%;border:2.5px solid #d4001e;border-radius:50%;opacity:0;transform:scale(.4);transition:opacity .35s,transform .45s}
.ans.circ.on::after{opacity:1;transform:scale(1)}
.ans.now{outline:3px solid #ff00aa;outline-offset:2px}
.caret{display:inline-block;width:2px;height:.95em;background:var(--ink);margin-left:1px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.teach{border:3px solid var(--red);border-radius:12px;padding:9px 12px;background:#fff;font-size:.98rem;min-height:120px;transition:box-shadow .3s;margin-bottom:10px;overflow:auto;max-height:42%}
.teach .bh{font-weight:900;color:var(--red);font-size:.8rem;margin-bottom:3px}
.teach.on{box-shadow:0 0 0 6px rgba(212,53,28,.18)}
.board{border-radius:8px;padding:10px;background:#d9b98a;box-shadow:inset 0 0 0 3px #b8935f;display:flex;flex-direction:column;gap:9px;overflow:auto}
.bempty{font-size:.86rem;color:#5a4526}
.note{border-radius:4px;padding:6px 8px;box-shadow:0 3px 8px rgba(0,0,0,.22);font-size:.84rem;font-weight:700;line-height:1.4;cursor:pointer;background:#ffd9d3}
.note:nth-child(odd){transform:rotate(-.8deg)}.note:nth-child(even){transform:rotate(.8deg)}

.exh{font-weight:900;color:#d4001e;margin-right:30px}
.exl{font-size:.72rem;font-weight:900;color:var(--muted);margin-top:8px}
.exl.bad{color:var(--red)}
.exw{font-weight:700}
.exz{color:#6b4e16;background:#fff8e6;border-radius:4px;padding:2px 6px;margin-top:3px;font-size:.88rem}
.exo,.exa{margin:2px 0 0;padding-left:18px}.exo li{color:#00703c;font-weight:700}.exa li{color:var(--red)}
.exzi{color:#6b4e16;font-weight:500}
.exx{position:absolute;right:8px;top:6px;border:2px solid var(--ink);background:#fff;border-radius:4px;font-weight:900;cursor:pointer;font-family:inherit}
.player{background:#0b0c0c;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.player button{font-family:inherit;font-size:1rem;font-weight:900;width:42px;height:34px;border:0;border-radius:4px;background:#fff;color:#0b0c0c;cursor:pointer}
.track{position:relative;flex:1;height:12px;background:#444;border-radius:999px;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hi);border-radius:999px}
.knob{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:3px solid var(--hi);left:0}
.tick{position:absolute;top:-4px;width:2px;height:20px;background:#888}
.tick span{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:.7rem;color:#ddd;font-weight:900}
.ptime{font-size:.85rem;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.spdwrap{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:900}
.spdwrap input{width:120px;accent-color:#ffdd00;cursor:pointer}

.zoom{position:fixed;z-index:70;background-repeat:no-repeat;background-color:#fff;border:5px solid var(--hi);border-radius:6px;box-shadow:0 14px 44px rgba(0,0,0,.45);pointer-events:none;
  transition:left var(--tz,.6s) cubic-bezier(.4,0,.2,1),top var(--tz,.6s) cubic-bezier(.4,0,.2,1),width var(--tz,.6s) cubic-bezier(.4,0,.2,1),height var(--tz,.6s) cubic-bezier(.4,0,.2,1)}
.zoomcap{position:fixed;z-index:71;background:#0b0c0c;color:#fff;font-weight:900;font-size:1.05rem;padding:6px 12px;border-radius:4px;pointer-events:none;transition:opacity .3s;max-width:700px}
.zoomcap .zc{display:block;font-weight:500;font-size:.9rem;color:#ffe9a8}
.note.ev{background:#fff3a3}
.note .crop{width:100%;background-repeat:no-repeat;background-color:#fff;border:1px solid rgba(0,0,0,.2);border-radius:2px;margin-bottom:4px}
.note .evz{display:block;font-weight:500;color:#6b4e16;font-size:.78rem}
@media (min-width:1101px){

@media (max-width:720px){.grid{grid-template-columns:1fr}.cam{min-height:420px}}

<div class="top">
  <div class="row">

var STEPS=[{"sec": "Start", "tag": "Start", "tb": "t23", "tbmark": ["ch2t"], "wb": "w3", "wbfocus": null, "say": "Tonight: Matilda Chapters 2 and 3 (book pages 23 to 45). Part A = 4 boxes about Mr Wormwood, Part B = 4 questions, Part C = 8 words to match. Every answer comes from a yellow box in the book.", "say_zh": "今晚:Matilda 第二、三章(書第23至45頁)。A 部分 = 關於 Mr Wormwood 的四個格,B 部分 = 四條問題,C 部分 = 八個生字配對。每個答案都來自書上的黃色框。", "fills": [], "hot": [{"box": [0.121, 0.591, 0.088, 0.127], "title": "Chapter 2 + Chapter 3", "why": "This page is only about Chapters 2 and 3 = book pages 23 to 45. Chapter 2 is about Dad's car tricks, Chapter 3 is the hat and the Superglue.", "why_zh": "這頁只考第二、三章 = 書第23至45頁。第二章講爸爸賣車的騙術,第三章講帽子和強力膠。"}], "teach": "No marks are printed, so the lines decide: Q1 asks two things = 2 sentences. Q2, Q3, Q4 = 1 sentence each. Diagram boxes = short notes, not sentences.", "teach_zh": "工作紙沒有寫分數,就看橫線:Q1 問兩樣嘢 = 兩句。Q2、Q3、Q4 各一句。圖表格仔 = 短筆記,不用寫句子。", "menu": "Start: how this works", "menu_zh": "開始:怎樣用", "mgrp": ""}, {"sec": "A Diagram", "tag": "A1 Appearance", "tb": "t25", "tbmark": ["looks"], "wb": "w3", "wbfocus": [0.11, 0.205, 0.41, 0.375], "say": "Box 1: his appearance = what he looks like. Page 25 describes him in one go: small and ratty-looking, teeth sticking out, a thin moustache, loud jackets and ties.", "say_zh": "第一格:his appearance = 他的外表。第25頁一次過描寫他:矮小、像老鼠、牙齒凸出、小鬍子、花俏的外套和領帶。", "fills": [{"id": "a1", "text": "• small, rat-like man", "zh": "矮小、像老鼠的男人", "q": "A1", "note": "Appearance: small, rat-like", "kind": "text", "from": "looks", "ex": {"why": "p.25: 'a small ratty-looking man'. ratty-looking = looks like a rat. In a diagram, short notes are enough.", "why_zh": "第25頁:「一個矮小、樣子像老鼠的男人」。圖表裏寫短筆記就夠。", "other": [["• a short man who looks like a rat", "一個像老鼠的矮小男人"]], "avoid": [["Mr Wormwood was a small ratty-looking man (copied word for word)", "整句照抄書本,AI/抄襲風險高"], ["• ugly (too vague, the book doesn't say it)", "太含糊,書沒有這樣寫"]]}, "rw": {"pg": "p.25", "src": "Mr Wormwood was a small ratty-looking man", "src_zh": "Mr Wormwood 是一個矮小、樣子像老鼠的男人", "keep": ["small", "man"], "swaps": [["Mr Wormwood was a", "(cut: the circle already names him)", "Mr Wormwood 是一個", "刪走:圓圈已經寫了他的名字"], ["ratty-looking", "rat-like", "樣子像老鼠", "像老鼠"]], "order": "", "order_zh": ""}, "box": [0.137, 0.247, 0.396, 0.2658], "ml": 1, "fs": 0.0162, "lh": 0.0252}, {"id": "a2", "text": "• front teeth stick out, thin\n   moustache", "zh": "門牙凸出,小鬍子", "q": "A1", "note": "Appearance: teeth, moustache", "kind": "text", "from": "looks", "ex": {"why": "Same sentence: his front teeth 'stuck out underneath a thin ratty moustache'. Face = your second note.", "why_zh": "同一句:門牙在小鬍子下面凸出來。臉部 = 第二點。", "other": [["• teeth stick out; thin moustache", "牙齒凸出;小鬍子"]], "avoid": [["• big teeth (the book says they stick out, not that they are big)", "書說牙齒凸出,不是大"]]}, "rw": {"pg": "p.25", "src": "whose front teeth stuck out underneath a thin ratty moustache", "src_zh": "他的門牙在一撇像老鼠的小鬍子下面凸出來", "keep": ["front teeth", "thin", "moustache"], "swaps": [["whose", "(cut)", "他的", "刪走"], ["stuck out underneath a", "stick out,", "在…下面凸出", "凸出"], ["ratty", "(cut: we already said rat-like)", "像老鼠的", "刪走:上一點已講"]], "order": "", "order_zh": "", "out": "• front teeth stick out, thin moustache"}, "box": [0.137, 0.2688, 0.396, 0.3054], "ml": 1, "fs": 0.0162, "lh": 0.0252}, {"id": "a3", "text": "• bright checked jacket, green tie", "zh": "顏色鮮艷的格仔外套,綠色領帶", "q": "A1", "note": "Appearance: clothes", "kind": "text", "from": "looks", "ex": {"why": "Clothes: 'jackets with large brightly coloured checks' and ties 'yellow or pale green'. Page 37 says it again: 'his loud checked jacket and green tie'.", "why_zh": "衣着:顏色鮮艷的格仔外套,黃色或淺綠色領帶。第37頁又講一次:花俏格仔外套和綠色領帶。", "other": [["• loud checked jackets, yellow or green ties", "花俏格仔外套,黃或綠色領帶"]], "avoid": [["• wears a suit (the book never says suit)", "書沒有說西裝"]]}, "rw": {"pg": "p.25", "src": "He liked to wear jackets with large brightly coloured checks and he sported ties that were usually yellow or pale green.", "src_zh": "他喜歡穿有大格仔、顏色鮮艷的外套,打的領帶通常是黃色或淺綠色。", "keep": [], "swaps": [["He liked to wear", "(cut)", "他喜歡穿", "刪走"], ["jackets with large brightly coloured checks", "bright checked jacket", "有大格仔、顏色鮮艷的外套", "鮮艷格仔外套"], ["and he sported ties that were usually yellow or pale", "(cut: one colour is enough)", "他打的領帶通常是黃色或淺", "刪走:一種顏色就夠"], ["green.", "green tie", "綠色", "綠色領帶"]], "order": "Notes style: thing + describing word, joined with a comma.", "order_zh": "筆記格式:形容詞 + 東西,用逗號分開。"}, "box": [0.137, 0.3084, 0.396, 0.3272], "ml": 1, "fs": 0.0162, "lh": 0.0252}], "hot": [{"box": [0.121, 0.66, 0.152, 0.1695], "title": "Part A: the diagram", "why": "Fill the 4 boxes with short notes, not full sentences. 2 or 3 notes in each box is enough.", "why_zh": "四個格寫短筆記,不用完整句子。每格兩三點就夠。"}, {"box": [0.1496, 0.284, 0.2245, 0.2402], "title": "His appearance", "why": "Appearance = what he looks like: body, face, clothes.", "why_zh": "外表 = 他的樣子:身形、樣貌、衣着。", "fill": "a1"}, {"box": [0.4067, 0.5357, 0.4168, 0.4326], "title": "Mr Wormwood", "why": "The centre of the diagram = Matilda's father, the second-hand car dealer. All 4 boxes are about him.", "why_zh": "圖的中心 = Matilda 的爸爸,二手車商。四個格都講他。"}], "teach": "Appearance box = body + face + clothes. One short note for each, and you're done.", "teach_zh": "外表格 = 身形 + 樣貌 + 衣着,每樣一個短筆記就完成。", "menu": "A1  His appearance", "menu_zh": "A1 他的外表", "mgrp": "Part A - Diagram"}, {"sec": "A Diagram", "tag": "A2 Character", "tb": "t25", "tbmark": ["honest"], "wb": "w3", "wbfocus": [0.52, 0.205, 0.815, 0.375], "say": "Box 2: his character = what kind of person he is. On the same page he says: 'No one ever got rich being honest. Customers are there to be diddled.' diddled = cheated.", "say_zh": "第二格:his character = 他是怎樣的人。同一頁他說:「誠實的人從來發不了財,顧客就是用來騙的。」diddled = 被騙。", "fills": [{"id": "c1", "text": "• dishonest – cheats his customers", "zh": "不誠實,欺騙顧客", "q": "A2", "note": "Character: dishonest", "kind": "text", "from": "honest", "ex": {"why": "p.25: 'No one ever got rich being honest... Customers are there to be diddled.' He thinks cheating is normal, so: dishonest.", "why_zh": "第25頁:他覺得騙人很正常,所以是不誠實。", "other": [["• a cheat – tricks people who buy his cars", "騙子,欺騙買車的人"]], "avoid": [["• clever (he thinks so, but the book shows he is a cheat)", "他自以為聰明,但書寫的是他騙人"]]}, "rw": {"pg": "p.25", "src": "No one ever got rich being honest, the father said. Customers are there to be diddled.", "src_zh": "爸爸說:誠實的人從來發不了財。顧客就是用來騙的。", "keep": ["Customers"], "swaps": [["No one ever got rich being honest,", "dishonest –", "誠實的人從來發不了財", "不誠實"], ["the father said.", "(cut)", "爸爸說", "刪走"], ["are there to be diddled.", "cheats his", "就是用來被騙的", "欺騙他的"]], "order": "Character word first, proof after: 'dishonest – cheats his customers'.", "order_zh": "先寫性格詞,再寫證據。"}, "box": [0.543, 0.247, 0.802, 0.2658], "ml": 1, "fs": 0.0162, "lh": 0.0252}], "hot": [{"box": [0.5572, 0.6748, 0.2242, 0.2399], "title": "His character", "why": "Character = what kind of person he is. Write a describing word + a short proof.", "why_zh": "性格 = 他是怎樣的人。寫一個形容詞 + 簡短證據。", "fill": "c1"}], "teach": "Character = one describing word + proof. Turn what he SAYS into one word: 'no one got rich being honest' = dishonest.", "teach_zh": "性格 = 一個形容詞 + 證據。把他講的話變成一個詞:「誠實發不了財」= 不誠實。", "menu": "A2  His character", "menu_zh": "A2 他的性格", "mgrp": "Part A - Diagram"}, {"sec": "A Diagram", "tag": "A2 Character", "tb": "t24", "tbmark": ["boast"], "wb": "w3", "wbfocus": [0.52, 0.205, 0.815, 0.375], "say": "Second character note. Page 24 says it straight: 'he liked to boast'. Later (p.29) he says 'I invented that all by myself', proudly.", "say_zh": "第二個性格。第24頁直接講:「他喜歡吹噓」。第29頁他又很得意地說「全部是我自己發明的」。", "fills": [{"id": "c2", "text": "• boastful – proud of his tricks", "zh": "愛吹噓,為自己的騙術得意", "q": "A2", "note": "Character: boastful", "kind": "text", "from": "boast", "ex": {"why": "p.24: 'he liked to boast'. p.29: 'And to think I invented that all by myself, he added proudly.'", "why_zh": "第24頁:他喜歡吹噓。第29頁:他很得意地說全部是自己發明的。", "other": [["• a show-off", "愛炫耀的人"]], "avoid": [["• confident (not the same: boastful is a bad thing)", "自信不是同一意思,吹噓是負面的"]]}, "rw": {"pg": "p.24", "src": "She also knew that he liked to boast", "src_zh": "她也知道他喜歡吹噓", "keep": [], "swaps": [["She also knew that he", "(cut)", "她也知道他", "刪走"], ["liked to boast", "boastful – proud of his tricks", "喜歡吹噓", "愛吹噓 – 為騙術得意"]], "order": "", "order_zh": ""}, "box": [0.543, 0.2688, 0.802, 0.2876], "ml": 1, "fs": 0.0162, "lh": 0.0252}], "hot": [], "teach": "If the book TELLS you the character ('he liked to boast'), use it. Just change the word form: boast → boastful.", "teach_zh": "如果書直接講出性格(他喜歡吹噓),就用它,只要改詞性:boast → boastful。"}, {"sec": "A Diagram", "tag": "A3 Treats Matilda", "tb": "t24", "tbmark": ["twit"], "wb": "w3", "wbfocus": [0.125, 0.495, 0.425, 0.645], "say": "Box 3: how he treats Matilda. He calls her names. Page 24: 'you're an IGNORANT LITTLE TWIT'. On page 30 he calls her an 'IGNORANT LITTLE SQUIRT'.", "say_zh": "第三格:他怎樣對待 Matilda。他罵她。第24頁:「你是個無知的小蠢材」。第30頁又罵她「無知的小鬼」。", "fills": [{"id": "t1", "text": "• calls her names, e.g. 'twit'", "zh": "罵她,例如「蠢材」", "q": "A3", "note": "Treats her: name-calling", "kind": "text", "from": "twit", "ex": {"why": "p.24: 'you're an IGNORANT LITTLE TWIT'. p.30: 'an IGNORANT LITTLE SQUIRT'. Name-calling = how he treats her.", "why_zh": "第24頁、第30頁他都罵她。罵人 = 他對待她的方式。", "other": [["• insults her ('twit', 'squirt')", "侮辱她(蠢材、小鬼)"]], "avoid": [["• hits her (this never happens in the book)", "書中沒有打她"]]}, "rw": {"pg": "p.24", "src": "That's because you're an IGNORANT LITTLE TWIT, the father said.", "src_zh": "爸爸說:那是因為你是個無知的小蠢材。", "keep": ["TWIT"], "swaps": [["That's because you're an IGNORANT LITTLE", "calls her names, e.g.", "那是因為你是個無知的小", "罵她,例如"], ["the father said.", "(cut)", "爸爸說", "刪走"]], "order": "", "order_zh": ""}, "box": [0.151, 0.533, 0.41, 0.5518], "ml": 1, "fs": 0.0162, "lh": 0.0252}], "hot": [{"box": [0.1647, 0.3551, 0.513, 0.5287], "title": "How he treats Matilda", "why": "What he says and does TO her: rude names, calling her stupid, ignoring her.", "why_zh": "他對她說甚麼、做甚麼:罵她、說她蠢、不理她。", "fill": "t1"}], "teach": "'How he treats her' = what he SAYS and DOES to her. Rude words he shouts are the best proof.", "teach_zh": "「怎樣對待她」= 他對她說甚麼、做甚麼。他罵她的字就是最好的證據。", "menu": "A3  How he treats Matilda", "menu_zh": "A3 他怎樣對待 Matilda", "mgrp": "Part A - Diagram"}, {"sec": "A Diagram", "tag": "A3 Treats Matilda", "tb": "t24", "tbmark": ["stupid", "ignore"], "wb": "w3", "wbfocus": [0.125, 0.495, 0.425, 0.645], "say": "Same page: 'You're too stupid.' Then he turns to his son, 'ignoring Matilda'. So he puts her down and ignores her.", "say_zh": "同一頁:「你太蠢了。」然後他轉身跟兒子說話,不理睬 Matilda。所以他貶低她又不理她。", "fills": [{"id": "t2", "text": "• says she is stupid and ignores her", "zh": "說她蠢,又不理睬她", "q": "A3", "note": "Treats her: stupid, ignores", "kind": "text", "from": "stupid", "ex": {"why": "p.24: 'You're too stupid.' and 'Ignoring Matilda, he turned to his son'. Page 33 also says she is 'told constantly that she was ignorant and stupid'.", "why_zh": "第24頁:你太蠢了;不理睬 Matilda。第33頁也說她經常被說無知又愚蠢。", "other": [["• treats her as stupid; only talks to his son", "當她蠢,只跟兒子說話"]], "avoid": [["• loves her (the opposite)", "剛好相反"]]}, "rw": {"pg": "p.24", "src": "You're too stupid. ... Ignoring Matilda, he turned to his son", "src_zh": "你太蠢了。……他不理睬 Matilda,轉向兒子", "keep": ["stupid"], "swaps": [["You're too", "says she is", "你太", "說她"], ["Ignoring Matilda,", "and ignores her", "不理睬 Matilda", "又不理她"], ["he turned to his son", "(cut)", "他轉向兒子", "刪走"]], "order": "Join the two facts into one note with 'and'.", "order_zh": "用 and 把兩件事合成一點。"}, "box": [0.151, 0.5548, 0.41, 0.5736], "ml": 1, "fs": 0.0162, "lh": 0.0252}], "hot": [], "teach": "Two small facts from the same scene? Join them with 'and' to keep the box short.", "teach_zh": "同一場景有兩個小事實?用 and 合埋,格仔就夠位。"}, {"sec": "A Diagram", "tag": "A4 Matilda thinks", "tb": "t29", "tbmark": ["cheat", "dirty"], "wb": "w3", "wbfocus": [0.53, 0.495, 0.83, 0.645], "say": "Box 4: what Matilda thinks about him. Use HER words. Page 29: 'You're cheating people who trust you.' and 'It's dirty money... I hate it.'", "say_zh": "第四格:Matilda 怎樣看他。用她自己的話。第29頁:「你在欺騙信任你的人。」「這是骯髒錢……我討厭它。」", "fills": [{"id": "m1", "text": "• he is a cheat; his money is 'dirty'", "zh": "他是騙子;他的錢是「骯髒錢」", "q": "A4", "note": "She thinks: a cheat, dirty money", "kind": "text", "from": "dirty", "ex": {"why": "p.29: Matilda's own words, 'You're cheating people who trust you' and 'It's dirty money... I hate it.' Her own words = what she thinks.", "why_zh": "第29頁是 Matilda 自己講的話,所以代表她的想法。", "other": [["• she thinks he is dishonest and hates his money", "她覺得他不誠實,討厭他的錢"]], "avoid": [["• she is scared of him (the book says angry, not scared)", "書寫她生氣,不是害怕"]]}, "rw": {"pg": "p.29", "src": "You're cheating people who trust you. It's dirty money. I hate it.", "src_zh": "你在欺騙信任你的人。這是骯髒錢。我討厭它。", "keep": ["dirty", "money"], "swaps": [["You're cheating people who trust you.", "he is a cheat;", "你在欺騙信任你的人。", "他是騙子;"], ["It's", "his", "這是", "他的"], ["I hate it.", "(cut: one point per note)", "我討厭它。", "刪走:每點只講一樣"]], "order": "Move 'dirty' to the end: his money is 'dirty'.", "order_zh": "把 dirty 放到最後。"}, "box": [0.557, 0.555, 0.816, 0.5738], "ml": 1, "fs": 0.0162, "lh": 0.0252}], "hot": [{"box": [0.5723, 0.7923, 0.513, 0.5501], "title": "What Matilda thinks about him", "why": "Her opinion of him. Look for her own words (p.29) and her decision (p.33).", "why_zh": "她對他的看法。找她自己的話(第29頁)和她的決定(第33頁)。", "fill": "m1"}], "teach": "'What does X think?' Look for X's own words or X's decision. Then report it: 'You're cheating' → he is a cheat.", "teach_zh": "「X 怎樣想?」找 X 自己的話或者 X 的決定,再轉述:你在騙人 → 他是騙子。", "menu": "A4  What Matilda thinks about him", "menu_zh": "A4 Matilda 怎樣看他", "mgrp": "Part A - Diagram"}, {"sec": "A Diagram", "tag": "A4 Matilda thinks", "tb": "t33", "tbmark": ["told", "back"], "wb": "w3", "wbfocus": [0.53, 0.495, 0.83, 0.645], "say": "Page 33: she is sick of being called 'ignorant and stupid'. So she decides: every time he is beastly to her, she will get her own back = pay him back.", "say_zh": "第33頁:她受夠了被說「無知又愚蠢」。於是她決定:每次他對她惡劣,她都會報復。", "fills": [{"id": "m2", "text": "• he deserves to be punished", "zh": "他應該受懲罰", "q": "A4", "note": "She thinks: he deserves it", "kind": "text", "from": "back", "ex": {"why": "p.33: every time he is 'beastly' to her, 'she would get her own back'. get your own back = pay someone back. So she thinks he deserves it.", "why_zh": "第33頁:每次他對她惡劣,她都會報復。所以她覺得他應該受教訓。", "other": [["• she wants to pay him back", "她想報復他"]], "avoid": [["• she wants to run away (not in the book)", "書中沒有"]]}, "rw": {"pg": "p.33", "src": "She decided that every time her father or her mother was beastly to her, she would get her own back", "src_zh": "她決定每次爸爸或媽媽對她惡劣,她都會報復", "keep": [], "swaps": [["She decided that every time her father or her mother was beastly to her,", "(cut: we only need her opinion)", "她決定每次爸爸或媽媽對她惡劣", "刪走:只要她的看法"], ["she would get her own back", "he deserves to be punished", "她會報復", "他應該受懲罰"]], "order": "", "order_zh": ""}, "box": [0.557, 0.5768, 0.816, 0.5956], "ml": 1, "fs": 0.0162, "lh": 0.0252}], "hot": [], "teach": "A character's decision shows what they think. 'She will get her own back' = she thinks he deserves it.", "teach_zh": "角色的決定反映她的想法。「她會報復」= 她覺得他活該。"}, {"sec": "B Questions", "tag": "B1 Dinner", "tb": "t30", "tbmark": ["knees"], "wb": "w3", "wbfocus": [0.11, 0.72, 0.9, 0.815], "say": "Q1 has two parts. Part 1: how did the Wormwoods have dinner? Page 30: they ate their suppers on their knees in front of the telly. (supper = dinner, telly = TV)", "say_zh": "Q1 有兩部分。第一部分:Wormwood 一家怎樣吃晚飯?第30頁:他們把晚餐放在膝上,在電視前吃。", "fills": [{"id": "b1a", "text": "They ate their dinner on their laps while watching TV.", "zh": "他們一邊看電視,一邊把晚餐放在大腿上吃。", "q": "B1", "note": "Q1a: on laps, watching TV", "kind": "text", "from": "knees", "ex": {"why": "p.30: 'eating their suppers on their knees in front of the telly'. supper = dinner, knees → laps, telly = TV. Matilda also says on p.32: 'We never are' at the table.", "why_zh": "第30頁:在電視前把晚餐放在膝上吃。第32頁 Matilda 也說他們從來不在餐桌吃。", "other": [["They ate TV dinners on their knees in front of the television.", "他們在電視前把電視餐放在膝上吃。"]], "avoid": [["They ate together at the dining table. (wrong: Matilda says they never do)", "錯:Matilda 說他們從不在餐桌吃"], ["Copying 'eating their suppers on their knees in front of the telly'", "照抄書句"]]}, "rw": {"pg": "p.30", "src": "They were in the living room eating their suppers on their knees in front of the telly.", "src_zh": "他們在客廳裏,把晚餐放在膝上,在電視前吃。", "keep": ["They"], "swaps": [["were in the living room eating their suppers", "ate their dinner", "在客廳裏吃晚餐", "吃晚飯"], ["on their knees", "on their laps", "放在膝上", "放在大腿上"], ["in front of the telly.", "while watching TV.", "在電視前", "一邊看電視"]], "order": "", "order_zh": ""}, "box": [0.1569, 0.7496, 0.8841, 0.7729], "ml": 1, "fs": 0.0185, "lh": 0.03025}], "hot": [{"box": [0.121, 0.3672, 0.6864, 0.7037], "title": "Part B: comprehension", "why": "No marks are printed, so the lines tell you how much: Q1 asks two things = 2 sentences; Q2, Q3, Q4 = 1 sentence each.", "why_zh": "沒有分數,看橫線:Q1 兩部分 = 兩句;Q2 至 Q4 各一句。"}, {"box": [0.121, 0.8319, 0.7291, 0.7465], "title": "Q1: two questions in one", "why": "(1) How did the Wormwoods eat? (2) Does YOUR family eat the same way? One sentence for each.", "why_zh": "(1)他們怎樣吃?(2)你家是否一樣?每部分一句。", "fill": "b1a"}], "teach": "One question, two parts? Answer each part with its own sentence, in the same order as the question.", "teach_zh": "一條題目有兩部分?每部分各寫一句,次序跟題目一樣。", "menu": "B1  How did the Wormwoods have dinner?", "menu_zh": "B1 他們怎樣吃晚飯?", "mgrp": "Part B - Questions"}, {"sec": "B Questions", "tag": "B1 Your family", "tb": "t30", "tbmark": [], "wb": "w3", "wbfocus": [0.11, 0.72, 0.9, 0.815], "say": "Part 2 asks about YOUR family, so this sentence is your own words, not the book. Say Yes or No first, then how you eat. Write what is really true at home.", "say_zh": "第二部分問你自己的家,所以這句是你自己的話,不是書。先答 Yes 或 No,再講你家怎樣吃。寫真實情況。", "fills": [{"id": "b1b", "text": "No, my family eats dinner together at the table.", "zh": "不,我家一起在餐桌吃晚飯。", "q": "B1", "note": "Q1b: your own family (your words)", "kind": "text", "ex": {"why": "This half asks about YOU. Yes/No first, then how you eat. Change it to what is true for your family.", "why_zh": "這部分問你。先答 Yes/No,再講你家怎樣吃。按你家真實情況改。", "other": [["Yes, we sometimes eat while watching TV too.", "是,我們有時也一邊看電視一邊吃。"], ["No, we sit at the table and talk about our day.", "不,我們坐在餐桌旁聊天。"]], "avoid": [["A long story about your family (one sentence is enough)", "不用長篇,一句就夠"], ["Skipping this part (the question has two parts)", "不可以漏答,題目有兩部分"]]}, "box": [0.1569, 0.7708, 0.8841, 0.7941], "ml": 1, "fs": 0.0185, "lh": 0.03025}], "hot": [], "teach": "'Do you / Does your family...?' = a personal question. There is no book box. Answer Yes/No + one detail.", "teach_zh": "「你/你家……嗎?」= 個人問題,書上沒有答案。答 Yes/No + 一個細節。"}, {"sec": "B Questions", "tag": "B2 The lesson", "tb": "t35", "tbmark": ["hat"], "wb": "w3", "wbfocus": [0.11, 0.828, 0.9, 0.902], "say": "Q2: how did Matilda teach her father a lesson? Chapter 3 starts the next morning: Matilda takes the hat he wears to work every day. He is very proud of that hat.", "say_zh": "Q2:Matilda 怎樣教訓爸爸?第三章第二天早上:Matilda 拿走爸爸每天戴去返工的帽。他很得意那頂帽。", "fills": [], "hot": [], "teach": "'How did she...?' = describe the METHOD: what she did, then what happened.", "teach_zh": "「她怎樣……?」= 描述方法:她做了甚麼,結果怎樣。", "menu": "B2  How did Matilda teach him a lesson?", "menu_zh": "B2 Matilda 怎樣教訓爸爸?", "mgrp": "Part B - Questions"}, {"sec": "B Questions", "tag": "B2 The lesson", "tb": "t37", "tbmark": ["glue", "allday"], "wb": "w3", "wbfocus": [0.11, 0.828, 0.9, 0.902], "say": "Page 37: she squeezes Superglue all round the inside rim of the hat. At work he can't get it off, so he has to keep it on all day long.", "say_zh": "第37頁:她在帽邊內擠一圈強力膠。返到公司他除不下帽,要整天戴住。", "fills": [{"id": "b2", "text": "She secretly put Superglue inside the rim of his hat, so it got stuck on his head.", "zh": "她偷偷在他的帽邊內塗上強力膠,令帽子黐住他的頭。", "q": "B2", "note": "Q2: Superglue in his hat", "kind": "text", "from": "glue", "ex": {"why": "p.35: she takes his hat. p.37: she squeezes Superglue 'all round the inside rim of the hat', so he 'had to keep the hat on his head the whole day long'.", "why_zh": "第35頁她拿走帽,第37頁她在帽邊內塗強力膠,令他整天除不下帽。", "other": [["She put Superglue inside his hat, so he could not take it off.", "她在帽內塗強力膠,令他除不下帽。"]], "avoid": [["Telling the whole chapter (the finger story, the lice joke): not asked", "不用講整章,題目沒有問"], ["She glued his hat to the peg. (wrong: the glue was inside the hat)", "錯:膠是塗在帽內"]]}, "rw": {"pg": "p.37", "src": "Matilda, holding the hat in one hand and a thin tube of Superglue in the other, proceeded to squeeze a line of glue very neatly all round the inside rim of the hat.", "src_zh": "Matilda 一手拿帽,一手拿着一小支強力膠,很整齊地在帽邊內擠了一圈膠水。", "keep": ["Superglue", "rim"], "swaps": [["Matilda,", "She", "Matilda", "她"], ["holding the hat in one hand and a thin tube of", "secretly put", "一手拿帽,一手拿一小支", "偷偷塗"], ["in the other, proceeded to squeeze a line of glue very neatly all round the inside", "inside the", "另一隻手,很整齊地擠了一圈膠水在", "在…裏面"], ["of the hat.", "of his hat, so it got stuck on his head.", "帽的", "他的帽,令帽子黐住他的頭。"]], "order": "Add the result at the end with 'so': that is the 'lesson'.", "order_zh": "用 so 在句尾加上結果,這就是「教訓」。"}, "box": [0.1569, 0.8561, 0.8841, 0.8797], "ml": 1, "fs": 0.0185, "lh": 0.0305}], "hot": [{"box": [0.121, 0.4924, 0.8359, 0.8533], "title": "Q2: how did she teach him a lesson?", "why": "'How' = what she did. One sentence: action + result (Superglue in the hat → stuck on his head).", "why_zh": "「怎樣」= 她做了甚麼。一句:行動 + 結果。", "fill": "b2"}], "teach": "Method + result in one sentence: 'She did X, so Y happened.' 'so' links them.", "teach_zh": "一句包含方法 + 結果:她做了 X,so 結果 Y。"}, {"sec": "B Questions", "tag": "B3 Hat off", "tb": "t43", "tbmark": ["sleep"], "wb": "w4", "wbfocus": [0.11, 0.08, 0.9, 0.153], "say": "Q3: how did the hat come off? First, what did NOT work: pulling hurt too much, and the hat stayed on all night. Page 43: he even had to sleep in it.", "say_zh": "Q3:帽子怎樣除下來?先看甚麼方法不行:拉會好痛,帽子整晚都在。第43頁:他連睡覺都要戴住。", "fills": [], "hot": [], "teach": "Check what did NOT work first. Then the answer is the thing that finally worked.", "teach_zh": "先看甚麼方法不行,答案就是最後成功的那個方法。", "menu": "B3  How did the hat come off?", "menu_zh": "B3 帽子怎樣除下來?", "mgrp": "Part B - Questions"}, {"sec": "B Questions", "tag": "B3 Hat off", "tb": "t44", "tbmark": ["cut"], "wb": "w4", "wbfocus": [0.11, 0.08, 0.9, 0.153], "say": "Page 44: the next morning it still wasn't loose, so Mrs Wormwood took a pair of scissors and cut it off, bit by bit.", "say_zh": "第44頁:第二天早上帽子仍然沒有鬆,於是 Mrs Wormwood 拿較剪,一點一點把它剪走。", "fills": [{"id": "b3", "text": "Mrs Wormwood cut the hat off piece by piece with scissors.", "zh": "Mrs Wormwood 用較剪一塊一塊把帽剪走。", "q": "B3", "note": "Q3: Mum cut it off with scissors", "kind": "text", "from": "cut", "ex": {"why": "p.44: 'Mrs Wormwood took a pair of scissors and cut the thing off his head, bit by bit'. Pulling had not worked (p.38 to 43).", "why_zh": "第44頁:她用較剪一點一點剪走帽。之前拉都拉不下。", "other": [["His wife cut it off with scissors the next morning.", "第二天早上,他太太用較剪剪走帽。"]], "avoid": [["It fell off in the night. (wrong: p.44 says it wasn't loose by the morning)", "錯:第44頁說早上仍然沒鬆"], ["Mrs Wormwood pulled it off. (wrong: she tried and he screamed)", "錯:她試過拉,他痛到大叫"]]}, "rw": {"pg": "p.44", "src": "So Mrs Wormwood took a pair of scissors and cut the thing off his head, bit by bit, first the top and then the brim.", "src_zh": "於是 Mrs Wormwood 拿了一把較剪,把那東西一點一點從他頭上剪走,先剪頂部,再剪帽邊。", "keep": ["Mrs Wormwood", "scissors"], "swaps": [["So", "(cut)", "於是", "刪走"], ["took a pair of", "(cut)", "拿了一把", "刪走"], ["and cut the thing off his head,", "cut the hat off", "把那東西從他頭上剪走", "把帽剪走"], ["bit by bit,", "piece by piece", "一點一點", "一塊一塊"], ["first the top and then the brim.", "(cut: extra detail)", "先剪頂部,再剪帽邊", "刪走:多餘細節"]], "order": "Move 'scissors' to the end: '... with scissors'.", "order_zh": "把 scissors 放到句尾:用較剪。"}, "box": [0.1569, 0.1084, 0.8841, 0.1318], "ml": 1, "fs": 0.0185, "lh": 0.03025}], "hot": [{"box": [0.121, 0.3605, 0.088, 0.1054], "title": "Q3: how did the hat come off?", "why": "Who took it off and with what. It did not fall off by itself.", "why_zh": "誰除下來、用甚麼。帽子不是自己跌下來的。", "fill": "b3"}], "teach": "'How did it come off?' = WHO did it + WITH WHAT. Mrs Wormwood + scissors.", "teach_zh": "「怎樣除下來?」= 誰做 + 用甚麼。Mrs Wormwood + 較剪。"}, {"sec": "B Questions", "tag": "B4 His look", "tb": "t44", "tbmark": ["monk", "patch"], "wb": "w4", "wbfocus": [0.11, 0.165, 0.9, 0.24], "say": "Q4: what did he look like after that? Same page: the hair stuck to the band was chopped off, so he had a bald ring like a monk, and brown patches stayed on his forehead.", "say_zh": "Q4:之後他變成甚麼樣子?同一頁:黐住帽帶的頭髮要剪光,他頭上一圈禿了,像和尚;額頭還留下一塊塊啡色的東西。", "fills": [{"id": "b4", "text": "He looked like a monk, bald all the way round, with brown patches stuck to his\nforehead.", "zh": "他看起來像和尚,頭上一圈禿了,額頭還黐着一塊塊啡色的東西。", "q": "B4", "note": "Q4: like a monk + brown patches", "kind": "text", "from": "monk", "ex": {"why": "p.44: he 'finished up with a bald ring round his head, like some sort of a monk', and 'small patches of brown leathery stuff' stayed on the front.", "why_zh": "第44頁:頭上一圈禿了像和尚,額頭留下一塊塊啡色的東西。", "other": [["He was bald round his head like a monk and had brown bits on his forehead.", "他頭上一圈禿了像和尚,額頭有啡色碎片。"], ["... brown bits that looked like little insects (p.45)", "……看似小蟲的啡色碎片(第45頁)"]], "avoid": [["He looked handsome. (the opposite)", "剛好相反"], ["He had lice. (no: Matilda only says people will THINK so)", "不是:Matilda 只是說人家會以為他有頭蝨"]]}, "rw": {"pg": "p.44", "src": "she had to chop the hair off right to the skin so that he finished up with a bald ring round his head, like some sort of a monk. And in the front, where the band had stuck directly to the bare skin, there remained a whole lot of small patches of brown leathery stuff", "src_zh": "她要把頭髮剪到見皮,於是他頭上留下一圈禿頭,像和尚一樣。前面帽帶直接黐住皮膚的地方,留下很多一小塊一小塊啡色、像皮革的東西", "keep": ["monk", "brown"], "swaps": [["she had to chop the hair off right to the skin so that he finished up with a bald ring round his head,", "bald all the way round", "她要把頭髮剪到見皮,他頭上留下一圈禿頭", "一圈都禿了"], ["like some sort of a", "He looked like a", "像某種", "他看起來像"], ["And in the front, where the band had stuck directly to the bare skin, there remained a whole lot of small patches of", "with patches stuck to his forehead", "前面帽帶黐住皮膚的地方,留下很多一小塊", "額頭黐着一塊塊"], ["leathery stuff", "(cut)", "像皮革的東西", "刪走"]], "order": "Start with the big picture (like a monk), then add the details.", "order_zh": "先講整體(像和尚),再加細節。", "out": "He looked like a monk, bald all the way round, with brown patches stuck to his forehead."}, "box": [0.1569, 0.1938, 0.8841, 0.2389], "ml": 1, "fs": 0.0185, "lh": 0.0305}], "hot": [{"box": [0.121, 0.4054, 0.1734, 0.1908], "title": "Q4: what did he look like?", "why": "'Look like' = describe his head after the hat was cut off: bald like a monk + brown patches.", "why_zh": "「看起來」= 描述帽剪走後他的頭:像和尚的禿頭 + 啡色斑塊。", "fill": "b4"}], "teach": "'What did he look like?' = describe the picture. Start with one comparison (like a monk), then 1 or 2 details.", "teach_zh": "「他看起來怎樣?」= 描述畫面。先用一個比喻(像和尚),再加一兩個細節。", "menu": "B4  What did he look like after that?", "menu_zh": "B4 之後他變成甚麼樣子?", "mgrp": "Part B - Questions"}, {"sec": "C Vocabulary", "tag": "C1 boast", "tb": "t24", "tbmark": ["boast"], "wb": "w4", "wbfocus": [0.11, 0.25, 0.76, 0.52], "say": "1. boast. Find it in the book: page 24, 'he liked to boast'. He loves telling everyone how clever his tricks are. That is speaking too proudly of yourself = D.", "say_zh": "1. boast。在書中找:第24頁「他喜歡吹噓」。他很愛講自己的騙術有多聰明 = 太驕傲地講自己 = D。", "fills": [{"id": "v1", "text": "D", "zh": "吹噓 = D", "q": "C1", "note": "boast = D (speak too proudly of oneself)", "kind": "text", "from": "boast", "ex": {"why": "p.24 'he liked to boast': h  STEPS.forEach(function(s,si){(s.hot||[]).forEach(function(hh,hi){var st=$("st_"+s.wb);if(!st)return;var d=document.createElement("div");d.className="hot";setBox(d,hh.box);d.setAttribute("data-si",si);d.setAttribute("data-hi",hi);st.querySelector("img").after(d);});});
 STEPS.forEach(function(s,si){return;var st=$("st_"+s.wb);if(!st)return;var d=document.createElement("div");d.className="qhot";setBox(d,[s.wbfocus[0],s.wbfocus[2],s.wbfocus[1],s.wbfocus[3]]);d.setAttribute("data-si",si);st.querySelector("img").after(d);});
 document.addEventListener("click",function(e){var t=e.target;if(!t.closest)return;var h=t.closest(".hot");if(h){showHot(+h.getAttribute("data-si"),+h.getAttribute("data-hi"),h);return;}var q=t.closest(".qhot");if(q)showQ(+q.getAttribute("data-si"),q);});
 function locate(id){setPlay(false);var i=FSTEP[id];if(i>=cur)go(i+1);else{var s=STEPS[i];setView(s);}var a=$("an_"+id);if(a)setTimeout(function(){showExplain(id,a);},450);}
 var ended=false;
 function onStepDone(){if(cur>=STEPS.length-1){ended=true;setPlay(false);return;}go(cur+1);}
 function go(n){ended=false;run(n,onStepDone);}
 function setPlay(on){playing=on;$("play").textContent=on?"❚❚ Pause":"▶ Play";$("pp").textContent=on?"❚❚":"▶";if(on)unfreeze();else freeze();}
 $("play").onclick=function(){if(playing)setPlay(false);else{if(ended)go(0);setPlay(true);}};
 $("next").onclick=function(){go(cur+1);};$("prev").onclick=function(){go(cur-1);};
 document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);if(e.key===" "){e.preventDefault();$("play").onclick();}});
 var EST=STEPS.map(function(s,si){var t=2.3;(s.tbmark||[]).concat(s.wbmark||[]).forEach(function(k){if(MSTEP[k]===si&&LABEL[k])t+=3.15;});if(s.teach)t+=s.teach.length*0.02+0.9;(s.fills||[]).forEach(function(f){t+=0.25+(f.kind==="circle"?0.9:f.text.length*(f.text.length>40?0.014:0.045)+0.3);if(f.rw)t+=rwT(f)+1.15;else if(f.from)t+=1.12;if(f.teach)t+=f.teach.length*0.02+0.9;});t+=1.4;return Math.max(t,3.2);});
 var START=[],TOTAL=0;EST.forEach(function(e){START.push(TOTAL);TOTAL+=e;});
 var lastSec="";STEPS.forEach(function(s,i){if(!i)return;var k=document.createElement("div");k.className="tick";k.style.left=(START[i]/TOTAL*100)+"%";if(s.sec&&s.sec!==lastSec){var sp=document.createElement("span");sp.textContent=s.sec.charAt(0);k.appendChild(sp);k.style.background="#ffdd00";lastSec=s.sec;}$("track").appendChild(k);});
 function fmt(s){s=Math.max(0,Math.floor(s));return("0"+Math.floor(s/60)).slice(-2)+":"+("0"+(s%60)).slice(-2);}
 function nowT(){return START[cur]+Math.min(EST[cur],((paused?pauseAt:Date.now())-stepT0)/1000*SPEED);}
 setInterval(function(){var t=nowT();$("fill").style.width=(t/TOTAL*100)+"%";$("knob").style.left=(t/TOTAL*100)+"%";$("ptime").textContent=fmt(t)+" / "+fmt(TOTAL);},200);
 function seekFrac(f){var t=f*TOTAL,i=0;for(var j=0;j<START.length;j++)if(START[j]<=t)i=j;return i;}
 var dragging=false;
 function fracOf(e){var r=$("track").getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));}
 $("track").addEventListener("pointerdown",function(e){dragging=true;$("track").setPointerCapture(e.pointerId);var f=fracOf(e);$("knob").style.left=(f*100)+"%";});
 $("track").addEventListener("pointermove",function(e){if(!dragging)return;var f=fracOf(e);$("knob").style.left=(f*100)+"%";$("ptime").textContent=fmt(f*TOTAL)+" / "+fmt(TOTAL);});
 $("track").addEventListener("pointerup",function(e){if(!dragging)return;dragging=false;go(seekFrac(fracOf(e)));});
 $("pp").onclick=function(){$("play").onclick();};
 function setSpeed(v){var t=nowT();SPEED=v;stepT0=Date.now()-(t-START[cur])*1000/SPEED;if(paused)pauseAt=Date.now();
   document.documentElement.style.setProperty("--tf",(0.9/SPEED)+"s");document.documentElement.style.setProperty("--tz",(0.6/SPEED)+"s");document.documentElement.style.setProperty("--tc",(0.8/SPEED)+"s");$("spd").value=String(v);$("spdv").textContent=v.toFixed(2)+"x";
   try{localStorage.setItem("geo1_spd",String(v));}catch(e){}}
 $("spd").oninput=function(){setSpeed(parseFloat($("spd").value));};
 try{var sv=parseFloat(localStorage.getItem("geo1_spd"));if(sv>0)setSpeed(sv);}catch(e){}
 function setZh(on){document.body.classList.toggle("zhon",on);$("zhbtn").classList.toggle("on",on);$("zhbtn").textContent=on?"中文 ✓":"中文";try{localStorage.setItem("hwv_zh",on?"1":"0");}catch(e){}}
 $("zhbtn").onclick=function(){setZh(!document.body.classList.contains("zhon"));};
 try{setZh(localStorage.getItem("hwv_zh")==="1");}catch(e){setZh(false);}
 document.querySelectorAll(".stage img").forEach(function(im){im.addEventListener("load",function(){if(lastT)focusCam("tcam",lastT[0],lastT[1]);if(lastW)focusCam("wcam",lastW[0],lastW[1]);});});

 var MENU=[];STEPS.forEach(function(s,i){if(s.menu)MENU.push([s.menu,s.menu_zh||"",i,s.mgrp||""]);});
 function buildMenu(){var h="",g="";MENU.forEach(function(m,j){if(m[3]!==g){g=m[3];if(g)h+='<div class="qh">'+esc(g)+'</div>';}h+='<button data-i="'+m[2]+'" data-j="'+j+'">'+esc(m[0])+'<span class="qz">'+esc(m[1])+'</span></button>';});$("qmenu").innerHTML=h;
   $("qmenu").querySelectorAll("button").forEach(function(b){b.onclick=function(e){e.stopPropagation();$("qmenu").classList.remove("open");go(+b.getAttribute("data-i"));setPlay(true);};});}
 function markMenu(){var k=-1;MENU.forEach(function(m,j){if(m[2]<=cur)k=j;});$("qmenu").querySelectorAll("button").forEach(function(b){b.classList.toggle("cur",+b.getAttribute("data-j")===k);});}
 buildMenu();
 $("qbtn").onclick=function(e){e.stopPropagation();var m=$("qmenu");if(m.classList.contains("open")){m.classList.remove("open");return;}closeEx();markMenu();m.classList.add("open");var r=$("qbtn").getBoundingClientRect();m.style.top=(r.bottom+6)+"px";m.style.left=Math.max(8,Math.min(innerWidth-m.offsetWidth-8,r.left))+"px";var c=m.querySelector("button.cur");if(c)m.scrollTop=Math.max(0,c.offsetTop-60);};
 document.addEventListener("click",function(e){var m=$("qmenu");if(m.classList.contains("open")&&!m.contains(e.target)&&e.target!==$("qbtn"))m.classList.remove("open");});
 function showRwHelp(anchor){setPlay(false);closeEx();var d=document.createElement("div");d.className="expop";d.id="expop";
   d.innerHTML='<button class="exx" id="exx">✕</button><div class="exh" style="color:#1d70b8">Rewrite board</div><div class="exw">Any answer taken from a book sentence is rebuilt here, so you never copy the book word for word:</div><div>1 Keep the facts (names, things) · 2 Swap the other words · 3 Change the order · 4 Check: no 3 words in a row the same as the book.</div><div class="exz">從書拿的句子都在這裏改寫:保留事實、換其他字、調次序、檢查沒有連續三個字跟書一樣。這樣老師不會覺得你照抄。</div>';
   placePop(d,anchor);}
 $("rw").addEventListener("click",function(e){if(e.target.closest&&e.target.closest(".gw"))return;e.stopPropagation();if(RWCUR&&$("an_"+RWCUR.id)&&$("an_"+RWCUR.id).textContent){var f=RWCUR;showExplain(f.id,$("rw"));}else showRwHelp($("rw"));});
 closeRw();
 go(0);
})();
