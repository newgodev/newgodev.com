<style>.ans{white-space:normal!important;line-height:1.22!important;}</style><style>
:root{--ink:#0b0c0c;--muted:#505a5f;--line:#b1b4b6;--blue:#1d4ed8;--red:#d4351c;--hi:#ffdd00}
*{box-sizing:border-box}
html{color-scheme:light;background:#fff;font-size:17px}
body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans HK",Arial,sans-serif;line-height:1.6}
.top{background:#fff;border-bottom:6px solid #1d70b8;padding:9px 16px}

.say{font-size:1.1rem;font-weight:700;margin:7px 0 0;min-height:2.6em}

.grid{display:grid;grid-template-columns:1.05fr 1.2fr .75fr;gap:12px;padding:10px 14px}

.stage{position:absolute;left:0;top:0;transform-origin:0 0;display:none;transition:width var(--tc,.8s) cubic-bezier(.4,0,.2,1),transform var(--tc,.8s) cubic-bezier(.4,0,.2,1)}
.stage.on{display:block}
.stage img{display:block;width:100%;height:auto}
.box{position:absolute;border-radius:4px;border:3px solid transparent;transition:all .35s;pointer-events:none}

.box.hl,.box.flash{pointer-events:auto;cursor:pointer}.exgo{display:block;margin:6px 0 2px;border:2px solid var(--ink);background:#fff8e6;border-radius:6px;font-weight:800;padding:4px 8px;cursor:pointer;font-size:.85rem}.exgo:hover{background:#ffe9a8}
.hot,.qhot{position:absolute;cursor:pointer;border-radius:4px}.qhot:hover{background:rgba(0,120,255,.05)}.hot:hover{background:rgba(0,120,255,.14);outline:2px dashed rgba(0,90,200,.6)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,221,0,0)}50%{box-shadow:0 0 0 7px rgba(255,221,0,.4)}}

.ans:hover{background:rgba(255,246,207,.8)}

.exh{font-weight:900;color:#d4001e;margin-right:30px}
.exl{font-size:.72rem;font-weight:900;color:var(--muted);margin-top:8px}
.exl.bad{color:var(--red)}
.exw{font-weight:700}
.exz{color:#6b4e16;background:#fff8e6;border-radius:4px;padding:2px 6px;margin-top:3px;font-size:.88rem}
.exo,.exa{margin:2px 0 0;padding-left:18px}.exo li{color:#00703c;font-weight:700}.exa li{color:var(--red)}
.exzi{color:#6b4e16;font-weight:500}
.exx{position:absolute;right:8px;top:6px;border:2px solid var(--ink);background:#fff;border-radius:4px;font-weight:900;cursor:pointer;font-family:inherit}
.player{background:#0b0c0c;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.player button{font-family:inherit;font-size:1rem;font-weight:900;width:42px;height:34px;border:0;border-radius:4px;background:#fff;color:#0b0c0c;cursor:pointer}
.track{position:relative;flex:1;height:12px;background:#444;border-radius:999px;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hi);border-radius:999px}
.knob{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:3px solid var(--hi);left:0}
.tick{position:absolute;top:-4px;width:2px;height:20px;background:#888}
.tick span{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:.7rem;color:#ddd;font-weight:900}
.ptime{font-size:.85rem;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.spdwrap{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:900}
.spdwrap input{width:120px;accent-color:#ffdd00;cursor:pointer}

.zoom{position:fixed;z-index:70;background-repeat:no-repeat;background-color:#fff;border:5px solid var(--hi);border-radius:6px;box-shadow:0 14px 44px rgba(0,0,0,.45);pointer-events:none;
  transition:left var(--tz,.6s) cubic-bezier(.4,0,.2,1),top var(--tz,.6s) cubic-bezier(.4,0,.2,1),width var(--tz,.6s) cubic-bezier(.4,0,.2,1),height var(--tz,.6s) cubic-bezier(.4,0,.2,1)}
.zoomcap{position:fixed;z-index:71;background:#0b0c0c;color:#fff;font-weight:900;font-size:1.05rem;padding:6px 12px;border-radius:4px;pointer-events:none;transition:opacity .3s;max-width:700px}
.zoomcap .zc{display:block;font-weight:500;font-size:.9rem;color:#ffe9a8}
.note.ev{background:#fff3a3}

var STEPS=[{"sec": "Chapter 1", "tag": "1.1", "tb": "b05", "tbmark": ["scab"], "wb": "w1", "wbfocus": [0, 0.1, 1, 0.25], "say": "Chapter 1 starts with Matilda's parents, Mr and Mrs Wormwood. Look at the word they use for her: a scab.", "say_zh": "第一章由 Matilda 的父母開始。留意他們怎樣形容她:一塊痂。", "fills": [{"id": "c1", "box": [0.109375, 0.14670790985417587, 0.93125, 0.20415377817057004], "text": "Mr and Mrs Wormwood. They see her as a scab = a nuisance.", "zh": "Wormwood 夫婦。他們當她是一塊痂,即是麻煩。", "q": "1", "note": "Parents: scab", "kind": "text", "from": "scab", "ex": {"why": "A scab is something you want to pick off and flick away. So the parents want to get rid of her.", "why_zh": "痂是你想撕走、彈走的東西。所以父母想甩走她。", "other": [["They think she is a nuisance.", "他們覺得她很麻煩。"]], "avoid": [["They love her.", "書裏剛好相反。"]]}, "fs": 0.031}], "teach": "When the writer compares a person to a thing, ask: how does that thing feel? A scab = something you want to get rid of.", "teach_zh": "作者把人比作一樣東西時,問自己:那樣東西給人甚麼感覺?痂 = 想甩走的東西。"}, {"sec": "Chapter 1", "tag": "1.2", "tb": "b05", "tbmark": ["brill"], "wb": "w1", "wbfocus": [0, 0.1, 1, 0.25], "say": "But Matilda is the opposite of a scab. The writer says it clearly: above all, she was brilliant.", "say_zh": "但 Matilda 剛好相反。作者直接講:她最重要是 brilliant(非常聰明)。", "fills": [{"id": "c2", "box": [0.109375, 0.25320371188687585, 0.93125, 0.31064958020327], "text": "Brilliant. Her mind is quick and she learns very fast.", "zh": "非常聰明,學嘢極快。", "q": "2", "note": "Matilda: brilliant", "kind": "text", "from": "brill", "ex": {"why": "p.5: 'above all she was brilliant. Her mind was so nimble'. nimble = quick.", "why_zh": "第 5 頁:她最重要是聰明,腦筋很快。nimble = 靈活、快。", "other": [], "avoid": []}, "fs": 0.031}]}, {"sec": "Chapter 1", "tag": "1.3", "tb": "b06", "tbmark": ["three"], "wb": "w1", "wbfocus": [0, 0.2, 1, 0.4], "say": "Proof that she is brilliant: by age three she had taught herself to read. Her parents only call her a noisy chatterbox.", "say_zh": "證明她聰明:三歲已經自學閱讀。父母卻只罵她吵。", "fills": [{"id": "c3", "box": [0.109375, 0.3596995139195758, 0.93125, 0.41714538223597], "text": "She taught herself to read.", "zh": "她自己學識閱讀。", "q": "3", "note": "Reads at 3", "kind": "text", "from": "three", "ex": {"why": "p.6: 'By the time she was three, Matilda had taught herself to read'.", "why_zh": "第 6 頁:三歲已經自己學識閱讀。", "other": [], "avoid": []}, "fs": 0.031}], "teach": "A writer often says 'she is brilliant', then gives proof. Find the proof sentence: it is the one with a number or an action.", "teach_zh": "作者常常先講「她很聰明」,再給證據。找證據句:有數字或者有動作的那一句。"}, {"sec": "Chapter 1", "tag": "1.4", "tb": "b08", "tbmark": ["book"], "wb": "w1", "wbfocus": [0, 0.3, 1, 0.5], "say": "She asks her dad to buy her a book. Look how he shouts back: 'A BOOK?' He tells her to watch the telly instead.", "say_zh": "她叫爸爸買書。爸爸大叫「書?」,叫她看電視就好。", "fills": [{"id": "c4", "box": [0.109375, 0.46619531595227576, 0.93125, 0.5236411842686699], "text": "'A BOOK? What for?' He wants her to watch TV.", "zh": "「書?要來做甚麼?」他要她看電視。", "q": "4", "note": "Dad: 'A BOOK?'", "kind": "text", "from": "book", "ex": {"why": "p.8: 'What d'you want a flaming book for?' and 'We've got a lovely telly'.", "why_zh": "第 8 頁:你要本書來做甚麼?我們有部好電視。", "other": [], "avoid": []}, "fs": 0.031}]}, {"sec": "Chapter 1", "tag": "1.5", "tb": "b09", "tbmark": ["lib"], "wb": "w1", "wbfocus": [0, 0.38, 1, 0.6], "say": "So she walks to the public library all by herself. There she meets the librarian, Mrs Phelps. Remember this name.", "say_zh": "於是她自己行去公共圖書館,認識了圖書館員 Mrs Phelps。記住這個名字。", "fills": [{"id": "c5", "box": [0.109375, 0.5726911179849757, 0.93125, 0.6301369863013698], "text": "The public library. She meets Mrs Phelps, the librarian.", "zh": "公共圖書館,認識圖書館員 Mrs Phelps。", "q": "5", "note": "Library + Mrs Phelps", "kind": "text", "from": "lib", "ex": {"why": "p.9: 'set out all by herself to walk to the public library … introduced herself to the librarian, Mrs Phelps'.", "why_zh": "第 9 頁:她自己行去公共圖書館,向圖書館員 Mrs Phelps 自我介紹。", "other": [], "avoid": []}, "fs": 0.031}], "teach": "New name = new important person. Write the name and the job together: Mrs Phelps = librarian.", "teach_zh": "出現新名字 = 新的重要人物。名字同職業一齊記:Mrs Phelps = 圖書館員。"}, {"sec": "Chapter 1", "tag": "1.6", "tb": "b12", "tbmark": ["age"], "wb": "w1", "wbfocus": [0, 0.48, 1, 0.7], "say": "She reads every children's book, then asks for grown-up books. Mrs Phelps asks her age: four years and three months. Mrs Phelps is stunned.", "say_zh": "她讀完所有兒童書,再要大人書。Mrs Phelps 問她幾歲:四歲三個月。Mrs Phelps 呆住了。", "fills": [{"id": "c6", "box": [0.109375, 0.6791869200176757, 0.93125, 0.7366327883340699], "text": "4 years and 3 months. Mrs Phelps is stunned (very surprised).", "zh": "四歲三個月。Mrs Phelps 驚訝到呆住。", "q": "6", "note": "Age 4y3m · stunned", "kind": "text", "from": "age", "ex": {"why": "stunned = so surprised you can't move.", "why_zh": "stunned = 驚訝到呆住。", "other": [["shocked", "嚇呆"]], "avoid": []}, "fs": 0.031}]}, {"sec": "Chapter 1", "tag": "1.7", "tb": "b15", "tbmark": ["ge"], "wb": "w1", "wbfocus": [0, 0.6, 1, 0.82], "say": "Her first grown-up book is Great Expectations by Charles Dickens. Within a week she finishes it: 411 pages.", "say_zh": "她第一本大人書是狄更斯的《遠大前程》。一星期就讀完,411 頁。", "fills": [{"id": "c7", "box": [0.109375, 0.7856827220503756, 0.93125, 0.8431285903667698], "text": "Great Expectations by Dickens: 411 pages in one week.", "zh": "狄更斯《遠大前程》,一星期讀完 411 頁。", "q": "7", "note": "Great Expectations, 411 p.", "kind": "text", "from": "ge", "ex": {"why": "p.15: 'Within a week … four hundred and eleven pages'.", "why_zh": "第 15 頁:一星期內讀完,四百一十一頁。", "other": [], "avoid": []}, "fs": 0.031}]}, {"sec": "Chapter 1", "tag": "1.8", "tb": "b21", "tbmark": ["worlds"], "wb": "w1", "wbfocus": [0, 0.72, 1, 0.95], "say": "The big idea of Chapter 1 is in one sentence: books take her into new worlds. Her parents never go there.", "say_zh": "第一章的重點就是一句:書帶她去新世界,而她的父母從來沒有去過。", "fills": [{"id": "c8", "box": [0.109375, 0.8921785240830755, 0.93125, 0.9496243923994697], "text": "Books take her to new worlds that her parents never see.", "zh": "書帶她去父母從來看不到的新世界。", "q": "8", "note": "Books = new worlds", "kind": "text", "from": "worlds", "ex": {"why": "p.21: 'The books transported her into new worlds'. transported = carried.", "why_zh": "第 21 頁:書把她帶到新世界。transported = 帶走、運送。", "other": [], "avoid": []}, "fs": 0.031}], "teach": "Big idea = the sentence that explains the whole chapter. Ask: if I keep only one sentence, which one?", "teach_zh": "重點 = 能解釋整章的那一句。問自己:如果只可以留一句,留哪一句?"}, {"sec": "Chapter 2", "tag": "2.1", "tb": "b23", "tbmark": ["job"], "wb": "w2", "wbfocus": [0, 0.1, 1, 0.27], "say": "Chapter 2 is about Dad. His job: he sells second-hand cars, and he is proud of how he does it.", "say_zh": "第二章講爸爸。他的工作是賣二手車,而且很得意自己的做法。", "fills": [{"id": "d1", "box": [0.109375, 0.14670790985417587, 0.93125, 0.20415377817057004], "text": "He sells second-hand (used) cars.", "zh": "他賣二手車。", "q": "1", "note": "Dad sells used cars", "kind": "text", "from": "job", "ex": {"why": "p.23: 'Her father was a dealer in second-hand cars'. dealer = seller.", "why_zh": "第 23 頁:她爸爸是二手車商。dealer = 賣家。", "other": [], "avoid": []}, "fs": 0.031}]}, {"sec": "Chapter 2", "tag": "2.2", "tb": "b25", "tbmark": ["saw"], "wb": "w2", "wbfocus": [0, 0.2, 1, 0.38], "say": "Trick 1: he mixes sawdust with the oil in the gearbox. A broken car sounds sweet for a while, long enough to sell it.", "say_zh": "騙術一:他把木糠混入波箱的油,爛車短時間內聽落好順,夠時間賣出去。", "fills": [{"id": "d2", "box": [0.109375, 0.26866990720282813, 0.93125, 0.3261157755192223], "text": "Sawdust in the gearbox, so a bad car runs quietly for a short time.", "zh": "波箱加木糠,爛車暫時跑得順。", "q": "2", "note": "Trick 1: sawdust", "kind": "text", "from": "saw", "ex": {"why": "p.25: 'mix a lot of sawdust with the oil in the gearbox and it runs as sweet as a nut'.", "why_zh": "第 25 頁:把木糠混入波箱油,架車就跑得好順。", "other": [], "avoid": []}, "fs": 0.031}]}, {"sec": "Chapter 2", "tag": "2.3", "tb": "b25", "tbmark": ["dis"], "wb": "w2", "wbfocus": [0, 0.3, 1, 0.5], "say": "Matilda says it straight: that is dishonest, it is cheating.", "say_zh": "Matilda 直接講:這是不誠實,是欺騙。", "fills": [{"id": "d3", "box": [0.109375, 0.39063190455148034, 0.93125, 0.4480777728678745], "text": "'That's dishonest, Daddy. It's cheating.'", "zh": "「爸爸,這是不誠實,是欺騙。」", "q": "3", "note": "'That's dishonest'", "kind": "text", "from": "dis", "ex": {"why": "p.25: her own words.", "why_zh": "第 25 頁:她的原話。", "other": [], "avoid": []}, "fs": 0.031}]}, {"sec": "Chapter 2", "tag": "2.4", "tb": "b25", "tbmark": ["rich"], "wb": "w2", "wbfocus": [0, 0.4, 1, 0.6], "say": "Dad's answer shows who he is: no one ever got rich being honest. diddled = cheated.", "say_zh": "爸爸的回答說明了他是甚麼人:誠實發不了財。diddled = 被騙。", "fills": [{"id": "d4", "box": [0.109375, 0.5125939019001325, 0.93125, 0.5700397702165267], "text": "'No one ever got rich being honest.'", "zh": "「誠實的人從來發不了財。」", "q": "4", "note": "'No one got rich being honest'", "kind": "text", "from": "rich", "ex": {"why": "p.25. 'Customers are there to be diddled' = customers are there to be cheated.", "why_zh": "第 25 頁。顧客本來就是用來騙的。", "other": [], "avoid": []}, "fs": 0.031}], "teach": "A character's own words tell you who they are. Dad's line = he thinks cheating is normal.", "teach_zh": "角色自己講的話最能說明他是甚麼人。爸爸這句 = 他覺得騙人很正常。"}, {"sec": "Chapter 2", "tag": "2.5", "tb": "b28", "tbmark": ["drill"], "wb": "w2", "wbfocus": [0, 0.5, 1, 0.72], "say": "Trick 2: he joins an electric drill to the speedometer cable and runs it backwards, so the mileage looks much lower.", "say_zh": "騙術二:他把電鑽駁上咪錶線倒轉,里數就變得好少。", "fills": [{"id": "d5", "box": [0.109375, 0.6345558992487847, 0.93125, 0.692001767565179], "text": "An electric drill turns the mileage back, so the car looks less used.", "zh": "用電鑽把里數倒轉,令架車睇落少用。", "q": "5", "note": "Trick 2: drill", "kind": "text", "from": "drill", "ex": {"why": "p.28: the drill turns the speedometer cable backwards; mileage = how far the car has gone.", "why_zh": "第 28 頁:電鑽令咪錶線倒轉;mileage = 架車行過幾遠。", "other": [], "avoid": []}, "fs": 0.031}]}, {"sec": "Chapter 2", "tag": "2.6", "tb": "b29", "tbmark": ["food"], "wb": "w2", "wbfocus": [0, 0.6, 1, 0.82], "say": "Matilda says it is even worse than the sawdust. Dad answers: if you don't like it, don't eat the food in this house.", "say_zh": "Matilda 說這比木糠更差。爸爸答:不喜歡就別吃這屋的飯。", "fills": [{"id": "d6", "box": [0.109375, 0.7565178965974371, 0.93125, 0.8139637649138312], "text": "'If you don't like it, don't eat the food in this house.'", "zh": "「你不喜歡就別吃這屋的飯。」", "q": "6", "note": "'Don't eat the food then'", "kind": "text", "from": "food", "ex": {"why": "p.29: Matilda calls it 'dirty money'. Dad says the food is bought with the profits.", "why_zh": "第 29 頁:Matilda 話這是「髒錢」,爸爸話飯是用這些錢買的。", "other": [], "avoid": []}, "fs": 0.031}]}, {"sec": "Chapter 2", "tag": "2.7", "tb": "b33", "tbmark": ["back"], "wb": "w2", "wbfocus": [0, 0.72, 1, 0.95], "say": "The end of Chapter 2 is the key for the whole book: every time her parents are horrid, she will get her own back.", "say_zh": "第二章最尾一句是全書的關鍵:父母每次對她差,她都會還擊。", "fills": [{"id": "d7", "box": [0.109375, 0.8784798939460893, 0.93125, 0.9359257622624835], "text": "Every time her parents are horrid to her, she will get her own back.", "zh": "父母每次對她差,她都會還擊。", "q": "7", "note": "She will get her own back", "kind": "text", "from": "back", "ex": {"why": "p.33: 'every time her father or her mother was beastly to her, she would get her own back'. get your own back = pay them back.", "why_zh": "第 33-34 頁:每次父母對她差,她都會還擊。", "other": [], "avoid": []}, "fs": 0.031}], "teach": "The last line of a chapter often tells you what comes next. Here: a plan. Chapter 3 = the first time she does it.", "teach_zh": "一章的最後一句常常預告下一章。這裏是一個計劃,第三章就是她第一次實行。"}, {"sec": "Chapter 3", "tag": "3.1", "tb": "b35", "tbmark": ["hat"], "wb": "w3", "wbfocus": [0, 0.1, 1, 0.25], "say": "Chapter 3: the very next morning, Matilda takes the hat Dad wears to work every day. He is very proud of it.", "say_zh": "第三章:第二朝,Matilda 拿走爸爸每日戴去返工、好得意的那頂帽。", "fills": [{"id": "e1", "box": [0.109375, 0.14670790985417587, 0.93125, 0.20415377817057004], "text": "Dad's hat, the one he wears to work every day.", "zh": "爸爸每日戴去返工的帽。", "q": "1", "note": "Takes Dad's hat", "kind": "text", "from": "hat", "ex": {"why": "p.35: 'got hold of the hat he wore each day to work'.", "why_zh": "第 35 頁:她拿到爸爸每日戴去返工的帽。", "other": [], "avoid": []}, "fs": 0.031}]}, {"sec": "Chapter 3", "tag": "3.2", "tb": "b37", "tbmark": ["glue"], "wb": "w3", "wbfocus": [0, 0.18, 1, 0.35], "say": "She squeezes a line of Superglue all round the inside of the hat, then puts it back on the peg.", "say_zh": "她在帽內一圈塗上強力膠,再放返去衣鈎。", "fills": [{"id": "e2", "box": [0.109375, 0.25320371188687585, 0.93125, 0.31064958020327], "text": "She puts a line of Superglue inside the rim.", "zh": "她在帽邊內塗一圈強力膠。", "q": "2", "note": "Superglue inside", "kind": "text", "from": "glue", "ex": {"why": "p.37: rim = the edge of the hat.", "why_zh": "第 37 頁:rim = 帽邊。", "other": [], "avoid": []}, "fs": 0.031}]}, {"sec": "Chapter 3", "tag": "3.3", "tb": "b37", "tbmark": ["day"], "wb": "w3", "wbfocus": [0, 0.28, 1, 0.45], "say": "At work he can't take it off, so he wears it the whole day, even while cheating with sawdust.", "say_zh": "返到公司他除不下,要戴一整天,連放木糠時都戴住。", "fills": [{"id": "e3", "box": [0.109375, 0.3596995139195758, 0.93125, 0.41714538223597], "text": "He can't take it off, so he wears it all day.", "zh": "除不下,要成日戴住。", "q": "3", "note": "Hat on all day", "kind": "text", "from": "day", "ex": {"why": "p.37: 'had to keep the hat on his head the whole day long'.", "why_zh": "第 37 頁:他要成日戴住頂帽。", "other": [], "avoid": []}, "fs": 0.031}]}, {"sec": "Chapter 3", "tag": "3.4", "tb": "b39", "tbmark": ["eyes"], "wb": "w3", "wbfocus": [0, 0.38, 1, 0.55], "say": "Dad suspects her, but Matilda just looks back with large innocent brown eyes. She acts like she knows nothing.", "say_zh": "爸爸懷疑她,但 Matilda 只是用無辜的大眼看返他,扮甚麼都不知道。", "fills": [{"id": "e4", "box": [0.109375, 0.46619531595227576, 0.93125, 0.5236411842686699], "text": "With large innocent brown  function run(n,onDone){
   clearAll();token++;var my=token;cur=Math.max(0,Math.min(STEPS.length-1,n));stepT0=Date.now();if(paused)pauseAt=stepT0;
   var s=STEPS[cur];
   $("tag").textContent=s.tag;$("sec").textContent=s.sec||"";$("say").textContent=s.say;$("sayzh").textContent=s.say_zh||"";$("num").textContent=cur+" / "+(STEPS.length-1);
   $("prev").disabled=cur===0;$("next").disabled=cur===STEPS.length-1;

   later(function(){
     if(my!==token)return;var k=0,fills=s.fills||[];

       if(my!==token)return;if(k>=fills.length){finish();return;}

     }
     var nk=(s.tbmark||[]).concat(s.wbmark||[]).filter(function(k){return MSTEP[k]===cur&&LABEL[k];}),ni=0;
     function nextZoom(){if(my!==token)return;if(ni<nk.length){zoomNote(nk[ni++],my,function(){later(nextZoom,200);});return;}if(s.teach)teach(s.teach,s.teach_zh,my,nextFill);else nextFill();}
     nextZoom();
   },900);
 }
 function closeEx(){var d=$("expop");if(d)d.remove();}

 document.addEventListener("click",function(e){var d=$("expop");if(d&&!d.contains(e.target))closeEx();});

   setPlay(false);closeEx();var L=LABEL[k]||[k,""];
   var uses=Object.keys(FILLS).map(function(i){return FILLS[i];}).filter(function(f){return f.from===k;});
   var d=document.createElement("div");d.className="expop";d.id="expop";
   var h='<button class="exx" id="exx">✕</button><div class="exh" style="color:#0b0c0c">'+esc(L[0])+'</div>';
   if(L[1])h+='<div class="exz">中文:'+esc(L[1])+'</div>';

   h+='<div class="exl">Answers that come from here</div>';
   if(uses.length){uses.forEach(function(f){var ex=f.ex||{};
     h+='<div class="exw">→ '+esc(f.q||"")+': <span style="color:#d4001e">'+esc(f.text)+'</span></div>'+(ex.why?'<div>'+esc(ex.why)+'</div>':'')+(ex.why_zh?'<div class="exz">'+esc(ex.why_zh)+'</div>':'')+'<button class="exgo" data-id="'+f.id+'">Show me this answer 看這個答案</button>';});}
   else h+='<div class="exw">This is the part the question is about. Look here first, then read the question again.</div><div class="exz">這是題目在問的地方。先看這裡,再讀一次題目。</div>';

   var r=anchor.getBoundingClientRect(),W=d.offsetWidth,H=d.offsetHeight,x=Math.min(innerWidth-W-10,Math.max(10,r.left)),y=r.bottom+8;if(y+H>innerHeight-70)y=Math.max(10,r.top-H-8);
   d.style.left=x+"px";d.style.top=y+"px";$("exx").onclick=function(e){e.stopPropagation();closeEx();};

 }
 document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest(".box.hl,.box.flash");if(b)showMark(b.id.slice(3),b);});
 function setBox(d,b){d.style.left=(b[0]*100)+"%";d.style.top=(b[2]*100)+"%";d.style.width=((b[1]-b[0])*100)+"%";d.style.height=((b[3]-b[2])*100)+"%";}
 function placePop(d,anchor){document.body.appendChild(d);var r=anchor.getBoundingClientRect(),W=d.offsetWidth,H=d.offsetHeight,x=Math.min(innerWidth-W-10,Math.max(10,r.left)),y=r.bottom+8;if(y+H>innerHeight-70)y=Math.max(10,r.top-H-8);
   d.style.left=x+"px";d.style.top=y+"px";var xb=d.querySelector("#exx");if(xb)xb.onclick=function(e){e.stopPropagation();closeEx();};
   d.querySelectorAll(".exgo").forEach(function(b){b.onclick=function(e){e.stopPropagation();var id=b.getAttribute("data-id");closeEx();locate(id);};});}
 function fillBlock(f){var ex=f.ex||{};return '<div class="exl">Answer '+esc(f.q||"")+'</div><div class="exw" style="color:#d4001e">'+esc(f.text)+'</div>'+(ex.why?'<div>'+esc(ex.why)+'</div>':'')+(ex.why_zh?'<div class="exz">'+esc(ex.why_zh)+'</div>':'')+'<button class="exgo" data-id="'+f.id+'">Show me this answer 看這個答案</button>';}
 function showQ(si,anchor){setPlay(false);closeEx();var s=STEPS[si],d=document.createElement("div");d.className="expop";d.id="expop";
   var h='<button class="exx" id="exx">✕</button><div class="exh" style="color:#0b0c0c">'+esc(s.tag)+'</div><div class="exw">'+esc(s.say||"")+'</div>'+(s.say_zh?'<div class="exz">'+esc(s.say_zh)+'</div>':"");

 function showHot(si,hi,anchor){setPlay(false);closeEx();var hh=STEPS[si].hot[hi],f=hh.fill?FILLS[hh.fill]:null,d=document.createElement("div");d.className="expop";d.id="expop";

 STEPS.forEach(function(s,si){(s.hot||[]).forEach(function(hh,hi){var st=$("st_"+s.wb);if(!st)return;var d=document.createElement("div");d.className="hot";setBox(d,hh.box);d.setAttribute("data-si",si);d.setAttribute("data-hi",hi);st.querySelector("img").after(d);});});
 STEPS.forEach(function(s,si){return;var st=$("st_"+s.wb);if(!st)return;var d=document.createElement("div");d.className="qhot";setBox(d,[s.wbfocus[0],s.wbfocus[2],s.wbfocus[1],s.wbfocus[3]]);d.setAttribute("data-si",si);st.querySelector("img").after(d);});

 function locate(id){setPlay(false);var i=FSTEP[id];if(i>=cur)go(i+1);else{var s=STEPS[i];setView(s);}var a=$("an_"+id);if(a)setTimeout(function(){showExplain(id,a);},450);}
 var ended=false;

 function setPlay(on){playing=on;$("play").textContent=on?"❚❚ Pause":"▶ Play";$("pp").textContent=on?"❚❚":"▶";if(on)unfreeze();else freeze();}

 document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);if(e.key===" "){e.preventDefault();$("play").onclick();}});
 var EST=STEPS.map(function(s,si){var t=2.3;(s.tbmark||[]).concat(s.wbmark||[]).forEach(function(k){if(MSTEP[k]===si&&LABEL[k])t+=3.15;});if(s.teach)t+=s.teach.length*0.02+0.9;(s.fills||[]).forEach(function(f){t+=0.25+(f.kind==="circle"?0.9:f.text.length*(f.text.length>40?0.014:0.045)+0.3);if(f.from)t+=1.12;if(f.teach)t+=f.teach.length*0.02+0.9;});t+=1.4;return Math.max(t,3.2);});
 var START=[],TOTAL=0;EST.forEach(function(e){START.push(TOTAL);TOTAL+=e;});
 var lastSec="";STEPS.forEach(function(s,i){if(!i)return;var k=document.createElement("div");k.className="tick";k.style.left=(START[i]/TOTAL*100)+"%";if(s.sec&&s.sec!==lastSec){var sp=document.createElement("span");sp.textContent=s.sec.charAt(0);k.appendChild(sp);k.style.background="#ffdd00";lastSec=s.sec;}$("track").appendChild(k);});
 function fmt(s){s=Math.max(0,Math.floor(s));return("0"+Math.floor(s/60)).slice(-2)+":"+("0"+(s%60)).slice(-2);}
 function nowT(){return START[cur]+Math.min(EST[cur],((paused?pauseAt:Date.now())-stepT0)/1000*SPEED);}
 setInterval(function(){var t=nowT();$("fill").style.width=(t/TOTAL*100)+"%";$("knob").style.left=(t/TOTAL*100)+"%";$("ptime").textContent=fmt(t)+" / "+fmt(TOTAL);},200);
 function seekFrac(f){var t=f*TOTAL,i=0;for(var j=0;j<START.length;j++)if(START[j]<=t)i=j;return i;}
 var dragging=false;
 function fracOf(e){var r=$("track").getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));}
 $("track").addEventListener("pointerdown",function(e){dragging=true;$("track").setPointerCapture(e.pointerId);var f=fracOf(e);$("knob").style.left=(f*100)+"%";});

   document.documentElement.style.setProperty("--tf",(0.9/SPEED)+"s");document.documentElement.style.setProperty("--tz",(0.6/SPEED)+"s");document.documentElement.style.setProperty("--tc",(0.8/SPEED)+"s");$("spd").value=String(v);$("spdv").textContent=v.toFixed(2)+"x";
