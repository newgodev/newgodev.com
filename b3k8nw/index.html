<!DOCTYPE html>
<html lang="zh-HK">
<head>
<script>if(location.protocol==="http:")location.replace("https://"+location.host+location.pathname+location.search);</script>
<meta charset="utf-8">
<meta name="hwv-kind" content="physics">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物理 HW1 畫光線 點樣畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0c0c;--muted:#505a5f;--line:#b1b4b6;--blue:#1d70b8;--red:#d4351c;--hi:#ffdd00;--ok:#00703c}
*{box-sizing:border-box}
html{background:#fff;font-size:17px}
body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans HK",Arial,sans-serif;line-height:1.6;padding-bottom:78px}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:6px solid var(--blue);padding:10px 16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-weight:900;color:#fff;background:var(--blue);border-radius:4px;padding:2px 12px}
.num{color:var(--muted);font-size:.85rem}
.legend{font-size:.85rem}.legend b.c{color:var(--blue)}.legend b.o{color:var(--red)}
.qmbtn{font-family:inherit;font-weight:900;font-size:.95rem;padding:6px 14px;border:2px solid var(--blue);background:var(--blue);color:#fff;border-radius:999px;cursor:pointer}
#qmenu{position:fixed;z-index:95;background:#fff;border:3px solid var(--blue);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:6px;max-height:75vh;overflow:auto;min-width:280px;display:none}
#qmenu.on{display:block}
#qmenu button{display:flex;gap:10px;width:100%;text-align:left;font-family:inherit;font-size:.95rem;font-weight:700;padding:8px 10px;border:0;border-bottom:1px solid #e3e3e3;background:#fff;cursor:pointer}
#qmenu button.on,#qmenu button:hover{background:#eef4fb}
.ctrl{margin-left:auto;display:flex;gap:8px}
.ctrl button{font-family:inherit;font-size:.95rem;font-weight:700;padding:7px 14px;border:2px solid var(--ink);background:#fff;border-radius:4px;cursor:pointer}
.ctrl button.main{background:var(--ink);color:#fff}
.say{font-size:1.12rem;font-weight:700;margin:8px 0 0;min-height:1.6em}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--ink);vertical-align:-2px;margin-left:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:16px;padding:14px 16px 24px;align-items:start}
.stage{border:2px solid var(--ink);border-radius:8px;min-height:420px;background:#fff;position:relative;overflow:hidden}
.scene{display:none;padding:8px 12px 16px}
.scene.on{display:block;animation:fade .45s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
svg{width:100%;height:auto;display:block}
.draw{stroke-dasharray:800;stroke-dashoffset:800}
.scene.on .draw{animation:ink 1.15s ease forwards}
.scene.on .d2{animation-delay:.45s}
.scene.on .d3{animation-delay:.9s}
.scene.on .d4{animation-delay:1.35s}
@keyframes ink{to{stroke-dashoffset:0}}
.popin{opacity:0;transform:scale(.86)}
.scene.on .popin{animation:popin .45s ease forwards}
.scene.on .p2{animation-delay:.7s}
.scene.on .p3{animation-delay:1.2s}
@keyframes popin{to{opacity:1;transform:none}}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 rgba(255,221,0,0))}50%{filter:drop-shadow(0 0 6px rgba(255,180,0,.9))}}
.side{display:flex;flex-direction:column;gap:12px}
.brain{border:3px solid var(--red);border-radius:14px;padding:10px 12px;min-height:150px;background:#fff}
.brain.on{box-shadow:0 0 0 6px rgba(212,53,28,.18)}
.bh{font-weight:900;color:var(--red);font-size:.85rem}
.bt{font-size:1.02rem;font-weight:700;white-space:pre-line;min-height:4.2em}
.paper{border:2px solid var(--ink);border-radius:6px;padding:10px 12px 14px;min-height:220px;background:#fff}
.paper h2{margin:0 0 6px;font-size:.95rem}
.paper h2 span{font-weight:400;color:var(--muted)}
.line{font-weight:900;font-size:1.05rem;margin:4px 0}
.line b{color:var(--red)}
.ans{margin-top:8px;background:var(--hi);border:2px solid var(--ink);border-radius:6px;padding:8px 10px;font-weight:900}
.fly{position:fixed;z-index:60;background:var(--hi);border:2px solid var(--ink);border-radius:6px;padding:6px 12px;font-weight:900;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:left .7s cubic-bezier(.5,0,.2,1),top .7s cubic-bezier(.5,0,.2,1),transform .7s}
.player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0b0c0c;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.player button{font-family:inherit;font-size:1rem;font-weight:900;width:48px;height:36px;border:0;border-radius:4px;background:#fff;color:#0b0c0c;cursor:pointer}
.track{position:relative;flex:1;height:14px;background:#444;border-radius:999px;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hi);border-radius:999px}
.knob{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff;border:3px solid var(--hi);left:0}
.ptime{font-size:.85rem;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
.spd{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:900}
.spd input{width:110px;accent-color:#ffdd00}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>

  <div class="row">

<div class="grid">
  <div class="stage" id="stage">

    <div class="scene" id="sc-open">

        <path class="draw d3" d="M380 210 A70 70 0 0 0 432 158" fill="none" stroke="#00703c" stroke-width="4"/>
        <text class="popin p3" x="470" y="150" font-size="20" fill="#00703c" font-weight="900">3 另一邊同一個角</text>

    <div class="scene" id="sc-q1">
      <svg viewBox="0 0 760 420">

        <text x="128" y="158" font-size="28" font-weight="900">太陽</text>

    </div>

    <div class="scene" id="sc-q2">
      <svg viewBox="0 0 760 420">
        <polyline points="80,80 280,250 680,80" fill="none" stroke="#0b0c0c" stroke-width="8"/>
        <path class="draw" d="M130 130 L250 210 L500 130" fill="none" stroke="#d4351c" stroke-width="5"/>
        <text class="popin" x="150" y="190" font-size="32" font-weight="900">40°</text>
        <text class="popin p2" x="430" y="190" font-size="32" font-weight="900" fill="#d4351c">α</text>

    </div>

    <div class="scene" id="sc-q3">
      <svg viewBox="0 0 760 420">
        <rect x="90" y="90" width="40" height="180" fill="none" stroke="#1d70b8" stroke-width="4"/>
        <text x="70" y="300" font-size="22" font-weight="700">野</text>

        <path class="draw d2" d="M130 270 L590 192" stroke="#d4351c" stroke-width="4"/>
        <polygon class="popin p2" points="560,160 578,172 548,176" fill="#d4351c"/>
        <polygon class="popin p3" points="560,198 578,188 548,204" fill="#d4351c"/>
        <text class="popin p3" x="70" y="370" font-size="24" font-weight="900">最上同最下各一條去眼　箭咀指向眼</text>
      </svg>
    </div>

    <div class="scene" id="sc-q4a">
      <svg viewBox="0 0 760 420">
        <path d="M140 300 A240 240 0 0 1 620 300" fill="none" stroke="#0b0c0c" stroke-width="3"/>
        <line x1="380" y1="60" x2="380" y2="300" stroke="#1d70b8" stroke-width="3" stroke-dasharray="8 6"/>
        <text x="392" y="80" font-size="22" fill="#1d70b8" font-weight="900">0°</text>
        <line x1="150" y1="300" x2="610" y2="300" stroke="#0b0c0c" stroke-width="8"/>
        <text x="90" y="330" font-size="20">90°</text>
        <text x="630" y="330" font-size="20">90°</text>
        <path class="draw pulse" d="M250 110 L380 300" stroke="#d4351c" stroke-width="5"/>
        <text class="popin p2" x="180" y="150" font-size="28" font-weight="900" fill="#d4351c">30°</text>
        <text class="popin p3" x="80" y="390" font-size="26" font-weight="900">入射 30°　反射 30°</text>
      </svg>
    </div>

    <div class="scene" id="sc-q4b">
      <svg viewBox="0 0 760 420">
        <line x1="80" y1="280" x2="680" y2="280" stroke="#0b0c0c" stroke-width="8"/>
        <line x1="380" y1="60" x2="380" y2="280" stroke="#1d70b8" stroke-width="3" stroke-dasharray="8 6"/>
        <path class="draw" d="M200 150 L380 280" stroke="#d4351c" stroke-width="5"/>
        <text class="popin" x="200" y="250" font-size="26" font-weight="900">50° 同鏡</text>
        <text class="popin p2" x="400" y="180" font-size="26" font-weight="900" fill="#1d70b8">90 - 50 = 40°</text>
        <text class="popin p3" x="80" y="370" font-size="28" font-weight="900">入射 40°　反射 40°</text>
      </svg>
    </div>

    <div class="scene" id="sc-q4c">
      <svg viewBox="0 0 760 420">
        <line x1="80" y1="300" x2="680" y2="300" stroke="#0b0c0c" stroke-width="8"/>
        <line x1="380" y1="70" x2="380" y2="300" stroke="#1d70b8" stroke-width="3" stroke-dasharray="8 6"/>
        <path class="draw" d="M180 120 L380 300" stroke="#d4351c" stroke-width="5"/>
        <path class="draw d2" d="M380 300 L600 130" stroke="#00703c" stroke-width="5"/>
        <path class="draw d3" d="M300 175 A90 90 0 0 1 470 175" fill="none" stroke="#0b0c0c" stroke-width="3"/>
        <text class="popin p3" x="330" y="150" font-size="28" font-weight="900">110°</text>
        <text class="popin p3" x="70" y="380" font-size="26" font-weight="900">110 除 2　入射 55°　反射 55°</text>
      </svg>
    </div>

    <div class="scene" id="sc-q4d">
      <svg viewBox="0 0 760 420">
        <line x1="80" y1="280" x2="680" y2="280" stroke="#0b0c0c" stroke-width="8"/>
        <line x1="380" y1="40" x2="380" y2="280" stroke="#1d70b8" stroke-width="3" stroke-dasharray="8 6"/>
        <path class="draw" d="M380 40 L380 280" stroke="#d4351c" stroke-width="5"/>
        <path class="draw d2" d="M392 280 L392 70" stroke="#00703c" stroke-width="5"/>
        <rect x="380" y="250" width="28" height="28" fill="none" stroke="#0b0c0c" stroke-width="3"/>
        <text class="popin p2" x="420" y="120" font-size="24" font-weight="900">貼住法線，直角</text>
        <text class="popin p3" x="80" y="370" font-size="28" font-weight="900">入射 0°　反射 0°　光彈返同一條線</text>
      </svg>
    </div>

    <div class="scene" id="sc-q5">
      <svg viewBox="0 0 760 420">
        <polyline points="70,40 230,250 700,250" fill="none" stroke="#0b0c0c" stroke-width="8"/>
        <text x="70" y="32" font-size="24" font-weight="900">M1</text>
        <text x="640" y="240" font-size="24" font-weight="900">M2</text>
        <text x="280" y="290" font-size="24" font-weight="900">120°</text>
        <path class="draw" d="M120 70 L250 190" stroke="#d4351c" stroke-width="5"/>
        <text class="popin" x="90" y="130" font-size="22" font-weight="900">30° 同鏡</text>
        <path class="draw d2" d="M250 190 L470 190" stroke="#00703c" stroke-width="5"/>
        <path class="draw d3" d="M470 190 L620 80" stroke="#1d70b8" stroke-width="5"/>
        <text class="popin p3" x="80" y="370" font-size="24" font-weight="900">M1 入射 60° 反射 60°　M2 都係 60° 同 60°</text>

    </div>

    <div class="scene" id="sc-end">
      <svg viewBox="0 0 760 420">
        <text x="40" y="70" font-size="32" font-weight="900">抄呢度</text>

        <text x="40" y="250" font-size="26">Q4 (a) 30°，30°</text>
        <text x="40" y="290" font-size="26">Q4 (b) 40°，40°</text>
        <text x="40" y="330" font-size="26">Q4 (c) 55°，55°　(d) 0°，0°</text>
        <text x="40" y="380" font-size="26">Q5 M1 60° 同 60°，M2 60° 同 60°</text>

  </div>
  <div class="side">
    <div class="brain" id="brain"><div class="bh">點解</div><div class="bt" id="braintext"></div></div>
    <div class="paper"><h2>而家寫落去 <span>紅字先唔好抄，聽完先</span></h2><div id="work"></div></div>
  </div>
</div>
<div id="qmenu"></div>
<div class="player">
  <button type="button" id="play" aria-label="播放">▶</button>

</div>
<script>
var BEATS = [
{menu:"開場", tag:"開場", scene:"sc-open", say:"今日唔係背答案。係學點畫條光線。撳播放，我帶你由第一題做到尾。", brain:"難唔係計數。\n難係知道度數由邊條線起計。", work:"", hold:4200},
{menu:"法線", tag:"法線", scene:"sc-rule", say:"先記一句。度數由虛線計，唔係由鏡計。虛線叫法線，垂直鏡面。", brain:"鏡面個角加法線個角，一定係 90。\n見到貼住鏡嘅度數，先用 90 減佢。", work:"", hold:4600},
{menu:"點畫", tag:"畫法", scene:"sc-how", say:"三步。畫虛線。由虛線量入射角。另一邊量同一個角，畫反射線。", brain:"箭咀跟住光行方向。\n入射線指向鏡，反射線指向走開。", work:"反射角 = 入射角", hold:4800},
{menu:"Q1", tag:"Q1", scene:"sc-q1", say:"第一題。邊樣自己會光？太陽會。筆同水樽要靠第二個光，唔算。", brain:"發光物件等如太陽、燈火、螢幕。\n筆同水樽唔會自己光。", work:"Q1 A", ans:"Q1 A", hold:4200},
{menu:"Q2", tag:"Q2", scene:"sc-q2", say:"第二題。40度同 α 都係光線貼住鏡面個角，唔係法線角。三個角加埋 180。", brain:"兩塊鏡中間 120。\nα = 180 - 120 - 40。", work:"Q2 A，20°", ans:"20°", hold:4800},

var i = 0, playing = false, speed = 1, token = 0, timers = [];
var say = document.getElementById("say");
var brain = document.getElementById("brain");
var braintext = document.getElementById("braintext");
var work = document.getElementById("work");
var tag = document.getElementById("tag");
var num = document.getElementById("num");
var fill = document.getElementById("fill");
var knob = document.getElementById("knob");
var ptime = document.getElementById("ptime");
var menu = document.getElementById("qmenu");
var playBtn = document.getElementById("play");
var playTop = document.getElementById("playtop");
function later(fn, ms){
  var my = token;
  var id = setTimeout(function(){ if(my!==token) return; fn(); }, ms / speed);
  timers.push(id);
}
function stopTimers(){ timers.forEach(clearTimeout); timers = []; token++; }
function clock(ms){ var s=Math.round(ms/1000); return Math.floor(s/60)+":"+(s%60<10?"0":"")+(s%60); }
var total = BEATS.reduce(function(a,b){ return a + b.hold; }, 0);
function at(n){ var t=0; for(var k=0;k<n;k++) t += BEATS[k].hold; return t; }
function typeInto(el, text, done){
  el.textContent = "";
  var c = document.createElement("span"); c.className = "caret"; el.appendChild(c);
  var n = 0;
  (function tick(){
    n++;
    el.textContent = text.slice(0, n);
    el.appendChild(c);
    if(n < text.length) later(tick, 28); else later(function(){ c.remove(); done(); }, 80);
  })();
}
function setWork(text){
  if(!text){ return; }
  var row = document.createElement("div");
  row.className = "line";
  work.appendChild(row);
  typeInto(row, text, function(){});
}
function fly(text){
  var paper = document.querySelector(".paper");
  var f = document.createElement("div");
  f.className = "fly"; f.textContent = text;
  f.style.left = "38%"; f.style.top = "42%";
  document.body.appendChild(f);
  var r = paper.getBoundingClientRect();
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    f.style.left = (r.left + 16) + "px";
    f.style.top = (r.top + 36) + "px";
    f.style.transform = "scale(.9)";
  }); });
  later(function(){ f.style.opacity = "0"; }, 900);
  later(function(){ f.remove(); }, 1300);
}
function show(n){
  stopTimers();
  i = Math.max(0, Math.min(BEATS.length-1, n));
  var b = BEATS[i];
  tag.textContent = b.tag;
  num.textContent = (i+1) + " / " + BEATS.length;
  document.querySelectorAll(".scene").forEach(function(s){ s.classList.remove("on"); });
  var sc = document.getElementById(b.scene);
  void sc.offsetWidth;
  sc.classList.add("on");
  brain.classList.add("on");
  var pos = at(i) / total * 100;
  fill.style.width = pos + "%";
  knob.style.left = pos + "%";
  ptime.textContent = clock(at(i)) + " / " + clock(total);
  Array.prototype.forEach.call(menu.children, function(btn, k){ btn.classList.toggle("on", k===i); });
  typeInto(say, b.say, function(){
    typeInto(braintext, b.brain, function(){
      brain.classList.remove("on");
      if(b.work){
        var lines = work.querySelectorAll(".line");
        var last = lines.length ? lines[lines.length-1].textContent : "";
        if(last !== b.work) setWork(b.work);
      }
      if(b.ans) fly(b.ans);
      if(playing) later(function(){ if(i < BEATS.length-1) show(i+1); else { playing=false; paintPlay(); } }, b.hold);
    });
  });
}
function paintPlay(){
  playBtn.textContent = playing ? "⏸" : "▶";
  playTop.textContent = playing ? "⏸ 暫停" : "▶ 播放";
}
function toggle(){ playing = !playing; paintPlay(); if(playing){ if(i===BEATS.length-1) show(0); else show(i); } else stopTimers(); }
BEATS.forEach(function(b, n){
  var btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = b.menu;
  btn.addEventListener("click", function(){ menu.classList.remove("on"); show(n); });
  menu.appendChild(btn);
});
document.getElementById("qmbtn").addEventListener("click", function(e){
  var r = e.currentTarget.getBoundingClientRect();
  menu.style.left = r.left + "px";
  menu.style.top = (r.bottom + 6) + "px";
  menu.classList.toggle("on");
});
document.getElementById("next").addEventListener("click", function(){ show(i+1); });
document.getElementById("prev").addEventListener("click", function(){ show(i-1); });
playBtn.addEventListener("click", toggle);
playTop.addEventListener("click", toggle);
document.getElementById("spd").addEventListener("input", function(e){
  speed = Number(e.target.value);
  document.getElementById("spdl").textContent = speed.toFixed(1) + "x";
});
document.getElementById("track").addEventListener("click", function(e){
  var r = e.currentTarget.getBoundingClientRect();
  var p = (e.clientX - r.left) / r.width;
  var t = p * total, acc = 0, n = 0;
  for(var k=0;k<BEATS.length;k++){ if(acc + BEATS[k].hold > t){ n = k; break; } acc += BEATS[k].hold; n = k; }
  show(n);
});
show(0);
</script>
</body>
</html>
