<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物理 HW1 畫光線</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #fff; color: #111; font-family: "Microsoft JhengHei", sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; }
.top { display: flex; gap: 10px; align-items: center; padding: 8px 12px; position: relative; }
.qmbtn { background: #1a73e8; color: #fff; border: 0; border-radius: 999px; padding: 8px 14px; font-size: 16px; cursor: pointer; }
#qmenu { display: none; position: absolute; top: 48px; left: 12px; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; min-width: 240px; z-index: 8; box-shadow: 0 10px 28px rgba(0,0,0,.12); padding: 6px; }
#qmenu button { display: block; width: 100%; text-align: left; background: #fff; border: 0; border-radius: 8px; padding: 9px 12px; font-size: 16px; cursor: pointer; }
#qmenu button.on { color: #1a73e8; font-weight: 700; background: #f3f8ff; }
.stage { flex: 1; display: flex; min-height: 0; gap: 12px; padding: 0 12px 8px; }
.cam { flex: 1.15; overflow: hidden; border: 1px solid #eee; border-radius: 12px; background: #fff; }
.cam img { width: 100%; display: block; transform-origin: 50% 0; transition: transform .45s ease; }
.side { flex: .85; overflow: auto; padding-right: 4px; }
.k { font-size: 13px; color: #888; }
.brain { background: #fff5f5; border-left: 4px solid #d33; padding: 8px 10px; margin: 8px 0; font-size: 16px; }
.say { font-size: 20px; line-height: 1.55; min-height: 5em; }
.ans { font-size: 22px; font-weight: 700; margin-top: 8px; }
.player { height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-top: 1px solid #eee; }
button.ctl { border: 1px solid #ddd; background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
#seek { flex: 1; }
#spd { width: 120px; }
@media (max-width: 1100px) {
  body { overflow: auto; height: auto; }
  .stage { flex-direction: column; }
  .cam { max-height: 52vh; }
}
</style>
</head>
<body>
<div class="top">
  <button class="qmbtn" id="qmbtn" type="button">目錄：開場 ▾</button>
  <button class="ctl" id="ipad" type="button">手機模式</button>
  <div id="qmenu"></div>
</div>
<div class="stage">
  <div class="cam"><img id="page" alt="工作紙原相" src="p/q12.jpg"></div>
  <div class="side">
    <div class="k" id="kicker">物理 HW1 · Book 3A Chapter 1</div>
    <div class="brain" id="brain"></div>
    <div class="say" id="say"></div>
    <div class="ans" id="ans"></div>
  </div>
</div>
<div class="player">
  <button class="ctl" id="play" type="button">暫停</button>
  <input id="seek" type="range" min="0" max="12" value="0">
  <span id="clock">1 / 13</span>
  <span>速度</span>
  <input id="spd" type="range" min="0.5" max="10" step="0.1" value="1">
  <span id="spdv">1.0x</span>
</div>
<script>
var STEPS = [
  { menu:"開場", img:"p/q12.jpg", z:"scale(1)", o:"50% 0",
    brain:"你的腦這樣想：角度由 normal（虛線，同鏡面成 90°）量出嚞。",
    say:"今日工作紙就係你影嘅呢張。我唔會自己畫過第二張圖。先記住：angle of incidence 同 angle of reflection 一定由虛線量，唔係由鏡面量。",
    ans:"" },
  { menu:"Q1 發光", img:"p/q12.jpg", z:"scale(1.45)", o:"42% 6%",
    brain:"luminous object 係自己發光。反射光唔算。",
    say:"(1) The Sun 自己發光。(2) A pen 同 (3) A water bottle 要有光照住先見到。所以淨係得 (1)。",
    ans:"填 A" },
  { menu:"Q2 兩塊鏡", img:"p/q12.jpg", z:"scale(1.55)", o:"48% 58%",
    brain:"同一種角（光線貼住鏡面）先加埋。三角形內角加埋 180°。",
    say:"40° 係入射線貼住左鏡，120° 係兩塊鏡中間，α 都係貼住右鏡。三角形：40 + 120 + α = 180，α = 20。",
    ans:"填 A，20°" },
  { menu:"Q3 光錐", img:"p/q3.jpg", z:"scale(1)", o:"50% 0",
    brain:"要見到成件物件，就由物件嘅頂同底，各畫一條線入眼，箭嘴指住眼。",
    say:"cone of rays。每件野都係兩條線，一條由頂，一條由底，入呢隻眼。",
    ans:"" },
  { menu:"Q3(a) 香蕉", img:"p/q3.jpg", z:"scale(1.7)", o:"45% 8%",
    brain:"一隻眼，一個光錐。",
    say:"由香蕉頂畫一條入佬眼，由香蕉底再畫一條入同一隻眼。箭嘴都指住眼。",
    ans:"兩條線，箭嘴指住眼" },
  { menu:"Q3(b) 飛機", img:"p/q3.jpg", z:"scale(1.7)", o:"50% 36%",
    brain:"飛機嘅頭同尾，就係物件嘅兩頭。",
    say:"一條由機頭入眼，一條由機尾入同一隻眼。",
    ans:"兩條線，箭嘴指住眼" },
  { menu:"Q3(c) 樹", img:"p/q3.jpg", z:"scale(1.65)", o:"48% 72%",
    brain:"兩隻眼，每隻眼自己一個光錐。",
    say:"上便隻眼由樹頂同樹底各入一條。下便隻眼再由樹頂同樹底各入一條。一共四條。",
    ans:"四條線，每隻眼兩條" },
  { menu:"Q4(a) 量角器", img:"p/q4.jpg", z:"scale(1.85)", o:"58% 4%",
    brain:"0° 嗰條虛線就係 normal。90° 喺鏡面。由 0 數落去光線。",
    say:"光線由左上落嚞。由頂部 0° 數，10、20、30。angle of incidence 係 30°。反射角等如入射角。",
    ans:"(i) 30°   (ii) 30°" },
  { menu:"Q4(b) 50°", img:"p/q4.jpg", z:"scale(1.8)", o:"52% 34%",
    brain:"貼住鏡面嘅角，加埋由 normal 量嘅角，一定係 90°。",
    say:"50° 係光線貼住 mirror。入射角 = 90 − 50 = 40。反射角都係 40。",
    ans:"(i) 40°   (ii) 40°" },
  { menu:"Q4(c) 110°", img:"p/q4.jpg", z:"scale(1.9)", o:"28% 62%",
    brain:"入射線同反射線中間嘅角 = 2 × 入射角。",
    say:"110° 係兩條光線中間。除以 2，入射角同反射角都係 55°。",
    ans:"(i) 55°   (ii) 55°" },
  { menu:"Q4(d) 直射", img:"p/q4.jpg", z:"scale(1.9)", o:"32% 86%",
    brain:"光線沿住 normal 落嚞，入射角係 0。",
    say:"個直角話佢沿住虛線打落鏡。入射角 0°，反射角 0°，光沿原路反彈。",
    ans:"(i) 0°   (ii) 0°" },
  { menu:"Q5 畫路", img:"p/q5.jpg", z:"scale(1.35)", o:"50% 8%",
    brain:"from the mirror surface 係貼住鏡面，唔係 normal。入射角 = 90 − 貼鏡角。",
    say:"M1 貼住鏡面 30°，所以入射角 60°，反射角 60°。兩塊鏡中間 120°。三角形入面貼 M2 都係 30°，所以 M2 入射角同反射角都係 60°。畫：打落 M1，彈去 M2，再彈出嚞。",
    ans:"M1  60° / 60°\nM2  60° / 60°" },
  { menu:"抄答案", img:"p/q12.jpg", z:"scale(1)", o:"50% 0",
    brain:"一格一句。唔好加解釋。",
    say:"Q1 填 A。Q2 填 A。Q4(a) 30° 同 30°。(b) 40° 同 40°。(c) 55° 同 55°。(d) 0° 同 0°。Q5 兩塊鏡都係 60° 同 60°。Q3 同 Q5(a) 要畫線。",
    ans:"照住工作紙抄" }
];
var i = 0, paused = false, speed = 1, token = 0, timers = [];
var sayEl = document.getElementById("say");
var brainEl = document.getElementById("brain");
var ansEl = document.getElementById("ans");
var page = document.getElementById("page");
var menu = document.getElementById("qmenu");
var btn = document.getElementById("qmbtn");
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
function later(fn, ms){
  var my = token, left = ms;
  function tick(){
    if (my !== token) return;
    if (paused){ timers.push(setTimeout(tick, 80)); return; }
    left -= 40 * speed;
    if (left <= 0) fn();
    else timers.push(setTimeout(tick, 40));
  }
  timers.push(setTimeout(tick, 40));
}
function typeInto(el, text, done){
  el.textContent = "";
  var n = 0;
  (function step(){
    if (n >= text.length){ if (done) done(); return; }
    later(function(){ el.textContent += text.charAt(n); n++; step(); }, 28);
  })();
}
function show(n){
  token++; clearTimers();
  i = n;
  var s = STEPS[n];
  page.src = s.img;
  page.style.transform = s.z;
  page.style.transformOrigin = s.o;
  brainEl.textContent = s.brain;
  ansEl.textContent = "";
  btn.textContent = "目錄：" + s.menu + " ▾";
  document.getElementById("seek").value = n;
  document.getElementById("clock").textContent = (n + 1) + " / " + STEPS.length;
  menu.querySelectorAll("button").forEach(function(b, k){ b.className = k === n ? "on" : ""; });
  typeInto(sayEl, s.say, function(){
    later(function(){ ansEl.textContent = s.ans; }, 200);
    if (!paused && n < STEPS.length - 1) later(function(){ show(n + 1); }, 1600);
  });
}
STEPS.forEach(function(s, k){
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = s.menu;
  b.onclick = function(){ menu.style.display = "none"; show(k); };
  menu.appendChild(b);
});
btn.onclick = function(e){
  e.stopPropagation();
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};
document.addEventListener("click", function(){ menu.style.display = "none"; });
document.getElementById("play").onclick = function(){
  paused = !paused;
  this.textContent = paused ? "播放" : "暫停";
};
document.getElementById("seek").oninput = function(){ show(+this.value); };
document.getElementById("spd").oninput = function(){
  speed = +this.value;
  document.getElementById("spdv").textContent = speed.toFixed(1) + "x";
};
document.getElementById("ipad").onclick = function(){
  var on = document.body.classList.toggle("ipad");
  try { localStorage.setItem("hw_ipad_mode", on ? "1" : "0"); } catch (e) {}
};
try { if (localStorage.getItem("hw_ipad_mode") === "1") document.body.classList.add("ipad"); } catch (e) {}
show(0);
</script>
</body>
</html>
